periences both wondrous and strange. The third way of meditation is most reliable and it is the foundation of all exercises."]],"advice":[]},{"title":"Morsel 19","blocks":[["p","One should gaze for a long time in a mirror until, when you look at your own face, you imagine it to be the face of your spiritual guide and this perception becomes firm and fixed. Keep up this gazing until you attain a state of self-absence from your senses."]],"advice":[]},{"title":"Morsel 20","blocks":[["p","One should gaze at the name of God (Allah) written in characters of silver or gold ink, fixing one’s sight fixed on it. Similarly, one could inscribe the name of God in one’s imagination upon the scroll of the heart and then concentrate upon it until one attains a state of self-absence from the senses."]],"advice":[]}]},{"id":"con","title":"Conclusion","sub":"Morsels 1–19","items":[{"title":"Conclusion","blocks":[["p","All that which is written in the two preceding chapters deserves your careful attention—and may God seal your good deeds with the best of seals. Anyone who takes up these varieties of meditation and types of contemplation will surely attain the goal (of God-consciousness). But anyone who tries them without firm resolve, persistent practice and total absorption will find the goal far away. To fancy that a mere perusal of these pages without practice will bring success will reveal one’s vanity. It proves the saying that “this world depends on actions not words.” The harder one practices the further one gets. The Sufi master Abu Hafs al-Haddad states, “Sufism is merely cooking what one imagines until it is done.” The reality is that when certain imaginings become cooked and ripe and enter the mind of the soul, strange and wondrous effects are seen in both common people and spiritual masters, effects that produce a delight in those who experience them and provoke astonishment in those who look on."],["p","But there are selfish people who call themselves Sufis yet are content with a mere knowledge of the variety of meditation and contemplation practices. In their case, we hope for the largess of God’s patient restraint, which surely is vaster than their sins, and if not, then they surely will come to ruin. Some people like this descend even lower, and in order to earn a good reputation in the eyes of others they dabble in these practices for a short time; yet when they fail to feel any effect or spiritual delight, they give up in despair and become engrossed in worldly aspirations. And some others with scanty progress are filled with pride and proclaim themselves to be spiritual masters, and dupe people and fall into that whirlpool. But what does it benefit a sinful man to follow a sinful man? I take refuge with God from such people, and you should too!"],["p","A real spiritual master is one who takes to the spiritual path and yet, until he really feels its effect and can affect others, refrains from announcing himself to others and calling attention to himself. This modest caution is more than enough to warn the negligent, and under God’s command are all affairs."],["p","Now to the point, this conclusion describes the special way that a disciple of right understanding experiences meditation. Were he to begin with a righteous disposition and according to the instructions detailed, there is every hope that he would advance quickly and steadily from stage to stage and in the shortest time achieve a state of spiritual comprehensiveness (jam‵). Some of these experiences I have already alluded to in the midst of describing the various methods of meditation. But God is the ultimate dispenser of success, and any benefit that one gets should be looked for with God, upon whom I trust in every moment and every deed."]],"advice":["All that which is written in the two preceding chapters deserves your careful attention—and may God seal your good deeds with the best of seals.","I take refuge with God from such people, and you should too!","But God is the ultimate dispenser of success, and any benefit that one gets should be looked for with God, upon whom I trust in every moment and every deed."]},{"title":"Morsel 1","blocks":[["p","You should know that everything that can be known is either essential (basit) or compound (murakkab). If one knows something to be singular, that is the same from every direction and in every condition, then it is necessarily knowledge and apprehension of an essential thing. If one knows something to be multiple, yet one knows it in a general way as singular, then this is also knowledge of an essential thing. Surely the first case is knowledge of a thing that is essential in its reality, and the second is knowledge of a thing that is essential in its effect. If something is known which is not singular from every direction and in every condition, or which is multiple yet is seen in general as single, then there is no doubt that it is a thing compound. The community of Sufis who strive for purity are those who endeavor to leave aside anything known as compound and cleave that which is known as essential, namely to the one necessary being (wajib al-wajud, a philosophical term for God). They do this in such a way that at all times, or at least in most times, they are engrossed in comprehension of that singular essential being and ignore the distracting multiplicity of things other than this. In this way, being obliterated in God (fana’ fi ‘llah) is obliterating everything other than God and ultimate obliteration is obliterating any sense of this obliteration!"]],"advice":["You should know that everything that can be known is either essential (basit) or compound (murakkab)."]},{"title":"Morsel 2","blocks":[["p","One should sit in an isolated corner, facing towards the direction of Mecca, with full ritual ablutions. One should close the eyes and cleave the tongue firmly to the palette. One should imagine that “the flesh of the heart is saying Allah, but I do not hear it” and one should strive to hear it. One should summon one’s firmest resolve to hear it. After some time, with the aid of God’s grace, one will begin to feel a vibration which may be understood to be the motion of the heart or the motion of the egoistic self (nafs) or the motion of tempting thoughts (waswas). When one reaches this point, one must summon even more firm resolve so that this vibration becomes more apparent, such that it overwhelms the motion of the egoistic self and of tempting thoughts. Then one knows by experience that the flesh of the heart is moving with a vibration that says Allah. When one has been blessed with this happiness, then one can summon the spiritual aspiration to listen—whether alone or in the company of others—for the silent speech of one’s own heart. At this point, one realizes that the heart is perpetually meditating on God by repeating the name Allah. Realizing this spiritual fortune is the true goal of every devotional exercise, though some achieve it sooner and some later, some with slight effort and some with intense concentration. As the Qu’ran says, “Never despair of being with God’s spirit for indeed the only ones who despair of God’s spirit are those who are unbelievers.”\u000144\u0001"]],"advice":["One should sit in an isolated corner, facing towards the direction of Mecca, with full ritual ablutions.","One should close the eyes and cleave the tongue firmly to the palette.","One should imagine that “the flesh of the heart is saying Allah, but I do not hear it” and one should strive to hear it.","One should summon one’s firmest resolve to hear it.","When one reaches this point, one must summon even more firm resolve so that this vibration becomes more apparent, such that it overwhelms the motion of the egoistic self and of tempting thoughts.","As the Qu’ran says, “Never despair of being with God’s spirit for indeed the only ones who despair of God’s spirit are those who are unbelievers.”\u000144\u0001"]},{"title":"Morsel 3","blocks":[["p","Sometimes it happens that the flow of breathing obscures one’s ability to hear this vibration. To prevent this, the breath should be suspended just beneath the navel. In this way, the heart becomes like water, tranquil in a basin, that is preserved from being obscured by any waves or agitation and therefore can reflect the image of something other than itself. One should be careful not to suspend the breath to such an extent that one becomes deadly sick. Still, the danger of suspending the breath is less than the danger of never suspending it. Suspending the breath should be done according to one’s own capacity. And when the suspending breath is exhaled, it should be released gradually and gently, and during exhaling also one should pay close attention to the heart’s vibration."]],"advice":["To prevent this, the breath should be suspended just beneath the navel.","One should be careful not to suspend the breath to such an extent that one becomes deadly sick.","Still, the danger of suspending the breath is less than the danger of never suspending it.","Suspending the breath should be done according to one’s own capacity.","And when the suspending breath is exhaled, it should be released gradually and gently, and during exhaling also one should pay close attention to the heart’s vibration."]},{"title":"Morsel 4","blocks":[["p","Once one becomes aware of this vibration and the heart is known to be continuously meditating (with God’s name), then one must try to preserve this awareness. Initially, awareness of this will be so weak that in a mere moment or with the least distraction one can forget it. One cannot always be aware of it when one tries, yet one must continually try, because to stop trying is the cause of losing spiritual concentration such that awareness of this vibration is lost. One should never succumb to discontent or despair! Rather, one should keep trying, while acknowledging one’s inability and weakness and waywardness and humbleness. Most often, one looses hold of this vibration because of the incessant speaking of the ego (hadith-i nafs) or tempting thoughts or distracting knowledge of the multiplicity of existing things, as mentioned earlier at the start of the last chapter. It is impossible for the heart to attend to two things at one and the same time."]],"advice":["Once one becomes aware of this vibration and the heart is known to be continuously meditating (with God’s name), then one must try to preserve this awareness.","One cannot always be aware of it when one tries, yet one must continually try, because to stop trying is the cause of losing spiritual concentration such that awareness of this vibration is lost.","One should never succumb to discontent or despair!","Rather, one should keep trying, while acknowledging one’s inability and weakness and waywardness and humbleness."]},{"title":"Morsel 5","blocks":[["p","When this great experience is finally realized, one should not think it a light and trifling thing. Rather, one should strive to cultivate one’s connection to it day and night. If some other indispensable affair commands one’s attention, one may put it aside for a while. If other kinds of worship, like supererogatory prayers or reciting litanies or reading Qur’an, interfere with one’s connection to this vibration, then one should put them aside. But if these acts of worship do not interfere with it, then one should continue with them, for perhaps that will aid one to maintain one’s connection with it."],["p","Little by little, one may open one’s eyes and still find that one maintains this connection and is still present with it. One should do this until one is able to keep one’s eyes open yet still fix one’s concentration upon the heart. This is called “alone in the midst of company” (khilvat dar anjuman). With divine aid, one finds that this connection with the heart grows in strength, such that if one gets distracted one can, with just the slightest concentration, find it again. When it is found again, this connection will last even longer and becomes extended. Soon, despite everything that interrupts and distracts one, this connection is maintained and does not dissipate. At this stage, one discovers the true delight of constant remembering (iltizaz-i zikr) and one attains spiritual comprehension (jam‵iyat)."]],"advice":["When this great experience is finally realized, one should not think it a light and trifling thing.","Rather, one should strive to cultivate one’s connection to it day and night.","If other kinds of worship, like supererogatory prayers or reciting litanies or reading Qur’an, interfere with one’s connection to this vibration, then one should put them aside.","But if these acts of worship do not interfere with it, then one should continue with them, for perhaps that will aid one to maintain one’s connection with it.","One should do this until one is able to keep one’s eyes open yet still fix one’s concentration upon the heart."]},{"title":"Morsel 6","blocks":[["p","When the vibration reaches the point when one hears the voice of the heart reciting the name of God with no difficulty, then this vibration—which was formerly concentrated in the pine-cone shaped organ of the heart (dil-i sanubari) —begins to spread all over the body. The vibration spreads in such a way that it manifests in one part of the body. Just as one sensed this vibration emitting from the heart, one will begin to sense it emitting from that other part of the body. But one should not turns one’s attention to that part of the body but rather continue to focus one’s concentration upon the heart. One senses sometimes that the vibration is coming from the hand, or sometimes from the foot or the head, without one’s willing this to take place. But one should not pay attention to vibration in the limbs lest it distract one from the heart. In this matter, the heart is source and master, and the limbs of the body merely follow it."]],"advice":["But one should not turns one’s attention to that part of the body but rather continue to focus one’s concentration upon the heart.","But one should not pay attention to vibration in the limbs lest it distract one from the heart."]},{"title":"Morsel 7","blocks":[["p","When the light of remembrance begins to spread, it quickly expands to encompass regions of the body until it fills one from the top of the head to the lowest toe nail. Then all the various spiritual states will manifest themselves, and sometimes one will feel happy and elated, at other times one will feel anxious and bewildered, and other times one will feel sorrow and crying. But one should not be distracted by these states and should stay engrossed in meditative remembrance as the most important duty in one’s religion and worldly life."],["p","With divine aid, one might reach the point when one hears the whole entire body resonate with the name of God (Allah). Then all parts of the body resonate in harmony with the heart and call out with one voice and one tone. The vibration preponderates sometimes in some parts of the body more than in others, and sometimes it is felt equally in all of them. When it resonates equally in all of them, one experiences a more intense delight. In Sufi terms, this is known as “The Prime Recitation” (sultan al-zikr)."]],"advice":["But one should not be distracted by these states and should stay engrossed in meditative remembrance as the most important duty in one’s religion and worldly life."]},{"title":"Morsel 8","blocks":[["p","At first, recitation of the heart happens without the help of actually hearing it. But gradually, when recitation gets firmly fixed in the heart, then one usually hears it more and more clearly with one’s ears. To a seeker with a pure personality, the ability to hear the heart becomes stronger and stronger all by itself."],["p","Some contend that when one can hear the reciting voice of the heart it can be overheard by others. Indeed, it is a popular misconception that if one can hear one’s own heart vibrating with recitation that this can be heard by others as well. Some are of the opinion that the voice of the reciting heart can be heard by others from close or from afar, in accord with differing capacities of reciters and listeners, but this is a baseless claim. Shaykh Sharaf al-Din Yahya Maneri, the author of Mine of Meanings (Ma‵din al-Ma’ani), indicates this. If some support this popular conception, it may be as one performs this meditative recitation in the chest, a feeble sound in the throat is produced that others can hear and may think is the voice of the heart as it recites. But this is not the case. I myself have heard this and seen others react in this way."]],"advice":[]},{"title":"Morsel 9","blocks":[["p","It may be that one is overcoming with longing to discover some divine secret, and this may be an impediment to one’s spiritual advancement. If one’s inner reality throws up such distractions, then one should turn to one’s own spiritual guide with one’s inner attention and in one’s outer action, while observing all the norms of respectful conduct. If the spiritual guide perceives one’s spiritual plight and knows how to solve it, he might inform one of this directly or through some metaphor. Or winking, he might just say, “The time has not yet arrived for you to discover such a secret!”"]],"advice":["If one’s inner reality throws up such distractions, then one should turn to one’s own spiritual guide with one’s inner attention and in one’s outer action, while observing all the norms of respectful conduct."]},{"title":"Morsel 10","blocks":[["p","The goal of meditation is for one’s self to be obliterated in the object of meditation. So do not intend to simply recite the name of God with the tongue or the heart. Remind yourself, “Although this may seem beneficial to me, yet I will never achieve the goal without being in the presence of the object of meditation.” The goal of meditation is for one’s self to be obliterated in the object of meditation—that is God—rather than being obliterated in merely the name of the object of meditation. Do not let the name distract from the presence."]],"advice":["So do not intend to simply recite the name of God with the tongue or the heart.","Remind yourself, “Although this may seem beneficial to me, yet I will never achieve the goal without being in the presence of the object of meditation.”","Do not let the name distract from the presence."]},{"title":"Morsel 11","blocks":[["p","When one achieves connection with the vibration of recitation, one experiences many strange states and wondrous inspirations. One of these marvels is that one hears recitation from all things, even if this awareness comes gradually. One should not be arrested by this phenomenon, for the ultimate goal lies beyond this."],["p","There is a subtle point that one must understand at this stage, so that one does not get confused. When one is engaged in reciting the name of God (Allah) with the heart, one might hear other things reciting the name of God, such as the wilderness or the walls, the room, or the stones. One might hear even one’s hand or foot reciting the name of God! This is due to the one meditating being overcome with the power of one’s own recitation. It is not due to the fact that other things are actually also reciting. Secondly, it is true that all things that exist have a special recitation though which it meditates on God. Most scholars think that this recitation is a spiritual state (hali) that is particular to any particular thing, but others think that this recitation is what each thing actually says (maqali). So think about it. Each thing existing is different and so is characterized by a distinctive kind of recitation through which it meditates on God. Every species and every type of thing is engrossed in a distinctly appointed way of reciting. The differentiation of things requires a differentiation in their existential recitations. It might be tenable that while one is meditating by reciting the name of God, one might hear other things—like the wall or the door or the prayer carpet—reciting each in their own distinctive way. But to hear everything reciting the same way that one recites the name of God? That is untenable."]],"advice":["One should not be arrested by this phenomenon, for the ultimate goal lies beyond this.","There is a subtle point that one must understand at this stage, so that one does not get confused."]},{"title":"Morsel 12","blocks":[["p","After arriving at this furthest stage and lofty station, it may sometimes happen that while intensely concentrating on the heart, a vibration can be felt in the flesh of the heart (madgha) and in the arteries (shiryanat). This vibration is distinct from the first in its quality. The first has distinct pulses that start and stop, while the second is continuous. The first is like the sound of “Hu…Hu…” which repeats in succession, while the second one is like that of “Hu-u-u…” that is extended and continuous. The first vibration is like the sound of raindrops falling from high above and striking the ground in repeated pulses, with the sound of the falling and the sound of striking the ground being different. The second vibration is like the sound of a sheet of water pouring down from a height in one continuous motion without discrete drops of water being separable from others. The first vibration is like the sound of a hammer striking on an anvil with successive beats, and the second vibration is like that of a brass gong that is struck once and resounds with a continuous expansive sound."],["p","One should disregard whether the first type of vibration is stronger or weaker than the second. Suffice it to say that the second type of vibration is subtler in comparison with the first. For this reason, it is felt only after long practice. It should be understood that the seeker can sense the first type of vibration which starts and stops when reciting names like God (Allah), True One (haqq), He (hu) or other such name, because each name has a particular sound that has a beginning and end. So each name that has a beginning and end can generate the awareness of this first type of vibration that has discrete pulses. But the second vibration is continuous and singular without having any beginning or ending. So how could it be produced by reciting words and names whose sounds have beginning and end? This second type of vibration should be attributed to the object of meditation, namely God, rather than to the means of meditation, namely God’s names, as is done with the first vibration. In the first case, God is the object of meditative search with names and words, while in the second case, God is the realization of that meditation. This explanation I have heard from some Sufi masters, may God be content with them.\u000145\u0001"],["p","A detailed explanation of this is as follows. You may say, “The object of meditation and search (namely God) is characterized by the quality of being absolute, but the quality of being absolute is indeed limited by being a quality. Such a thing that has qualities cannot be truly absolute. Something is absolute by its being unqualified by any limited thing, not by its being qualified by nothingness. Thus when the seeker is aware of a vibration of the second type, he is still aware of something in the phenomenal world of sensory perception. So how can this vibration be attributed to God? Tell me if I am right or wrong!” I would answer that a thing that is related to absoluteness is nearer and closer to being absolute than something which is related to limitation. Therefore, since the second type of vibration is more absolute in its existence than the first type of vibration which is relative and limited, it shares more of the quality of the object sought which is absolute, namely God. That said, we can admit that both types vibration are of the existent world (‵alam-i tanazzulat) and both are manifestations of divine names and qualities. If one continues to cultivate these practices, with time it will become clear what is obliterated in obliteration and what is sustained in sustenance. This is the furthest goal."],["p","Now I round out this point by recounting a story. In my youth, one day I went to a spiritual master in order to learn the right way and the straight path. Before this point, I was always engrossed in devotional exercises. In fact, my devotions became so intense that I was left with a spiritual thirst that no devotion could quench. The master thought deeply and then said, “It is suitable for you now to be engrossed now in the eternal sound (sawt-i sarmadi) also known as the everlasting sound (sawt-i la-yazali), which is known amongst Yogins as the un-struck sound (anahad).” I replied, “I will do so, if you would confer this teaching to me.” He then told me, “Firmly close the holes of both ears with your forefingers. Then concentrate and listen within your mind for a sound that resembles the sound of water continuously falling from on high. Turn your entire concentration to listening for this sound and do not be distracted from hearing it for even a moment. When you become proficient in listening to this sound then withdraw your fingers from your ear bit by bit. As you do this, continue to concentrate on hearing it such that even in the world’s din you are not absent from this sound. Gradually, you must reach the stage where you hear this inner sound even without stopping up your ears with your fingers and never be disrupted by the distracting clamor of the world and worldly people. Rather, the eternal sound will overwhelm you regardless of all other external noises. In this state, you will feel bliss that is beyond words to describe.” Some people stuffed their ears with black pepper rolled in cotton, so that the heat generated by the pepper might make this sound more powerfully heard. But I heard from others that they tied string around the pepper to pull it out easily. Once it is stuffed into the ear it can be very hard to remove. Others wrap the pepper in a small piece of red silk so that the heat generated by the pepper is even more and the sound heard might be more intense. The pepper so used for a year is effective as a remedy for eye-diseases."],["p","When the spiritual master ceased speaking, I closed my ears with the fingers as I was told. Truly, I heard a murmuring resonance just like he had described. For a while I concentrated on this sound. I felt something in me that had not been there before. I turned to him and said, “Master, when will God remove the veil from the divine face? For that is what I seek and the stage of love is lower than that!” To this he said, “Miyan Mir of Lahore and his companions adopted the practice of listening for this eternal sound which they called “the divine presence (hazrat-i haqq)”. At that time I was a student and was spending all my time learning from books and was only a beginner on the spiritual path, so I was very sad to hear these words. At that time, I spurned this practice with disdain."],["p","But later I came to Medina, the blessed city that is lit up by the presence of the Prophet Muhammad. I arrived in the presence of my spiritual guide, Shaykh Yahya Madani, and told him of this event. He said, “This practice is very good and beneficial! It is practiced in common by both Muslim holy men and powerful ascetics of other religions.\u000146\u0001 The effect of doing this practice is that distracting thoughts as a whole are focused in one direction by one’s high aspiration. The sound serves as a connection between the seeker and the One sought, namely God. It bestows upon one a state of selflessness and self-absence which is the beginning of obliteration of obliteration (fana’ al-fana’). Those who claim that sound is the divine say this because the sound resembles God in its absolute and unconditioned quality, as implied by the verse in Qur’an that says, “There is nothing like unto God, for God is the One who hears, who sees.”\u000147\u0001 The relationship he drew between what is absolute and what is limited is just like that above, describing the relationship between the first type of vibration and the second type."]],"advice":["One should disregard whether the first type of vibration is stronger or weaker than the second.","It should be understood that the seeker can sense the first type of vibration which starts and stops when reciting names like God (Allah), True One (haqq), He (hu) or other such name, because each name has a particular sound that has a beginning and end.","This second type of vibration should be attributed to the object of meditation, namely God, rather than to the means of meditation, namely God’s names, as is done with the first vibration.","Turn your entire concentration to listening for this sound and do not be distracted from hearing it for even a moment.","Gradually, you must reach the stage where you hear this inner sound even without stopping up your ears with your fingers and never be disrupted by the distracting clamor of the world and worldly people."]},{"title":"Morsel 13","blocks":[["p","When this second vibration, which is continuous and sustained, becomes known to the seeker, it begins to spread through the body part by part depending upon the purity of its constitution and the intensity of the vibration. Some people may feel this vibration in only one part of the body. In any case, the manifestation of this vibration should cause one to keep focusing upon God, the true goal. If one is unable to focus upon God, then one should concentrate upon the heart without conceiving of the word Allah or any divine name. If it is difficult to focus upon God without conceiving of any divine name, then one should do this through conceiving of a divine name. But at this stage, focusing only upon a divine name without realizing the reality signified by the name is very detrimental. To turn back to a later stage when one has progressed to a more advanced stage is infidelity! As the proverb says, “The good deeds of the righteous appear as sins to the spiritually realized.”\u000148\u0001"],["p","The perception of the vibration is quantitatively equal to the vibration itself. In other words, the extent of perception should increase with the intensity of the vibration. I can offer these tricks in order to help the seeker increase this perception, for dependent upon this perception are reward and punishment, intimacy or distance, presence or estrangement. Since the source of both kinds of vibration is the heart, one is helped to perceive the vibration by concentrating on the heart rather than on any other part of the body. Observe that concentrating on any part of the body except the heart means concentrating less on other parts of the body. But this is not the case with the heart. Concentrate on the heart, for concentrating on it means also concentrating on all other parts of the body. At this moment, three things are in complete accord and conjunction: first, the vibration throughout the entire body, and second, the object of meditation which is denoted by the name Allah and the reality that it connotes, and third, knowledge of the object of meditation. One then realizes the vibration and time itself, which otherwise come under the category of phenomenal object that are conditioned and limited. At this stage, one is overwhelmed by an onslaught of self-abnegation and un-self-consciousness, and one is taken up into the state of obliteration of obliteration (fana’ al-fana’)."]],"advice":["In any case, the manifestation of this vibration should cause one to keep focusing upon God, the true goal.","If one is unable to focus upon God, then one should concentrate upon the heart without conceiving of the word Allah or any divine name.","If it is difficult to focus upon God without conceiving of any divine name, then one should do this through conceiving of a divine name.","In other words, the extent of perception should increase with the intensity of the vibration."]},{"title":"Morsel 14","blocks":[["p","With much practice, one attains awareness of this vibration most all of the time. Then one should aspire to be aware of this vibration without the mediation of the heart. One should focus upon it so intensely that one is not even aware of the heart. One should advance to the stage in which both the heart and the vibration are transcended. One should be aware of nothing but the object of meditation, namely God. Accord with any other thing should be discarded. Absence of duality is gained by singularity of focus that dissolves all conception of duality. We only imagine a dualism that separates knowledge and the object of meditation, that separates knowledge and the vibration which is known. One must have high aspiration to cultivate this relationship, which begins as little and proceeds towards much, and advances from much towards always and ever. In some moments one may not be able to maintain this relationship with the absolute directly, without any medium, due to some weakness. Then one should search out that vibration and concentrate upon it without any delay. If one gets distracted from maintaining contact with the continuous, universal vibration of the entire body, then one should concentrate instead on the continuous particular vibration of the heart. If that is also lost, one should concentrate on the periodic particular vibration of the heart. If that is also lost, one gathers one’s concentration again by taking a cold bath or, if that is not practical, by breathing in two or three times with force until the breath reaches the head. Or else one can recite in the heart the divine name “One who does” (fa‵al) several times, while keeping in mind the meaning of the name, for this will remove all obstacles that cause one to be misled, if God wills."]],"advice":["Then one should aspire to be aware of this vibration without the mediation of the heart.","One should focus upon it so intensely that one is not even aware of the heart.","One should advance to the stage in which both the heart and the vibration are transcended.","One should be aware of nothing but the object of meditation, namely God.","Accord with any other thing should be discarded.","One must have high aspiration to cultivate this relationship, which begins as little and proceeds towards much, and advances from much towards always and ever."]},{"title":"Morsel 15","blocks":[["p","With long practice and divine grace, one can reach the stage where one is constantly in the divine presence of the one meditated upon, without struggling to concentrate on the continuous universal vibration of the entire body. Then, one should be careful not to be distracted from it even for a moment, no matter what one is doing with the limbs or in the heart. At this stage, one can be said to “Keep your hands busy with work and your heart engaged with the beloved.”\u000149\u0001 As it is said in this quatrain:"],["v",["My brother, the source of richness always tend","Don’t let this life towards distraction bend","At all times, wherever you are, whatever you do","Keep your heart’s gaze secretly on your friend","sar-i rishta-yi daulat, ay baradar, bi-kaf ar","wa-in ‵umr-i giran-maya bi-ghaflat ma-guzar","da’im hame ja ba hame kas dar hame kar","mi-dar nihufta chashm-i dil janib-i yar"]]],"advice":["Then, one should be careful not to be distracted from it even for a moment, no matter what one is doing with the limbs or in the heart."]},{"title":"Morsel 16","blocks":[["p","Concentration upon God, the object of meditation, without any intermediary is a great and precious achievement. When this happens, one has realized the true meditation of the heart. As long as one is concentrating through an intermediary (like the vibrations) it is not meditation of the heart. This is because the heart is a subtle energy center (latifa) that is of God. Some even say that the heart does not belong to the body or corporeal organs. Some sages claim that the heart is actually a power of awareness, and others opine that it is an existence unconditioned by material limitations. Some think the heart is a subtle vapor. Some consider the heart to come directly from divine command, while others think that it belongs to the world of phenomena. Most agree that the heart is a divine essence, but some hold that it is incapable of definition. I have given a full account of these in my book Those Ten Complete Days (Tilka ‘Ashara Kamila), including the heart (qalb), the soul (nafs), the spirit (ruh) and the intellect (‵aql).\u000150\u0001 The vibration that one senses is part of the phenomenal world, and this is very far from the spiritual nature of the heart itself."]],"advice":[]},{"title":"Morsel 17","blocks":[["p","When meditation of the heart is attained, then light begins to manifest to the seeker, sometimes from within the self and sometimes from without. For instance, light could manifest in the heart or the head, or in the right or the left hand, and these states are all praiseworthy. Or light could manifest from throughout the entire body which is an extraordinary rare event. As for light manifesting from without, it could appear from one’s right side or from the left side, from above or from the front, and these are also all praiseworthy states. Full detail about these various kinds of light have already been noted above in a previous morsel."],["p","The essential point is that the seeker should not stay in this stage and long for the appearance of such light. One can traverse the spiritual path successfully without ever experiencing the manifestation of such light, and there is great hope that such a person can reach the goal even faster. So although the manifestation of light is a great blessing, one should strive towards having one’s knowledge of the light come without any why or how so as to maintain the proper relationship between one’s knowledge, what one knows, and one’s ultimate goal. The goal is comprehending God in an absolute way without having any limitation of how or attachment to forms."],["p","This may be explained in the following way. The seeker discovers a relation to the ultimate goal, which is God, that is felt like a cord. One end of the cord is from the center of the heart and the other end of the cord is attached to the divine essence. But the divine essence, is absolute and unqualified by limitation of time, space and condition, so it is impossible for a cord to be attached to it which is qualified by limitations. Nothing can be attached to such an essence unless it becomes a command of the absolute (amr-i mutlaq), that is, unqualified by a limitation in its essence unqualified by questions of more or less or how or why. Seekers who are not experts in the rational sciences (like mathematics or philosophy) may get upset when trying to imagine this kind of abstract schema. But those who, by love of science and learning, have trained their intellects will experience no anxiety in trying to conceive of this with force of imagination."],["p","Yes, one must put up with some discomfort and tediousness! In the beginning, one may experience no delight in striving to be attached with such a cord as a command of the absolute that is beyond limitation in any dimension. In fact, one might count it completely futile and a waste of precious time! But with the help of love and the power of longing and desire to traverse these spiritual stations, the seeker can overcome this boredom and dedicate himself to this work."],["p","Soon the seeker gets experience and this imagination gets perfected, and then he begins to know his true nature. Sufi masters advise seekers in this station not to do too much of conventional devotions, like reciting formulas (wird) or reading litanies (wazifa) or making supererogatory prayers (nawafil), for this might cause one’s hold on the cord to be lost. For seekers who are having trouble making the connection to this command of the absolute, some Sufi masters recommend that they concentrate upon the entire cosmos without paying attention to any of its specific features and stripping away its distinctive aspects. For after ignoring the features and stripping away the distinctions in the cosmos, nothing is left except the absolute essence of existence (itlaq-i hayulani)."],["p","Some interpret this absolute to be like an ocean of light (darya-yi nur) and conceive the self to be a tiny droplet of light that dissolves into that vast ocean of light. Some assert that this absolute is like an endless darkness and think of the self as a shadow that is obliterated in the black expanse. Some state that this absolute is the ether that is between and connects the heavens and the earth and all existing things. All these are metaphors through which reason uses sensory data to approximate a reality that it cannot be directly described. Thus understand the people endowed with reason through the paltry means available to our unreceptive minds; truly God is above any such comparison or metaphor, yet people need diverse ways to attain what they love. The true aim is for each person to obliterate his phantasmal existence (ifna-yi hasti-yi mawhum) which obscures him from bearing witness to the absolute being which is his true reality. All these constitute ways and means to attain this lofty essence which we seek."],["p","One experiences obliteration (fana’) when spiritual experiences overcome one’s knowledge of one’s own individual existence—no, not only knowledge of one’s own self but also knowledge of anything other than the self! When one no longer has knowledge of the self and also has no knowledge of this knowledge, then one experiences obliteration of obliteration (fana’-yi fana’). In as much as one leaves behind one’s self, one gains intimate connection to the absolute, which is God, as expressed in this poetic line:"],["v",["As much as I leave myself behind, I find myself","in your embrace","An qadr ke az khweshtan raftam dar aghosh-tu-am"]],["p","In short, the seeker finds a certain relationship within his or her cognitive self (nafs-i natiqa) but the seeker does not know to what this relationship is connected on the other side. For anything to which there can be a connection is necessarily bound by existential specificity (ta‵ayyun) that limits it, but the divine presence that is desired and sought is necessarily beyond specificity that limits. Whatever level of understanding the seeker may attain, the divine presence is beyond that. Whatever comes within the grasp of the understanding and imagination of the seeker is thereby specified and limited. It is limited by being within the imagination of the seeker."],["p","Every existing thing exists by its specificity and its individualization, which are necessarily limited, so such things cannot possibly be the divine presence that is sought. For this reason, some sages have said that no saint or prophet has ever attained the essence of the divine."],["v",["The phoenix cannot be captured","so pull back your net","As you search for the phoenix","keep firmly in hand your net"]],["p","Thus the seeker knows that “I am turning my concentration towards the divine, but I do not know to which direction I am turning my concentration.” Thus the seeker does not know what he knows. This is level of comprehension is called obliteration (fana’)."],["p","And if the seeker knows that he knows that he does not know, and goes beyond that to not know that he knows anything, then this level of comprehension is called obliteration of obliteration (fana’ al-fana’). This level is the furthest that one can attain in the journey towards God (sayr ila ’llah). Beyond it lies journeying in God (sayr fi ’llah)."]],"advice":["The essential point is that the seeker should not stay in this stage and long for the appearance of such light.","So although the manifestation of light is a great blessing, one should strive towards having one’s knowledge of the light come without any why or how so as to maintain the proper relationship between one’s knowledge, what one knows, and one’s ultimate goal.","Yes, one must put up with some discomfort and tediousness!","Thus the seeker knows that “I am turning my concentration towards the divine, but I do not know to which direction I am turning my concentration.”"]},{"title":"Morsel 18","blocks":[["p","What we call obliteration (fana’) is of two kinds. The first kind is a type of compound knowledge (‵ilm-i murakkab) while the second is essential knowledge (‵ilm-i basit). Compound knowledge is an expression that means a kind of comprehending that originates within the seeker and extends outward to concentrate upon the divine presence, thereby disengaging from everything that is other than the divine and attaching itself to nothing other than the divine."],["p","This could be because everything he apprehends he does not conceive as other, but rather conceives it as essential to himself; though they may be clothed in the appearance of other things, he apprehends them all to not be existing other than as part of his own existence. One should know that this apprehension is actual and is in accord with reality. This is the belief of those who hold to the school of “The Unity of Being” (wahdat-i wujud) in a pure way and clean themselves of the dust of otherness. Or this could be because everything he apprehends he sees as his beloved, because of his intense concentration on his goal, his extreme seeking for his desired one, his overwhelming love for his friend, and his powerful passion for his lover. But one should know that this apprehension is not in accord with reality. For in reality, the multitude of existing things other than God actually come from the special divine presence that is the one necessary being (wajib al-wujud); but due to excessive yearning, they were made apparent as other than God. So the statement that “All is God” (hame u-st) is a misleading statement that is not in accord with reality. Those who really believe in “The Unity of Being” see this statement as immature. But both groups are in agreement that one should disregard things other than God, because of their otherness, in order to achieve apprehension of unity."],["p","Thus the seeker flees from knowing the many and takes refuge in knowledge of the one. With this act of making the many one (tawhid), he finds intimacy with God. But still there remains the fact that he knows this knowledge. Because he is the knower, his knowledge remains a kind of compound knowledge—his knowledge is still derived from knowledge of something other."],["v",["As long as you hold to the thought that you exist","In the field of the idol worshippers you subsist","You say, ‘I believe in breaking idols, so I’m free.’","You’re mistaken! the idol of self you have missed","ta dar tu pindar-i tu hasti baqi-st","maidan-i baqin ke but-parasti baqi-at","gufti but pindar shikastam rast-am","in but ke tu pindar shikasti baqi-st"]],["p","Such is the meaning of compound knowledge, the first type of knowledge. The second type is essential knowledge (‵ilm-i basit). This is an expression for a type or kind of comprehending which consists of turning one’s concentration towards the divine presence, by which the seeker gets disengaged from everything else until even awareness of this knowledge also does not remain. In this state, the knowledge of the seeker is essential knowledge, and the seeker attains true obliteration (fana’-i haqiqi). In the opinion of some sages, the first type—compound knowledge of the divine—is called obliteration (fana’), and the second type—essential knowledge of God—is called obliteration of obliteration (fana’-i fana’). Both kinds of knowledge are not acquired by one’s own effort. Rather they are bestowed by blessed emanation of the holiest divine majesty, without the efforts of the seeker having any influence upon it."],["v",["Nobody attains the goal by their own searching","Yet without searching nobody ever attains the goal","bi-justaju’i na-yabad kasi murad wali","kasi murad bi-yabad ke justaju bi-konad"]],["p","Only after extreme longing, being pulled by divine attraction, experiencing un-self-consciousness and attaining self-absence, it may be that someone receives this blessed gift, after persisting for a long time thinking that, despite all entreaties, he is receiving nothing. Without the seeker going through a long period of divine attraction and un-self-consciousness, he can never have the quality of being intimate with God (wilayat). Yet without these, he can still be considered among the strict ascetics, pious devotees, righteous worshippers and virtuous persons, though he may not have that closeness to union which is the essential meaning of intimacy."],["p","You should know that being pulled by divine attraction (jazba) is a necessary condition for becoming a saint. But having this state of divine attraction last for a long time—or forever—is not a condition for being a saint. It sometimes happens that a person may be pulled by the divine (majzub) and act intoxicated for many years, but then later be sent back to his senses. They say this was the case with Bayazid Bistami, the Sultan of Sages, who for thirty years was in a state of intoxication and self-absence. But it could be that one experiences this for just a moment, and that is sufficient. But one who stays in a state of divine attraction and senselessness (majzub) is limited by this and does not progress beyond this stage, for without coming to one’s senses one cannot be worthy of giving spiritual training (tarbiyat). But the Sufi masters—who are the kings who sit on the throne of awareness, and who serve as the vice-regents of the Prophets, may God grant them peace and blessing—are able to dispense this spiritual treasure to others."]],"advice":["One should know that this apprehension is actual and is in accord with reality.","But one should know that this apprehension is not in accord with reality.","But both groups are in agreement that one should disregard things other than God, because of their otherness, in order to achieve apprehension of unity.","Without the seeker going through a long period of divine attraction and un-self-consciousness, he can never have the quality of being intimate with God (wilayat).","You should know that being pulled by divine attraction (jazba) is a necessary condition for becoming a saint."]},{"title":"Morsel 19","blocks":[["p","Being sustained through God (baqa’ bi’llah) is an expression meaning “being concentrated into unity” (jam‵ al-jam‵), which confers an intense bewilderment (hayrat-i kubra). Most sages of this age hold that this great bewilderment is the ultimate station (maqam) of the spiritual path, but others hold that the ultimate station is contentment (riza’) and acceptance (taslim)."],["p","Being sustained through God means returning to the beginning (ruju‵ illa ’l-bidayat). The beginning is the state of having one’s attention dispersed and apprehending the multitude of various things as individual and separate existences. Yet one returns to the beginning while disregarding the vision of a beginning and proceeding to apprehend phenomenal appearances without taking them merely as they appear. In this station, one has undergone an utter distraction that overpowers one’s spiritual condition and then, after progressing to the zenith of self-absence and un-self-consciousness—in which one is pulled towards the divine by uncontrollable attraction, discards all fetters, disregards all boundaries, and eradicates all specificities and dependencies—then one returns to the state of considering the multitude of existing things and separate identities and conditioned beings. But one returns to the beginning with a different vision, not with the vision of a beginner!"],["p","These two stations share certain common features, even if one’s vision is different within them. Both are similar in that one regards the multitude of separate existing things. Yet there is a great difference between them! In the beginning state, the seeker’s heart is searching for and longing for and concentrating on God, while it is limited by the various existing things with their separate identities, and does not observe and realize the command of the absolute (amr-i mutlaq). However, in the other state, the seeker’s heart is searching for and longing for and concentrating on God as the absolute essence (zat-i mutlaq), such that all separate identities, conditioned beings and individual existences are seen to be manifestations of the divine names (asma’) and qualities (sifat). Just as in the first state, the seeker distinguishes between lovely phenomena (jamal) and wrathful phenomenon (jalal), so also in the second state he distinguishes between them but with an eye transformed and a vision altogether different."],["p","In the second state, some say that when they observe existing things and apparent phenomena, they first bear witness to the absolute essence and then, by the light of that essence, they see the multitude of individual existing things and conditioned beings. Others say that they bear witness to the absolute essence in seeing the multitude of phenomenal appearances. And yet others say that one can bear witness to the absolute essence only after observing the multitude of phenomenal things. It is as if the first one says, “I do not see anything unless I see God before it,” while the second says, “I do not see anything unless I see God within it,” while the third one says, “I do not see anything unless I see God after it.”\u000151\u0001 I submit to you the proverb, “Each of us has a specific station that is known to him.”\u000152\u0001"],["p","When in the end a spiritual master returns to the routine world in this way, common people have difficulty recognizing him and distinguishing him from others. In this regard, you should understand why God says, “My friends are concealed under my cloak and no one knows them except for me.”\u000153\u0001 Upon this foundation, you can now understand why the words of some blind persons, in deriding the Prophet Muhammad (on whom be peace), are cited in the Qur’an, saying “What is with this man who claims to be a Prophet yet eats common food and walks in the marketplace?”\u000154\u0001 Another verse of Qur’an refers to people in the station, when it says, “Men who are not distracted with buying and selling from the remembrance of God.”\u000155\u0001"],["p","Thus you can see that it is difficult to recognize the true people of God who have realized this ultimate station of spiritual development. This is because their appearance and behavior is like that of ordinary people. In contrast, those who are distracted by the divine (majzub) and those mad for God (majnun), whose behavior and appearance are so different from that of ordinary people, are easily recognized by others and readily believed in by them. But among the rational and sensible people, those few who have returned from a station of spiritual uniqueness (fardiyat haqiqiya) do nothing unusual, and seldom do miracles happen with them. This is because they focus their full concentration on the absolute essence that is so pure as to be devoid of all qualities, while miraculous acts in this world and the cosmos are effects of divine qualities (sifat). They have moved above and beyond that state in which miraculous acts would appear from them. The details of this ultimate station are beyond words and description, as it says in the Qur’an, “Say ‘If the ocean were ink for writing the words of my Lord, the ocean would finish before the words of my Lord would finish, even if another ocean like it were added to help!’”\u000156\u0001"],["p","Oh my brother, if you read these meager lines with an attentive heart, there is a great hope your effort might move from the lowest depth to reach the loftiest apex even without a spiritual guide. But I know well that without the attention of a spiritual guide, this effort does not reach perfection. There are so many obstacles which can be surmounted only with the inner help of a spiritual guide, and such aid is impossible to get by the mere reading of books.\u000157\u0001"],["p","Some vain and self-conceited people do not wish to take initiation from any spiritual guide or keep their company, yet desire that through books alone they might learn about meditation and contemplation and have their spiritual effort reach perfection! This is nearly impossible and unthinkably rare. “Oh Lord, decide between us and our people in truth, for you are the best of all who decide!”\u000158\u0001"]],"advice":["It is as if the first one says, “I do not see anything unless I see God before it,” while the second says, “I do not see anything unless I see God within it,” while the third one says, “I do not see anything unless I see God after it.”\u000151\u0001 I submit to you the proverb, “Each of us has a specific station that is known to him.”\u000152\u0001","Some vain and self-conceited people do not wish to take initiation from any spiritual guide or keep their company, yet desire that through books alone they might learn about meditation and contemplation and have their spiritual effort reach perfection!"]}]},{"id":"ga","title":"General Advice","sub":"Morsels 1–6","items":[{"title":"Morsel 1","blocks":[["p","You should know, and may God guide you to the truth, that the object of all these types of meditation, reflection and contemplation is for you to be effaced and to strip away worldly concerns. This may reveal to you the true grandeur and subtlety of God. For the nature of one who realizes the singleness of God is of firm resolve and concentrated unity, and he strengthens his connection to the true source of the universe. Then from that state of being concentrated and resolved, he arrives back into the world of difference and separation. So a person with lofty aspiration and keen sense of justice always aims to turn towards that sense of unity. As much as he dispenses with what is dispersed and separate he achieves a strong bond with divine unity. And there is no way to achieve this except to render the knowledge of yourself as essential knowledge, and thereby disregard directions of the many and turn your face towards the one, until you see no essence in the whole world except the divine essence and perceive no qualities except divine qualities and acknowledge no actions except divine actions."],["p","Such a person comes to know the secret that permeates his very existence which also courses within every other being in existence. In this state, he achieves true faith (iman) and perfect awareness of God (taqwa). It is revealed to him what is heaven and what is hell. He realizes what is this world and what is the world to come. He comprehends what is the spirit and what is the soul. He understands who is the tempter and who is the compassionate. He apprehends who guides truly and who leads astray. Although the mystic sage has no goal to discover all these things, he is impelled to bear witness to them."],["p","The ways of doing meditation, reflection and contemplation are all based on love (‵ishq). The greater is one’s love the greater is the effect of all these practices. But if love is lax then their effect is lesser. These different types of spiritual practices might aid one to restore the strength and intensity of love that sometimes lags and weakens. One should never do these practices of meditation, reflection and contemplation merely to get some reward. A true lover’s aspiration is surely loftier than that."]],"advice":["You should know, and may God guide you to the truth, that the object of all these types of meditation, reflection and contemplation is for you to be effaced and to strip away worldly concerns.","One should never do these practices of meditation, reflection and contemplation merely to get some reward."]},{"title":"Morsel 2","blocks":[["p","You will observe that all the varieties of meditation that have been detailed above involve pronouncing words that assert the unity of God (tawhid). Likewise, there are poems and couplets composed in every age that express the unity of God. For this reason, reciting such poems is useful in striving to achieve union with the divine, and especially effective are those in the Arabic language which praise the more complete manifestation of prophethood (Muhammad), may God bless him and grant him peace. The effect of these poems is especially strong, though poems in any language that reveal the prophetic reality are useful."],["v",["What does love have to do with believer or infidel?","You can write this verse in either mosque or temple!","‵Ishq ra ba kafir o mumin na-bashad ihtiyaj","In sukhan dar masjid o but-khana mi-bayad navisht"]]],"advice":[]},{"title":"Morsel 3","blocks":[["p","Spiritual guides in the Sufi way have established the principle of focusing on a “medium” (barzakh) as a means whereby the dispersed attention can be gathered in concentrated unity. The human being has the attention dispersed through the various senses and is plagued by a host of distracting thoughts and is thus prevented from apprehending the true knowledge of divine unity (tawhid). Therefore, focusing attention upon a medium is a means to gather into unity all the senses and thoughts. This is particularly so when the medium is someone who commands reverence and demands respectful behavior."],["p","By focusing on the image of one’s spiritual guide, whether in real vision or in imagination, this medium serves to demand attention and respect, and in his presence one naturally exhibits awe and modesty. This is most useful. With much practice, the meaning that is inherent in the medium of one’s spiritual guide’s form becomes apparent within the seeker himself. This is so because thought takes on the color of whatever it reflects upon, just like material objects reflect what is near them. Likewise, the human being is capable of taking on the quality of any form that is dear to him, as expressed in this line from Maulana Rumi’s Masnavi:"],["v",["My brother, of thoughts entirely you are composed","Though bone and hair remain after you’re decomposed","If you think of roses, your life is a garden amazing","If you think of thorns, your life is a furnace blazing","Ay baradar, tu hamin andesha’i","ma baqi tu ustukhwan o resha’i","gar gul-ast andesha tu gulshani","war bud khari tu hame gulkhani"]],["p","Any existing thing can function as a medium, because the term medium means something that serves as an intermediary (wasita) between a person’s heart and the sought-for divine. But since the divine is of an extremely subtle and transcendent nature, it cannot be grasped by the senses or intellect. For this reason, the beauty of the divine is made present through the intermediary of the medium. From the smallest speck of dust to the radiant sphere of the sun, from the lowest earth to the loftiest heavens, everything is a place of manifestation (jalwa-gah) of the divine. The more subtle in nature the thing chosen as a medium, and the more profound its meaning for the intellect, the more intense is its effect. The more gross in nature the thing chosen as a medium, and the further it is from the human form, the less intense is its effect. Wherever you may look, if you look with the eye of wisdom and discernment, you see the divine essence. Yet what one chooses as a medium makes a big difference. Taking as a medium the form of one’s spiritual guide engenders a different symbolic meaning, which would be very different from that engendered by taking a stone or a clod of mud as a medium."],["p","The Sufi masters used to choose for each disciple a medium that suits his or her nature. For a disciple with a strong intellect, one would chose something abstract and universal from the realm of rational meanings. For a disciple who is weaker in intellect, one would chose some objects or image that is sensory and specific. But the master would chose a medium only after careful consideration of the internal state of the disciple, as to what thing he or she values most and is most beautiful in his or her sight. For example, consider someone who is in love with a young man and is mad with passion for him. He would feel that the beauty of this young man is more intense than that of his spiritual guide. So when the spiritual guide decides what should serve as the medium for him, he would chose the image of that young man whom he loves. Gradually, after long practice with these many meditations and contemplations, he would be released from this trap, as his relation to physical things lessens and his relation to spiritual things deepens. Take for example a person who feels that a rose in the garden is more beautiful than anything else. The medium for him would be the image of this rose. For if his spiritual guide would command that his own form serve as the medium for his man, it would not serve the purpose as well as this rose would. Then after these meditative practices, he would slowly be released from this obsession with roses and move on to higher things."]],"advice":["But the master would chose a medium only after careful consideration of the internal state of the disciple, as to what thing he or she values most and is most beautiful in his or her sight.","So when the spiritual guide decides what should serve as the medium for him, he would chose the image of that young man whom he loves."]},{"title":"Morsel 4","blocks":[["p","The various kinds of meditation that involve forceful motion are to engender an internal heat within the practitioner that increases the feeling of passion, engenders yearning and stokes the fires of love. These kinds that demand strain and effort include suspending the breath or restraining the breath, or the meditation in two beats, the meditation in six beats, or the meditation of the blacksmith. In performing meditations like these, the seeker should feel impassioned and should call out in ecstasy. For this reason, it is said that teaching the youth these kinds of meditations bears fruit more quickly. It is said that the Sufi after thirty years becomes cool and frigid. One should not teach these kinds of meditation to children who have not reached the age of maturity, lest they burn up with the internal heat it generates. When they reach the age of adolescence, then they may do it. The ardors that youthful years can endure cannot be borne by those in old age. The visions and unveilings achieved by the young cannot be attained by the aged. Shaykh Nizam al-Din Narnauli gave a prescription for older seekers who feel cool.\u000159\u0001 He suggested they consume the seeds of Panwar plant for the purpose of generating internal heat and stimulating motion in their constitutions by means of an herbal remedy.\u000160\u0001"]],"advice":["In performing meditations like these, the seeker should feel impassioned and should call out in ecstasy.","One should not teach these kinds of meditation to children who have not reached the age of maturity, lest they burn up with the internal heat it generates."]},{"title":"Morsel 5","blocks":[["p","There is a secret in the practice of devotions and meditations that involves the beating of the heart, hearing the eternal sound (sawt-i sarmadi) and sequence of breaths. The secret is in their constantly repeating nature. These practices are perfected with constant repetition, and when perfected they also repeat continuously. Their constantly repeating nature is a fundamental feature that can be found in other phenomena in the cosmos. For example, observe the motion of the heavenly bodies and stars that are in constant perpetual motion, or the movement of waves in the ocean. But such phenomena are external to the human body and so they are difficult for us to focus upon. It is easier for us to focus on the constant repetition and perpetual motion that is existent without our own human bodies, such as the beating of the heart or the oscillating of the breath. You may object by saying, “Every moment the human being is changing color and mood and yet the human being remains the same over time, so why don’t we consider the outer form of the human body as the principle of constant perpetual motion?” I would reply, “First of all, color is dependent upon the eye that sees it. In contemplations and even in meditation, closing the eyes is not just beneficial but rather essential. Secondly, its constant renovation is not self-evident but is rather only a matter of opinion. It would take some surgical experiments to establish for certain that this is the truth.”"]],"advice":["You may object by saying, “Every moment the human being is changing color and mood and yet the human being remains the same over time, so why don’t we consider the outer form of the human body as the principle of constant perpetual motion?”"]},{"title":"Morsel 6","blocks":[["p","A melody is a fiery spark in the seeker’s heart that is kindled by intense love. It is not something external to the seeker that effects him within. In the beginning, listening to music causes weeping and lamenting and restlessness and violent movements and moisture in the eyes, nose and mouth. These effects are due to the pain that is felt, a pain that is caused by performing much meditation. But those who have reached the station of bewilderment do not weep out of separation but rather they weep at the prospect of union. If they do weep, they do so because of regret for what is past or for some cause arising out of love. The tears of these, it is said, are sweet while those who weep from pain are bitter. Further, their movement in dancing is extremely soft, gentle and harmonious, and most often they dance in perfect accord with the rhythm of the melody. This motion is called “according to spiritual discourses” (nawatiq-i ruhani). It is enough to demonstrate their open-heartedness and expansive joyous spirit, though common people do not consider this kind of dance and movement very interesting. Common people like listening to music that causes forceful movement. But the spiritually attuned recognize where this subtle movement comes from, that is from the submissive prostration of the heart."],["p","While people are listening to the music, the person who first gets up and begins to dance in ecstasy is responsible for whatever happens in the assembly, whether it is good or bad. Nizam al-Din Awliya says that if a Sufi’s back touches the floor during such ecstasies, then he should sacrifice himself or give away one’s clothes in charity. The author of the Risala Qushayriya says that while listening to music, movement of any sort diminishes the spiritual state of any seeker whether he is a beginner or advanced or in the middle.\u000161\u0001 It is therefore not proper for one to move from one’s place no matter how overcome with emotion one might be. As far as possible, one should be firmly grounded and in control."],["p","With this the writer closes this book. Even though there are many more things that should be said about meditation, there is nothing to be done about that. This book was finished on 3 October 1690 CE (the last day of Dhu’l-Hijja 1101 AH). Oh God, keep these pages safe from indolent seekers and idle listeners! So it is finished, by the sacredness of the leader of the pious and his most pure family and followers. May God grant peace and blessings to Muhammad along with his kith and kin."]],"advice":["But those who have reached the station of bewilderment do not weep out of separation but rather they weep at the prospect of union.","It is enough to demonstrate their open-heartedness and expansive joyous spirit, though common people do not consider this kind of dance and movement very interesting.","Nizam al-Din Awliya says that if a Sufi’s back touches the floor during such ecstasies, then he should sacrifice himself or give away one’s clothes in charity.","As far as possible, one should be firmly grounded and in control.","Even though there are many more things that should be said about meditation, there is nothing to be done about that."]}]}],"notes":["Surat al-Ahzab 33:72 tells that God offered “the trust” to the heavens and the mountains but they all declined in fear of bearing it, yet the human being accepted the trust, thereby becoming God’s vice-regent in the world.","Abu Abd al-Rahman al-Sulami was a great early Sufi and was one of the first to write about Sufi theory and practice in prose; he lived in Persia and died in 1021. See Schimmel, Mystical Dimensions of Islam, 85-87.","Surat al-Baqara 2:152.","‘Abd al-Karim al-Jili was a master in the Qadiri Sufi order. He traveled in India and lived in Yemen, where he died in 1403 AH. He wrote many books explaining the mystical teachings of Ibn ‵Arabi, and his most famous work is The Complete Human Being on Mystical Knowledge of the Ends and Origins (al-Insan al-Kamil fi Ma‵rifat al-Awakhir wa’l-Awa’il).","Sharaf al-Din Ahmad ibn Yahya Maneri was a master in the Firdausi Sufi Order, and he died in Bihar (near Patna in North India) in 1381. The cave where he used to meditate in the Ragjir hills is still a popular place of pilgrimage. He met Shaykh Nizam al-Din Awliya in Delhi. Sharaf al-Din Maneri is most famous for his collection of letters of spiritual guidance; see Paul Jackson (trans.), The Hundred Letters of Sharafuddin Maneri (Mahwah: Paulist Press, 1980).","The Sufi meditation on the phrase “No god but God” is similar in function to the Yogic practice of pranava or repetition in each breath of the syllable Aum. Beck, Sonic Theology: Hinduism and Sacred Sound, 86, notes that Patanjali’s Yoga Sutra says “The sacred word (om) connotes him (Isvara or God); its repetition and the understanding of its meaning should be done.” The earliest commentary on the Yoga Sutra is by Vyasa, who writes about this verse, “The Yogi who has come to know well the relation between word and meaning must constantly repeat it, and habituate the mind to the manifestation therein of its meaning. The constant repetition is to be of the pranava (A U M) and the habitual mental manifestation is to be what it signifies, Isvara. The mind of the Yogi who constantly repeats pranava and habituates the mind to the constant manifestation of the idea it carries, becomes one-pointed.”","Ibn ‘Ata’ullah al-Iskandari is a famous Sufi master in the Shadhili Sufi order. He died in Alexandria in 1309. He wrote many valuable texts on Sufism, including The Key to Salvation (Miftah al-Falah wa Misbah al-Arwah) which is one of the earliest Sufi texts on meditation techniques. It is probably to this text that Shaykh Kalimullah refers here. See Mary Ann Koury Danner (trans.), The Key to Salvation (Cambridge: Islamic Texts Society, 1996).","Zain al-Din al-Khawafi was an important master in the Suhrawardi Sufi order; he died in Herat (in Afghanistan) in 1435 and wrote a text entitled Mir’at al-Talibin (Mirror of Seekers). See H. T. Norris, “The Mir’at al-Talibin by Zain al-Din al-Khawafi,” Bulletin of the School of Oriental and African Studies 53/1 (1990): 57-63. The reference to “Baha’ al-Din ‘Umar” must refer to Shaykh Baha’ al-Din Zakariya who established the Suhrawardi Sufi Order in South Asia; he died in 1263 in Multan (in Pakistan).","‵Abd al-Khaliq Ghujdawani was an important master who founded the principles that are practiced by the Naqshbandi Sufi Order; he lived in the town of Ghujdawan near Bukhara (in Uzbekistan) and died in 1220; his name is sometimes recorded as Ghijduwani. He advocated silent zikr and consciousness of the breath according to the Persian saying “hosh dar dam” (consciousness in each breath). It is related that he met Khizr, the figure of eternal wisdom, and learned secrets of zikr techniques directly from him.","Beck, Sonic Theology, 206 writes that “Sufism in India accepted the ancient Hindu doctrine that speech-sound is generated by the interaction of heat (internal fire) and air (breath) in the human body.”","This saying is popularly attributed to Shaykh Bayazid Bistami: “Man laysa lahu al-shaykha fa-shaykhuhu al-shaytanu.”","‵Abd al-Qadir Jilani (or Gilani) is an influential master from Iran who is the founder of the Qadiri Sufi Order; he died in Baghdad in 1166.","In Arabic, this prayer is: “Ya Rabbi, dullani ‵ala ‵abdin min ‵ibadika al-muqarribina hatta yadullani ‵alayka wa yu‵allimani tariq al-wusuli ilayka.”","The Shadhili Sufi community was founded in North Africa by Abu’l-Hasan al-Shadhili who lived in Morocco and Tusinia, and died in Egypt on 1258. He was a descendant of Imam Hasan. The Shadhili community spread to Mecca and Medina, and it is most likely that Shaykh Kalimullah encountered their teachings when he went to Medina to stay with his spiritual guide, Shaykh Yahya Madani, though he did not take any formal initiation into the Shadhili order.","Sura al-Baqara 2:285 Amana al-rasulu bi-ma unzilla ilayhi min-rabbihi wa’l-mu’minuna kullun amana bi-illahi wa mala’ikati-hi wa kutubi-hi wa rusuli-hi la nufarriqu bayna ahadin min rusuli-hi wa qalu sami’‵na wa-ata‵na ghufranaka rabbina wa ilayka al-masiru. “The messenger believes in what has been revealed to him from his Lord, and so do the believers. All of them have faith in God and God’s angels and books and messengers, saying ‘We make no difference between any of God’s messengers.’ And they say, ‘We hear and obey, Oh Lord, to win your forgiveness and you are the end of the journey.’” Surat Al ‵Imran 3:18 Shahida allahu annahu la ilaha illa huwa wa’l-mala’ikatu wa-ulu’l-’ilmi qa’iman bi’l-qisti la ilaha illa huwa ‘l-‵azizu ‘l-hakimu. “God bears witness that there is no God but he, and so do the angels and those endued with knowledge who stand firm with justice. There is no god but God, the mighty One, the wise One.”","Surat al-Fath 48:10.","The spiritual guide says Hadha libasu ‘l-taqwa wa dhalika khayrun wa‘f-‵aqibatu li’l-muttqina, which echoes Surat al-A‵raf 7:26 which reads, libasu ‘l-taqwa dhalika khayrun… “O children of Adam, we have indeed sent down to you clothing to cover your shame and for beauty, and the clothing of piety that is best.”","Salat al-awabin is a prayer beyond the canonical prayers (nafil) that is performed after sunset prayer (maghrib) and consists of six to twenty cycles of prostration (raka‘at). It is recommended to offer peace (salam) after every two cycles.","Khannas is the “whispering tempter” that the Qur’an asserts dwells in the breast of every person (Surat al-Nas 114:4). According to Shaykh Nizam al-Din Awliya, Khannas is the son of Iblis (Satan) who lives in the breast of all people and tries to influence their hearts; see Scott Kugle, Sufis and Saints’ Bodies (Chapel Hill: UNC Press, 2007), 38-9.","Surat al-Infitar 82:10-11 refers to the “honorable scribes” (katibin karimin) that are angels appointed to record one’s good and bad deeds and preserve them for judgment day.","Literally this is known as the “babbling or chattering” meditation named after the sound that a stork makes (laqlaqa or “to babble” comes from laqlaq which signifies a stork), which is a continuous clucking or choking sound.","The word dimagh means both mind and head. Here it signifies the head, or more specifically, the inner cavity of the head as the upper limit of the flow of breath.","The word given here for “greasy fat” is the Hindi term dusumat, whereas earlier he used the Persian term charbi.","Abu Hafs al-Haddad was a blacksmith who became a Sufi master of Nishapur in Northern Persia, and he died in 787-9 CE. See Ahmet Karamustafa, Sufism: the Formative Period (Berkeley: University of California Press, 2007), 48.","In Arabic grammar, this is called pronouncing with ashba‵ which extends the final vowel sound which is not an inherent part of the word and pronouncing it audibly. Saying God’s name as Alla-hu
