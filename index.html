e air which is “stationary” which does not have the quality of heat or cold and therefore does not require the heart to change its condition. This remains undisturbed during both suspending and restraining the breath. If one perceives and makes it a fulcrum for the meditation, one will be doing the meditation perpetually and feel the divine presence for an extended period of time, as long as the divine extends aid for one to feel it."],["p","During the days when one is practicing suspension of breath, one should avoid foods that are extremely moist and foods that are sour. One should refrain from foods that are very heat-increasing, for they may cause illness or make it more severe. In the initial stages of this practice, it may be that blood comes out from the ears, nostrils or anus, but the seeker should fearlessly continue the practice, for the bleeding will very soon stop. One should never strain or practice suspension of breath too intensely, but increase the intensity gradually, for what seems difficult later proves light."],["p","When exhaling, one should release the breath gently through the nostrils and not through the mouth, lest the outflow of air damage the gums and teeth. As a firm rule, one should never practice suspending the breath when on a full stomach or when hungry, but rather in a state between the two. This rule guides one in the initial stages, but for one who is well advanced there is no such rule and he may practice suspension of breath whenever he chooses."]],"advice":["Teachers of the Suhrawardi order, on the other hand, require their followers to avoid the suspension of breath; this is the point of view of Shaykh Baha’ al-Din ‘Umar and Zain al-Din al-Khawafi who are both renowned leaders of the Suhrawardi order, may they both be blessed.\u00018\u0001 I humbly submit that there are in fact two different ways of treating the breath in meditation.","During the days when one is practicing suspension of breath, one should avoid foods that are extremely moist and foods that are sour.","One should refrain from foods that are very heat-increasing, for they may cause illness or make it more severe.","In the initial stages of this practice, it may be that blood comes out from the ears, nostrils or anus, but the seeker should fearlessly continue the practice, for the bleeding will very soon stop.","One should never strain or practice suspension of breath too intensely, but increase the intensity gradually, for what seems difficult later proves light.","When exhaling, one should release the breath gently through the nostrils and not through the mouth, lest the outflow of air damage the gums and teeth."]},{"title":"Morsel 13","blocks":[["p","Some spiritual masters explain that people behold spiritual truths when their inner selves are cleansed and purified of attachment to sensory perception and attraction to sensual habits. Then they are filled from within by absorption in meditation and the blessing of having an internal relationship (nisbat) and attachment (rabt) with spiritual forces. This relationship causes their hearts to be illumined. In this state, the human being beholds the divine essence through this illumination, and becomes aware of what the divine wills and commands. Further, the light reflecting from the heart to the eye enables them to behold the unseen worlds with the senses of their bodies. They are then said to be drawn away completely from this world both inwardly and outwardly."]],"advice":[]},{"title":"Morsel 14","blocks":[["p","The first station of the spiritual path is repentance (tawba) and its final stage is bewilderment (hayrat)—though some claim that the final station is not bewilderment but rather contentment (riza’) and acceptance (taslim). There are two kinds of bewilderment, one of which is bad and the other of which is good. The difference can be explained as follows."],["p","The beauty and perfection of the divine essence is such that it calls for bewilderment rather than mere doubt. But sometimes there is ambiguity here, and it provokes a state between bewilderment and doubt. It should be known that bewildered wonder at some object comes from a person’s knowing and perceiving the essence of that object, in contrast to doubt which comes from a person’s ignorance and misunderstanding. So bewilderment comes from a person’s presence with a thing while doubt comes from a person’s absence from that thing. A bewildered person ascends, with each passing moment, upward towards the pinnacle of knowing something because of his passionate desire to know that thing. In contrast, the doubtful person descends, with each passing moment, down into ignorance about the reality of a thing because of his lack of attention to it."],["p","Further, it is said that bewilderment is a compound of two things, namely knowledge of the thing’s existence and ignorance of its nature. In contrast, doubt is a state of hesitation between knowledge and ignorance. One who doubts cannot be characterized as having decisive knowledge that is experientially confirmed and also cannot be characterized as having ignorance that is decisively established; rather, one who doubts has uncertain knowledge and also unsure ignorance. Such a person’s deeds always oscillate between denial and affirmation. This kind of doubt is known as bad bewilderment in contrast to the good bewilderment that was described before. It is said that bad bewilderment is experienced by common people but good bewilderment is the portion of the spiritually gifted."]],"advice":["It should be known that bewildered wonder at some object comes from a person’s knowing and perceiving the essence of that object, in contrast to doubt which comes from a person’s ignorance and misunderstanding."]},{"title":"Morsel 15","blocks":[["p","Light becomes manifest (to the seeker) which is sometimes white, sometimes green, sometimes red and, last of all, sometimes black. This light is called light of the realm of divine might (nur-i jabarut). The appended diagram explains the signification of light at different places. The sincere seeker must never feel despair or delight on account of the manifestation of any of these lights!"],["table",""]],"advice":["The sincere seeker must never feel despair or delight on account of the manifestation of any of these lights!"]},{"title":"Morsel 16","blocks":[["p","Sufi masters disagree about whether the one with spiritual knowledge should perpetually bear witness to spiritual realities or not. Some say that this witnessing should be perpetual and continuous, while others say that it should not be. One spiritual master has said, “The spiritual adepts witness in a way between revealed and obscured.” The reality is that the connection between the heart and the head, once it is firmly established, gets confirmed by experienced training and then never vanishes after that, though it may be that illuminations and visionary witnessing may come and may go. This is the meaning of the Arabic proverb that says, “The present moment is as swift as a sword and brilliant as lightning.”"]],"advice":["Sufi masters disagree about whether the one with spiritual knowledge should perpetually bear witness to spiritual realities or not.","Some say that this witnessing should be perpetual and continuous, while others say that it should not be.","The reality is that the connection between the heart and the head, once it is firmly established, gets confirmed by experienced training and then never vanishes after that, though it may be that illuminations and visionary witnessing may come and may go."]},{"title":"Morsel 17 (first)","blocks":[["p","In states of self-absence, un-self-consciousness, effacement and obliteration, a spiritual condition is achieved that is very subtle. That condition is impossible to describe and that place is utterly other. You might say it is nothing but the unitary totality of God (ahadiyat-i haqq) and absolute being of divinity. But it could be countered that “Absolute being of divinity can never ever be conceived, for only those things can be conceived by the mind which are temporal and ephemeral. Mental forms are part and parcel of the phenomenal world, and every existing phenomena is temporal and ephemeral. What is temporal and ephemeral cannot be absolute being, for the latter is eternal and imperishable, and what is eternal and imperishable can never be grasped by the senses.” I would reply, “It may be as you say, but when seekers are in that state of effacement (fana’), they cease to have a self and experience no self-concern and are completely unaffected by relationality (nisbat) which engenders dualism— dualism of distinction between subject and object. This state is called obliteration of obliteration (fana’ al-fana’). That is a state characterized by “nothing to know” more than “knowing nothing.”"],["p","This is the very state that Abu Bakr al-Siddiq [the first Caliph] referred to when he said, “The only real knowledge is knowing you can never really know.” So then how can we speak of God by saying expressions like “witnessing the essence” or “manifestation of the essence” or “loving the essence” or “knowledge of the essence” and “knowing God”? I would answer that real spiritual knowledge (‘irfan) results in putting each thing in its proper place and giving each thing its rightful due. Concerning this matter before us, there are two things to consider. One is essence in its pure simplicity, and the other consists of any matter than comes after it and from it. Now, the rightful due of the first matter [about the divine essence] is that it must be affirmed, and the rightful due of the second matter is that it must be denied. True knowledge of the first is that it can never be known, while true knowledge of the second is that it can be known for what it is. One intending to know the former while denying the latter will never achieve the knowledge intended."],["p","It is clearly known that affirming what is true is true, while affirming what is untrue is untrue. Yet not knowing about a thing does not necessitate not being able to experience its existence. In this way, we can say that the holy essence of God most exalted is something affirmed and experienced but never known. Now “witnessing the essence” means being absent from all things that are after and from the essence [meaning all phenomena]. And “manifestation of the essence” means that all phenomenal things are concealed from one’s perception. The cessation of desire for all phenomenal things is the meaning of “loving the essence.” Finally, ignoring all such phenomenal things is the meaning of “knowledge of the essence.” In this way, you can understand the various meaning of any description of God’s essence. It cannot be imagined that one can have knowledge of God directly, yet one can have knowledge of God’s names (asma’) and qualities (sifat) and actions (af‵al). These aspects of God’s nature can be known, not in their actual nature but rather only in the aspect that is apparent. This is because a thing’s real essence is unknowable because the real essence of all things is the reality of God, since God is the reality of all realities. Thus the reality of God’s essential nature is unknowable by human beings, angels, and jinn."],["p","The essential reality of all things is truly unknowable. To grasp this is the utmost extent of spiritual knowledge. How well someone said it like this, “The simplest of common people is just like the most select of the elite, and the first stage of the ignorant is the last stage of the learned.” But still the poem holds true that reads—Behold, what a long way it is to travel from here to there!"]],"advice":["But it could be countered that “Absolute being of divinity can never ever be conceived, for only those things can be conceived by the mind which are temporal and ephemeral.","What is temporal and ephemeral cannot be absolute being, for the latter is eternal and imperishable, and what is eternal and imperishable can never be grasped by the senses.”","This is the very state that Abu Bakr al-Siddiq [the first Caliph] referred to when he said, “The only real knowledge is knowing you can never really know.”","Now, the rightful due of the first matter [about the divine essence] is that it must be affirmed, and the rightful due of the second matter is that it must be denied.","True knowledge of the first is that it can never be known, while true knowledge of the second is that it can be known for what it is.","One intending to know the former while denying the latter will never achieve the knowledge intended."]},{"title":"Morsel 17 (second)","blocks":[["p","The system comprising these various ways of devotional exercise (shughl), meditative remembrance (zikr) and contemplative reflection (fikr) consists of technical methods which must be learned. But whether they are successful depends upon the aspiration of the disciple who uses them, and having a high aspiration entails no learning or exertion. The spiritual master simply directs the disciple to empty the self by following the path of the Shari’a, and then the master directs his concentration upon the disciple to offer spiritual aid, being present with the disciple at all times even when far away. In this way, the master opens many doorways for an in-pouring of spiritual energy for the disciple. This way, however simple, is rare. Many selfish people search for this simple way. Because the labors of the Sufi path and its demands are too difficult for them, they long for this simple and direct way."]],"advice":["The system comprising these various ways of devotional exercise (shughl), meditative remembrance (zikr) and contemplative reflection (fikr) consists of technical methods which must be learned."]},{"title":"Morsel 18","blocks":[["p","There is a saying that “He who has no master has the Tempter as his master.”\u000111\u0001 In accord with this saying, every sincere person ought to have a spiritual guide (shaykh). But the question is how and where to find him. As a beginning, the seeker may not be able to distinguish between a good and a bad person, and may not know the difference between a saint (wali) and a common person. By mere rational analysis, he may think a bad person to be good and a good person to be bad, and thereby stumble into doubt. Shaykh Sharaf al-Din Yahya Maneri helps the seeker out of this difficulty when he says that God has not, does not, and will not allow the world to remain without saints for any period whatsoever, in all their ranks from spiritual guides to ascetic (zahid) to worshippers (‵abid) to support (watad) to pious ones (khayr) to delegates (najib) to pure-hearted ones (naqib) to the interchangeable ones (abdal) to the axial saints (qutb) and the succor of the world (ghawth), in addition to all the various friends of God, such as those who appear mad with longing (majzub) and those drowned in divine love (‵ashiq) and those beloved of God (ma‵shuq). Therefore, the seeker must find those spiritual guides who are on this path and have these qualities. The seeker must frequent them and their assemblies. Every time on leaving the company of a spiritual master, the seeker should examine his heart to inquire whether or not it has improved by leaving aside the temptations and pollutions and all kinds of selfish thoughts that previously assaulted his heart. Perhaps in some meeting with the spiritual master the seeker felt liberated from the incessant changes in the state of the heart or experienced salvation from his former state. If the seeker observes that his heart has improved, he should stay with the spiritual guide in whose company he has experienced this good fortune, in hopes that his heart will find continuing liberation by meeting him again and again. And if the seeker observes no change in his heart, he should know that his destiny lies not with this spiritual guide and he should seek the cure of his heart at the doorstep of some other spiritual guide without denouncing or blaming anyone."]],"advice":["Therefore, the seeker must find those spiritual guides who are on this path and have these qualities.","The seeker must frequent them and their assemblies.","Every time on leaving the company of a spiritual master, the seeker should examine his heart to inquire whether or not it has improved by leaving aside the temptations and pollutions and all kinds of selfish thoughts that previously assaulted his heart.","If the seeker observes that his heart has improved, he should stay with the spiritual guide in whose company he has experienced this good fortune, in hopes that his heart will find continuing liberation by meeting him again and again.","And if the seeker observes no change in his heart, he should know that his destiny lies not with this spiritual guide and he should seek the cure of his heart at the doorstep of some other spiritual guide without denouncing or blaming anyone."]},{"title":"Morsel 19","blocks":[["p","Shaykh ‵Abd al-Qadir Jilani says that everyone who desires to find a spiritual master should do the following.\u000112\u0001 The seeker should rise from sleep at midnight, and after ablutions make two cycles of prayer (raka‵at) and read as much of the Qur’an as he can between them. He should then prostrate to God and seek salvation from God, and pray for a spiritual guide in the following way, so that God might open for the doorway of reaching him. He should pray that God will lead one of God’s friends to show him the path so that God may guide him to the divine presence. The seeker should perform this prayer time and time again until it comes to fruition. The following is the prayer: “Oh my Lord, lead me to one of your intimate servants that he may guide me to you and teach me the way to reach you.”\u000113\u0001 In addition, some later Sufi masters of the Shadhili community state that by making constant and continuous benedictions upon the Prophet Muhammad (salawat) along with praises to God (tahlil), one can find a perfect spiritual guide. They say that their guide in this practice is Imam Hasan, the son of ‘Ali ibn Abu Talib (the first Imam of the Shi‵a and the fourth Caliph of the Sunnis).\u000114\u0001"]],"advice":["Shaykh ‵Abd al-Qadir Jilani says that everyone who desires to find a spiritual master should do the following.\u000112\u0001 The seeker should rise from sleep at midnight, and after ablutions make two cycles of prayer (raka‵at) and read as much of the Qur’an as he can between them.","He should then prostrate to God and seek salvation from God, and pray for a spiritual guide in the following way, so that God might open for the doorway of reaching him.","He should pray that God will lead one of God’s friends to show him the path so that God may guide him to the divine presence.","The seeker should perform this prayer time and time again until it comes to fruition."]}]},{"id":"ch1","title":"Chapter One","sub":"On Methods of Meditation, Morsels 1–24","items":[{"title":"Morsel 1","blocks":[["p","When a seeker finds a perfected spiritual guide and decides to take up the spiritual path, he must take initiation. His spiritual guide will direct him to undergo a fast for three days, continuously if he can endure it, or else he can break it with an occasional slight refreshment. During this fast, the seeker is directed to repeat a thousand times the praise of God (tahlil), seeking forgiveness of God (istighfar) and invoking benedictions on the Prophet (salat). After the third day of fasting, the seeker should make full ablutions with a bath (ghusul) and appear before his spiritual guide. His spiritual guide will recite from the Qur’an Surat al-Fatiha and Surat al-Ikhlas, then the verses from Surat al-Baqara and Surat Al ‵Imran and the verses of seeking forgiveness (istighfar).\u000115\u0001"],["p","After this the master says, “Are you my disciple, and the disciple of my teacher, and of the spiritual guides of my master all the way back to the Prophet Muhammad and from him to God, the Lord of might? Do you vow to conduct your body on the straight path of the Shari’a and to keep your heart in the love of God?” The seeker answers, “I agree and promise to be led by the Shari’a and to love God,” while the master places his right hand in the right hand of the seeker, according to verses of Qur’an that say God’s hand is over their hands.\u000116\u0001 As the seeker makes this vow, all present hold the hem of his garment. If the assembly is very crowded, everyone holds the hem of the garment of those in front of them who are holding the garment of the seeker, to maintain a connection one to the other. The spiritual guide then clothes the initiate with a robe (khirqa), saying, “The garb of piety is most excellent and a blissful end awaits the righteous.”\u000117\u0001 Then the spiritual guide talks to the seeker in private and imparts to him a meditation according to his capability, such that none other should hear them."]],"advice":[]},{"title":"A Crumb of Morsel 1","blocks":[["p","The procedure of imparting a meditation to the seeker is like this. The spiritual guide says the words of the meditation to the seeker once and the seeker listens intently. The seeker repeats the meditation while the spiritual guide listens. They repeat this procedure three times. Then the master says, “As I received this meditation from my spiritual masters so I give it unto you.” The seeker acknowledges that he accepts it and will practice it. Further, he is instructed after each of the five canonical prayers to recite praise upon the Prophet (darud) and Surat al-Ikhlas ten times each, and to make six cycles of prayer (rak‵at) while saying three times “peace be upon you” (salam), which is called Salat-i Awabin, and to also perform two additional cycles of prayer to strengthen his faith, as I have stated in my book The Patched Cloak of Kalimullah (Muraqqa‵-i Kalimi).\u000118\u0001 And before going to bed, the seeker is instructed to repeat one hundred times “No god but God” (tahlil) and Surat al-Fatiha for the benefit of the souls of all his spiritual guides in his Sufi lineage."]],"advice":[]},{"title":"Another Crumb of Morsel 1","blocks":[["p","Performing meditation should come before contemplation (muraqaba). However, some spiritual guides say that contemplation is better and should come first. This is also acceptable, provided that the seeker shows the capacity for it. It is true that the greater the challenge, the greater the results. In reality, it is best to begin with meditation which is of many varieties and moods, to make the seeker stir with love and cry out with longing. After that, the seeker can pursue contemplation which leads to singularity of vision and consciousness devoid of conditions to make the seeker be still in silence."],["p","As for meditation, there are many ways and methods. If the spiritual guide sees that the seeker is distracted by worldly aspirations, he should teach him the meditation of “negation and affirmation” (nafy o isbat, based on saying la ilaha illa ‘llah “there is no god but God”). If the spiritual guide finds a seeker with a little love for the beloved, he should teach him a method of meditation based on the name of God (ism-i jalal, based on saying Allah). If the spiritual guide feels that his seeker is of gentle nature and with no attachment to the world, he should teach him meditation of “divine essence” (based on saying hu). In short, for every kind of seeker there is an appropriate kind of meditation with an effective style and meaning. In this chapter, I will detail each kind of meditation, if God wills. My intention is not to inflate the number of methods of meditation and contemplation, as is done in some Sufi books, such that meditations add up to a thousand and contemplations run into the hundreds. No! Rather, my intention is to show you the kinds of meditation that capture the essence of the practice and the types of contemplation that encapsulate the best of their kind. Thus if anyone masters these contemplations and meditations, he may master all others."]],"advice":[]},{"title":"Morsel 2","blocks":[["p","This is the method of performing “meditation of negation and affirmation” (zikr-i nafy o isbat) that involves pronouncing the words “no god but God” (la ilaha illa ‘llah) in four beats (chahar zarbi). It is practiced either aloud or inaudibly. One should sit cross-legged in a narrow dark room. Now sitting cross-legged is a position connoting arrogance and pride and it is undoubtedly forbidden at all times, with the exception of sitting alone to meditate. In Islamic law, it is considered an innovation (bid‵at). Yet it is reported that the Prophet Muhammad, upon him be peace, upon finishing his dawn prayers, used to sit cross-legged in the same place in order to do meditation until the sun shown brightly."],["p","So one should sit cross-legged with the back straight, the eyes closed, and the hands resting on the thighs. One then uses the big toe and the next toe of the right foot to firmly grip the sciatic nerve (rag-i kimas) that runs behind the left knee. Putting pressure on this will produce enough warmth in the heart to generate a purity (tasfiya). This warmth will melt and remove the fat that surrounds and constricts the heart, which is known as the dwelling place of the tempter (khannas).\u000119\u0001 This will reduce the temptations and pollutions that plague the heart. Taking up this position, one should perform the meditation with single-minded heart and with assertive voice, either saying the words aloud or keeping silent as is suitable to one’s situation and disposition."],["p","While performing this meditation, one should observe the conditions laid down in this poetic couplet:"],["v",["Medium, essence, attributes, drawing out, intensifying,","below and above","Show the spiritual seekers in each and every breath","a taste of love","Barzakh o zat o sifat o madd o shadd o taht o fauq","Mi-numayad taliban ra kulli nafas zauq o shauq"]],["p","In the context of this meditation, the terms listed in the couplet mean the following. The “medium” (barzakh) means one’s spiritual guide’s face or form. The “essence” (zat) refers to the divine essence of the absolute being, may it be glorified and exalted. The “attributes” (sifat) refer to the seven primal qualities of the divine—namely life (hayat), knowledge (‘ilm), power (qudra), will (irada), hearing (sam’), sight (basar), and speech (kalam). “Drawing out” (madd) refers to prolonging the pronunciation of the first “a” in la ilaha or “no god.” “Intensifying” (shadd) refers to accentuating the first syllable “i” when saying illa ‘llah or “but God.” “Below” (taht) refers to pronouncing la ilaha beginning by facing down towards the left knee and then raising the head up towards the right shoulder. Finally, “above” (fauq) means pausing for a while holding the breath before pronouncing illa ’llah or “but God” from above down onto the heart with great force."]],"advice":[]},{"title":"Morsel 3","blocks":[["p","To understand the meaning of the above-mentioned method of meditation, one should know that there are four kinds of thoughts (khatrat). There are tempting thoughts (shaytani) which cause feelings of pride, anger, enmity, envy and other destructive emotions. Then there are egoistic thoughts (nafsani) which cause feeling of craving for food, sexual pleasure, accumulation of wealth, love of display and other such selfish emotions. Then there are angelic thoughts (malaki) which cause devotion, worship and other such acts which accrue spiritual reward. Finally, there are divine thoughts (rahmani) which cause virtues like sincerity, love, longing and other positive emotions."],["p","So when one performs this meditation and begins facing the left knee, this is to negate satanic thoughts since the left is the abode of the tempter. Saying this, one moves to face the right knee to negate the lusts of the ego, which reside in the right lower body, for the ego and Satan mutually oppose each other and the ego is tempted to stray. The right shoulder is the abode of angelic thoughts, for the angelic scribe who writes all good deeds is there and called “the recorder of the right” (katib-i yamini).\u000120\u0001 Finally, the area of the heart is the abode of divine thoughts."],["p","To try to hold all these concepts in mind at one time causes hesitation and confusion, so therefore they are taught within the simple process of performing this meditation (in four beats) which encompasses all these regions and spiritual realities. At the outset one should be instructed to say la ilaha illa ’llah in the sense of there is “no god but God.” Then the meditation should be performed with the understanding that there is “no object of worship but God” (la ma‵bud illa ’llah). Then it should be performed with the understanding that there is “no goal but God” (la maqsud illa ’llah). Then it should be performed with the understanding that there is “no desire but God” (la matlub illa ’llah). Finally, it should be performed with the understanding that there is “no being but God” (la mawjud illa ’llah). By doing this meditation in this ascending order, all kinds of thoughts and feelings will vanish and disappear. This humble writer suggests that a new learner can start with the very last meaning to lighten the load and to cut short the way to achieve the goal. If the learner does not know Arabic, one can teach this meditation with equivalent words in any language that he knows."]],"advice":[]},{"title":"Morsel 4","blocks":[["p","This meditation can be performed in just two beats (zikr-i do-zarbi) with each breath. In this way, one says the same words, but the first phrase “no god” (la ilaha) is recited towards the right shoulder in one beat. Then the second phrase “but God” (illa ’llah) is recited towards the heart in the second beat. After the third or fifth or seventh or ninth repetition of this, one should say “Muhammad is the Messenger of God” (Muhammadun Rasulu ‘llahi). Except for being slightly simpler, this method of meditation differs very little from the meditation on the same words to four beats, as detailed above."]],"advice":[]},{"title":"Morsel 5","blocks":[["p","After performing “meditation of negation and affirmation” (zikr-i nafy o isbat), one should always perform “meditation of affirmation alone” (zikr-i isbat). Thus after meditation by pronouncing “no god but God” (la ilaha illa ’llah) one meditates by pronouncing “but God” alone (illa ’llah). After that, one should meditate on the name of God alone (Allah). The word “God” (Allah) is pronounced in a louder and more intense voice than “but God” (illa ‘llah). And the phrase “but God” (illa ’llah) should be done in a louder voice than “no god but God” (la ilaha illa ’llah)."]],"advice":[]},{"title":"Morsel 6","blocks":[["p","This is how to perform the “meditation of babbling” (zikr-i laqlaqa).\u000121\u0001 This meditation consists of pronouncing the name of God (Allah) continuously without any gap or separation in an almost inaudible repetition with the mouth being either shut or open. Some practice it while suspending the breath and some do not."]],"advice":["Some practice it while suspending the breath and some do not."]},{"title":"Morsel 7","blocks":[["p","This if how to perform the meditation of three supports (zikr-i se-paya). Its form is imagined to be like an old-fashioned Grecian ewer that is a ceramic bowl which stands on three legs (ibriq). Like this ewer, this meditation rests on three things, and if one of them is missing the whole thing cannot stand firmly. This meditation depends on three conditions: first the essential divine name Allah (ism-i zat), and second the three generative attributes of God (sifat-i ummahat) which are the One who knows (‵alim), the One who hears (sami‵), and the One who sees (basir), and thirdly the medium (barzakh). This meditation has seven conditions as stated in the poetic couplet:"],["v",["Medium, essence, attributes, drawing out, intensifying,","below and above","Show the spiritual seekers in each and every breath","a taste of love","Barzakh o zat o sifat o madd o shadd o taht o fauq","Mi-numayad taliban ra kulli nafas zauq o shauq"]],["p","Note carefully that the couplet is the same as that given in connection with the “meditation of negation and affirmation” (zikr-i nafy o isbat), but the explanation given in relation to his meditation differs significantly. In this meditation, “medium” (barzakh) refers to the form or face of one’s spiritual guide, just as before. “Essence” (zat) refers to the essential name of God, namely Allah. In this meditation, “attributes” (sifat) refers to the three generative attributes of God which are the One who knows (‵alim), the One who hears (sami‵), and the One who sees (basir). “Intensifying” (shadd) refers to pronouncing the “l” with forceful heavy intensity. “Drawing out” (madd) refers to lengthening the initial “a” when pronouncing Allah. “Below” (taht) refers to starting to pronounce Allah from below the navel with force. “Above” (fauq) means that the pronunciation ends by being drawn upward towards the head (dimagh).\u000122\u0001"],["p","This meditation of the three supports must always be practiced with suspending the breath (habs-i nafas), so this is not specified in the above conditions. The mode of practicing it is this. The “a” of Allah is drawn with force from below the navel and the full breath is drawn up into the chest and there the breath is held compressed. Then one pronounces Allah with the heart coupled with sami‵, while imagining its meaning “God hears.” Then one pronounces Allah coupled with basir, while imaging its meaning “God sees.” Then one pronounces Allah coupled with ‵alim, while imagining its meaning “God knows.” Reciting this much with the in-breath is called “the ascent.” Then one pronounces Allah coupled with each of these attributes in the inverse order: ‵alim for “God knows,” basir for “God sees” and sami’‵ for “God hears.” This is called “the descent.” Then one begins again to pronounce Allah with sami‵, basir and ‵alim as at the start. This is called “the re-ascent.”"],["p","The secret of the zikr lies in the fact that the sphere of hearing is less than that of seeing, and the sphere of seeing is less than that of knowing. The seeker begins in a state of reasoning about what is sensed (‵aql o shahadat), the narrowest of all spiritual states. As the seeker moves beyond the attribute sami‵ or “hears,” he progresses spiritually to a more comprehensive state of understanding what is beyond sensation (ghayb). As the seeker moves beyond the attribute basir or “sees,” he progresses spiritually to a more comprehensive state of understanding beyond the beyond (ghayb al-ghayb). As the seeker moves through the attribute ‵alim or “knows,” he comprehends this most expansive spiritual state. Then the seeker comes back through these attributes in the inverse order."],["p","One should understand that a single cycle of this meditation consists of moving through these three attributes three times, like this: Allah sami‵, Allah basir, Allah ‵alim is the first ascent, then in inverse order Allah ‵alim, Allah basir, Allah sami’ is the descent, and then Allah sami‵, Allah basir, Allah ‵alim is the re-ascent. This process makes up one cycle of the meditation, with an ascent, then descent, then re-ascent. While reciting this with the heart, the breath must be suspended to such an extent that one repeats the above course two or three times with each breath. With practice, this can be extended to even more courses in each breath, up to 250 times! Doing this generates internal heat that will burn away the greasy fat that congeals around the heart and allows the whispering tempter (khannas) to cling to it.\u000123\u0001 When the heart is cleansed of this, tempting thoughts melt away and one is overpowered by blissful oblivion."],["p","One should understand that starting to pronounce Allah from below the navel with force (taht) gives great advantages but presents many difficulties. Yet without it, this meditation of the three supports is rendered useless, so it should therefore be done as intensely as possible without straining oneself to the point of causing harm. May God keep you safe and secure!"],["p","To perform this meditation, one should sit cross-legged. With the big toe of the right foot and its neighboring toe, compress the sciatic nerve behind the left knee. Then draw in the abdomen around the navel towards the back, from below until above. Then close the eyes and call to the imagination the image of one’s spiritual guide (barzakh). Then one begins by drawing the name Allah up from below the navel (taht) with great intensity while drawing out the initial “a” (madd) and emphasizing “la” (shadd). Then with the heart one observes the attributes “God hears” (Allah sami‵), then “God sees” (Allah basir), then “God knows” (Allah ‵alim). In some Sufi masters’ books, this process is called “the descent,” but this humble writer prefers to describe it as “the ascent,” which should be followed by “the descent” and “re-ascent” as described above in detail."],["p","With practice, this meditation can be mastered. Then, a single breath suspended can be extended so that the cycle of the meditation can be repeated 250 times. At this point, one can add five more divine attributes: “God is from forever” (Allah da’im), “God is until forever” (Allah qa’im), “God is present” (Allah hazir), “God is watcher” (Allah nazir), and “God is witness” (Allah shahid). When, with practice, these extra attributes can be repeated 250 times with each suspension of breath such that the meditation is illumined by their light, then one can add seven more attributes. These attributes are called the “primary seven” divine attributes: “God lives” (Allah hayy), “God knows (Allah ‵alim), “God does” (Allah qadir), “God desires” (Allah murid), “God hears” (Allah sami‵), “God sees” (Allah basir) and “God speaks” (Allah kalim). When these are also mastered, one can expand the meditation to include divine attributes made up of compound names, such as: “God is most noble” (Allah akram al-akrimin), “God is most compassionate” (Allah arham al-rahimin), “God is most generous (Allah ajwad al-ajwadin), “God is giver of great bounty” (Allah zu’l-fadli ’l-‵azim), and “God is lord of the great throne (Allah rabbu’ l-‵arshi ’l-‵azim)."]],"advice":["Yet without it, this meditation of the three supports is rendered useless, so it should therefore be done as intensely as possible without straining oneself to the point of causing harm."]},{"title":"Morsel 8","blocks":[["p","According to the Shattari Sufi order, “meditation of the three supports” can be performed while pronouncing the name of God, Allah, with the tongue or the heart, while the attributes— the names sami‵, basir and ‵alim —are simply imagined in the mind. Always, the face or form of one’s spiritual guide should be held in the imagination. The name Allah is begun from below the navel by drawing out the “a” (madd) and emphasizing the “la” (shadd). If the recitation reaches the top in one breath or stroke, they call this “the lesser war” (muharaba saghira). If the breath is suspended such that the name Allah with the divine attributes is repeated a hundred times during a single breath, they call this “the great war” (muharaba kabira). When the basic three divine attributes are mastered, then other attributes may be added while carefully preserving the pattern of ascent and descent. When performing this meditation as “the great war” one should suspend the breath with tremendous force and allow the meditation to be done through the medium of one’s spiritual guide, with the result that the self is completely forgotten (be-khudi) and one is absent from one’s senses (be-hoshi). This is better achieved after extensive fasting and long sleeplessness, and in this way the goal is attained in a shorter period."]],"advice":[]},{"title":"Morsel 9","blocks":[["p","This is the method of performing “meditation on the name Allah in six beats” (zikr-i shesh zarbi) and its variation called “meditation on the name Allah in four beats” (zikr-i chahar zarbi). The “meditation of six beats” consists of repeating the divine name Allah towards each of the six directions (to the right, to the left, to the front, to the back, to above, and to below). A variation in four beats consists of sitting facing the direction to Mecca (qibla) and positioning in front of oneself the Qur’an or the tomb of a holy person, then reciting the name Allah towards the left, then towards the right, then towards in front towards the Qur’an or tomb, and lastly inwards towards the heart. When one does this repeatedly and gets engrossed in the meditation, one discovers unknown meanings of the Qur’an or secrets of the state of the holy person in the tomb. While doing this, hold the face or form of one’s spiritual guide in the imagination as a medium, otherwise the meditation is futile."]],"advice":[]},{"title":"Morsel 10","blocks":[["p","The “meditation of the blacksmith” (zikr-i haddadi) is performed by reciting “no god but God.” One sits on one’s knees with legs folded beneath. Then one faces to the left while beginning to pronounce “no God” (la ilaha) while drawing out the “la” (madd). Then as one pronounces this phrase, one rises up on one’s knees to a great height and immediately repeats “but God” (illa ’llah) as a forceful blow down onto the heart while throwing oneself down into a seated position. One does this with the vehement force of a blacksmith striking hot iron with a heavy sledge-hammer swung with both hands. Do this continuously until a spiritual sensation (zauq) is engendered. This method of meditation was taught by Imam Abu Hafs al-Haddad and it entails a lot of pain and effort.\u000124\u0001"]],"advice":[]},{"title":"Morsel 11","blocks":[["p","This is the method of meditation by “observing the breath” (pas-i anfas). During the exhaled breath, one recites “no god” (la ilaha) and during the inhaled breath, one recites “but God” (illa ‘llah). One does this with each breath exhaled and inhaled while keeping one’s concentration upon the navel as it is drawn in and extended out during breathing. After one does this meditation continuously and extensively, the meditation continues with one’s breathing even if one is asleep or awake. If one achieves this level of continuous meditation in each breath, then the length of one’s life is doubled."]],"advice":[]},{"title":"Morsel 12","blocks":[["p","This meditation of “observing the breath” is sometimes taught such that one only recites the name Allah. The method of doing this is to recite the name Allah while extending the final letter “h” with a long “u” so that it takes on the sound of “hu.”\u000125\u0001 While inhaling, one recites Alla- and when exhaling, one recites -hu. Doing this does not employ the voice; rather one lets the breath expresses the language of the heart. Other than this, the meditation is exactly like “observing the breath” as described above regardless of whether one recites the whole phrase la ilaha illa ’llah, or one recites only the name Allahu."],["p","It may be that a sound is generated in the nose while performing this meditation. That sound is known as “nasal sawing” (arra-i bini). The friction and vibration of this sound creates zeal and passion but it can make the head hot and dry. Almond oil can be applied to the nostrils and forehead to avoid this and perfect this meditation with no hinderance. Perfection is attained when the breath of the seeker does this meditation without his knowing or choosing it."],["p","Sometimes a seeker is a bit simpleminded and inexperienced, and has trouble learning. Perhaps his heart is not yet inscribed with the voice of meditations and contemplations. In this case, its method can be imparted in the following way. The beginner sits respectfully on both knees, facing his spiritual guide who sits facing him knee to knee. The beginner is told to lower his chin onto his chest, draw his abdomen inward to the stomach and hold his chest out full. The beginner should close his eyes. Then his spiritual guide should begin to feel how the beginner breathes. As the beginner exhales fully, the guide should inhale for him, grafting his breath into the beginner’s inhalation and exhalation. While thus engaged and joined together, the breath of the seeker will spontaneously cry out the recitation of “no god but God” (la ilaha illa ’llah) or Allahu, depending on which one is willed by the spiritual guide. This is no doubt amazing to observers! This cry of recitation might be so forceful that blood oozes from the beginner’s nose and ears. In this way, the method of meditation can be transmitted from “bosom to bosom” and taught without the medium of words."],["p","However, if one being taught is engaged in devotional exercises—especially contemplation that is done with suspending the breath—then the spiritual teacher can convey nothing to him in this way. This is because the one being taught is himself controlling his own breath. If the spiritual guide tries to graft his breath into the learner’s breath while he is engaged in such contemplation, it could happen that the learner’s un-self-consciousness could overwhelm the spiritual guide such that it cancels out even the guide’s thought to convey anything to the learner! This happened to the author in a Sufi gathering, with the result that the assembly was completely disrupted."]],"advice":["Almond oil can be applied to the nostrils and forehead to avoid this and perfect this meditation with no hinderance."]},{"title":"Morsel 13","blocks":[["p","This is the method of performing the “meditation for discovering the spirit” (zikr-i kashf-i ruh) through which one can discover the state of any spirit in any place. First, “Oh Lord” (ya rabb) is recited twenty-one times, then “Oh spirit of the spirit” (ya ruh al-ruh) is pronounced once with force upon the heart. Then raising the head, one recites “Oh spirit, just as God wills” (ya ruh ma sha’ Allah). When this meditation is done, one fixes one’s mind on the person whose state one desires to discover. Then the spirit of that person will appear to the seeker either in the waking state or in dream. If done 2000 times, the subject will be speedily obtained. Khwaja Nasir al-Din Chiragh-i Delhi taught this method to Hazrat Sayyid Gisu Daraz.\u000126\u0001"]],"advice":[]},{"title":"Morsel 14","blocks":[["p","Some spiritual guides teach that the compressed form of the entire blessed phrase “no god but God” (la ilaha illa ’llah) is to pronounce Ha Hu Hi. First Ha is recited to the right side, then Hu to the left, and then Hi towards the heart."]],"advice":[]},{"title":"Morsel 15","blocks":[["p","This is a method of “meditation to discover the state of those in graves” (zikr-i kashf-i qubur). Sit close by the tomb or grave. Lift the head high and face towards the sky and say, “Reveal to me, oh light!” (akshif li ya nur). Then in a strong beat towards the heart say, “Reveal to me…” (akshif li…) and then with a beat towards the tomb of the deceased person say, “…what is his condition!” (… ‵an halihi). The state of the buried will be known in dream or otherwise."]],"advice":[]},{"title":"Morsel 16","blocks":[["p","This is the method of “meditation for one’s prayers to be answered” (zikr li-ijaba al-da‵wat). Make each beat though the medium of imagining one’s spiritual guide (rabita). First say “Oh lord!” (ya rabb) to the right, then to the left, and lastly to the heart. Then in the same three beats and directions, say “Oh my lord!” (ya rabbi). One should repeat this meditation many times. When one desires to end the recitation, one lifts one’s open hands up and passes them over the face repeating, “Oh my lord!” (ya rabbi). All this time, one should recall in the heart what is desired in one’s prayers. The method of this meditation is given by the great master Ibn ‵Arabi.\u000127\u0001"]],"advice":[]},{"title":"Morsel 17","blocks":[["p","The basic principle meditation as taught in the Naqshbandi Sufi order is for the tip of the tongue to touch the palate and for the meditation to be done by suspending the breath. One begins by imagining “no” (la), taking this syllable from the navel and taken up to the head. Then one imagines “god” (ilaha) while inclining towards the right shoulder. Then one imagines “but God” (illa ’llah) to the left side towards the heart with such force that effect of it is felt in the whole body. The motion of this meditation is shown below in a diagram. The path of the motion corresponds to shape of the word “no” (la) when written in Arabic script."],["diagram",""],["p","This form of meditation thus negates the false self and establishes the true One (haqq). One must say in the heart, “Oh God, you are my goal and I desire your contentment” (Ilahi anta maqsudi wa rida’uka matlubi). In his external form, the person performing this meditation must not show any outward motion at all while imagining these words of negation and affirmation (la ilaha illa ’llah). The number of times in which this phrase is repeated during one suspended breath must be an odd number—not an even number. When one exhales, one says in the heart, “Muhammad is the messenger of God” (Muhammadun rasulu ‘llahi). The effect of performing this meditation is that by imagining the words of negation, one’s self is negated and by imagining the words of affirmation, one’s self is affirmed. If one repeats this meditation more than twenty-one times, yet still no effect is felt—no absence from the self or oblivion—one should stop and start over afresh, since some necessary condition of its proper method must have been neglected. Otherwise this type of meditation is effective enough to bring about its own result."]],"advice":["In his external form, the person performing this meditation must not show any outward motion at all while imagining these words of negation and affirmation (la ilaha illa ’llah)."]},{"title":"Morsel 18","blocks":[["p","This is the method of “meditation of affirmation and negation” (zikr-i nafy o isbat) in two beats or four beats. One recites “no god but God” (la ilaha illa ‘llah) first towards the right side while imagining the Prophet Muhammad (peace and blessings be upon him), then towards the left side imagining one’s own spiritual guide, then towards the heart, imagining God therein, and then facing a little further in towards one’s center imagining absolute being."]],"advice":[]},{"title":"Morsel 19","blocks":[["p","This is a method called “meditation for preventing illness” (zikr-i daf-i marz). Recite “Oh singular One!” (ya ahad) towards the right, then “Oh eternal One!” (ya samad) towards the left, and then “Oh unique One” (ya witr) towards the heart."]],"advice":[]},{"title":"Morsel 20","blocks":[["p","This is a method called “meditation of the bountiful One (zikr-i wahhab). After the canonical evening prayers, one must say supererogatory prayers of two cycles (raka’at). During each cycle, after one recites Surat al-Fatiha, then one recites Surat al-Ikhlas eleven times and says “Oh bountiful One!” (ya wahhab) seventy times. This method of meditation removes worldly needs and anxieties."]],"advice":[]},{"title":"Morsel 21","blocks":[["p","This is called “meditation while walking step by step” (zikr-i mashy-i aqdam). If one is walking swiftly, one says “but God” (illa ’llah) at each step. If one is walking slowly, one says “no” (la) with the right step and “god” (ilaha) with the left step, and then “but” (illa) with the next right step and “God” (Allah) with the next left step. If one is walking at a medium pace, one simply says “God” (Allah) at every step."]],"advice":[]},{"title":"Morsel 22","blocks":[["p","If one meditates with the entire phrase, saying “no god but God” (la ilaha illa ’llah) then this is known as meditation of the human realm (nasut). If one meditates with only the phrase “but God” (illa ’llah) this is known as meditation of the spiritual realm (malakut). If one meditates with only the name “God” (Allah) this is known as meditation of the archetypal realm (jabarut). And if one meditates with merely the pronoun “he” (hu) this is known as meditation of the divine realm (lahut)."]],"advice":[]},{"title":"Morsel 23","blocks":[["p","There are some meditation practices that spiritual masters transmit orally (from heart to heart) to disciples only after extensive training. This means only after disciples have undergone strenuous spiritual exercises (riyazat) and struggles (mujahadat) and have endured forty day retreats in order to purify the heart to the utmost."],["p","From among these meditations is “the meditation of with-ness” (zikr-i ma ‵iya) in which one says, “Oh with me, oh with me, oh with me, oh he, oh he, oh he” (ya ma‵i, ya ma‵i, ya ma‵i, ya hu, ya hu, ya hu). Performing this meditation enables one to witness the divine essence and attributes in a short period. The method of performing it is this. One sits as if in prayer (on one’s knees), except that the feet should protrude out from under the shins, which should be resting on the ground. With the right hand, one should firmly hold the left arm, and with the left hand, one should hold firmly the right arm. Then one pronounces the following words in five beats. The first beat is directed to a spot between the knee and the right foot. The second beat is directed towards the sky. The third beat is directed towards the spot between the knee and the left foot. The fourth beat is directed towards one’s liver. The fifth beat is directed towards one’s heart with great intensity and force. One must keep in mind that hu is an expression for absolute unity that is like unto nothing else.\u000128\u0001 In the days when one is performing this meditation, one should drink milk especially if it is mixed with saffron. And one should use a lot of incense or fragrance. Sometime this meditation is abridged into the three words, “He, he, oh with me” (hu, hu, ya ma‵i). This is practiced as detailed above with the exception that hu, hu is pronounced towards the sky, and ya ma‵ i is pronounced towards the heart."],["p","Another of these meditations is “the meditation of allness” (zikr-i kulliya). It consists of saying “All is with you, all is from you, all is to you, oh all of all!” (bika ’l-kull, minka ’l-kull, ilayka ’l-kull, ya kulla ’l-kull). But this humble writer has seen it in another form, saying “Oh God, you are all, and from you is all, and with you is all, and for you is all, and to you is all, oh all of all” (Allahumma anta’l-kull wa minka’l-kull wa bika’l-kull wa laka’l-kull wa ilayka’l-kull wa kulla’l-kull). Performing this enables one to behold the divine essence and attributes. To perform it, one sits cross-legged then makes one beat to the front, one beat to the right, one beat to the left side, one beat to the sky, and one beat to the heart."],["p","Another of these is “the meditation of all-encompassing” (zikr-i ihata). It consists of saying, “Oh you who encompass all without and all within” (ya muhit zahran wa batnan). One opens one’s eyes when saying “all without” and one closes one’s eyes when saying “all within.” It bestows the experience of witnessing the divine (mushahada)."],["p","Another of these is “the meditation of obliterating all directions” (zikr-i mahw al-jihat). In this practice, one says “You are above me, you are beneath me, you are before me, you are behind me, you are right of me, you are left of me, you are in me, and I am with you in all directions–wherever you may turn there is the face of God!” (Anta fauqi, anta tahti, anta amami, anta khalfi, anta yamini, anta shamali, anta fiya wa ana ma‵ al-jihati fika–aynama tawallu fa-thumma wajhu’llahi).\u000129\u0001 It is performed in this way. One stands and faces the heavenly throne to say “You are above me” (anta fauqi). Then one turns to face the earth and sits to say, “You are below me” (anta tahti). Then sitting one turns to face towards the front to say, “You are before me” (anta amami). Then still sitting, one turns one’s head to the rear to say, “You are behind me” (anta khalfi). Turning to face the right one says, “You are right of me” (anta yamini). Turning to face to the left one says, “You are left of me” (anta shamali). Then in a beat directed to the heart one says, “You are in me” (anta fiya). After this one says, “and I am with you in all directions—wherever you may turn there is the face of God!” (wa ana ma‵ al-jihati fika…aynama tawallu fa-thumma wajhu’llahi).\u000130\u0001"],["p","Another of these is “the meditation of manifesting selfhood” (zikr-i tajalli-yi ana’iya). It consists of saying, “I am God, there is no god but I” (inni ana allah la ilaha illa ana). After late-night vigil prayers (tahajjud) this phrase should be pronounced 100 times in the following manner. Lifting the head towards heaven, one recites “I am God” (inni ana allah). Then one lowers the head towards the right side and says “there is no god…” (la ilaha) and then pronounces towards the heart with great force “… but I” (illa ana). In all above five meditations, it is required that one holds in the imagination the meaning of the words and also the image of one’s spiritual guide (barzakh)."],["p","Another of these is a meditation done by Hazrat Shaykh Shakar Ganj.\u000131\u0001 This meditation is in the Punjabi language. One says, “Above is you” (uhul tun) indicating the celestial worlds. One says, “Below is you” (ihul tun) indicating the terrestrial worlds. One says, “You are only you” (tuhin tun) indicating the ultimate absolute."]],"advice":[]},{"title":"Morsel 24","blocks":[["p","When an assembly for meditation is finished, one should repeat three times: “Glory be to God, may God be praised. Glory to be God most great and may he be praised” (subhan ’llahi wa bi-hamdi-hi subhana ‘llahi ’l-azim wa bi-hamdi-hi)."],["p","Further this prayer should be said: “Oh God, you said ‘So remember me that I remember you’ and I have remembered you to the meager degree of my knowledge, reason and understanding. Remember me with the bounteous capacity of your self, your blessing, your knowledge and your forgiveness. Oh God, open the ears of our hearts with your remembrance, oh you, who are the best of those who remember.”\u000132\u0001"]],"advice":[]}]},{"id":"ch2","title":"Chapter Two","sub":"On Methods of Contemplation, Morsels 1–20","items":[{"title":"Chapter Two","blocks":[["p","You should know that contemplation (muraqaba) is a way for one to protect one’s heart such that it cleaves to one single meaning and no other. There are three things that cause the heart to fall ill so that is gets distracted from the true One (haqq). First, there is the speech of the self (hadith-i nafs) which is constantly bombarding the heart with motives and willful choices, either overtly or covertly. Secondly, there are tempting thoughts (khatra) which come and go without one’s own motivation. Thirdly, there is observing phenomena that are other than God in this world of multiplicity. To cure the illness of the heart one must do internal work (shughl-i batin). This is contemplation and it is of various types."]],"advice":[]},{"title":"Morsel 1","blocks":[["p","One can contemplate the greatest divine name, the name of the essence, namely Allah. One must displace the speech of the self and put Allah in its place. One can contemplate the primal qualities of the divine (sifat-i ummahat).\u000133\u0001 One must displace tempting thoughts and put the primal qualities of the divine in their place. One must keep the gaze of the heart directed upon the beauty of one’s spiritual guide which is called the medium (wasita) or connection (rabita) or betweenness (barzakh)."]],"advice":[]},{"title":"Morsel 2","blocks":[["p","One should observe Allah as the holy and wholly other essence (ma‵na muqaddas) that is beyond any limits or specifications that are commonly understood. One should meditate on that essence with the entire concentration of the organ of one’s heart (dil-i sanubari), until the eternity and splendor of this essence causes one’s intellect to be brightened and one’s constitution to be purified. If one’s mind cannot comprehend the holy and wholly other essence, then one can imagine it as a pure and undifferentiated light. One may imagine that one is dissolved in the light, as if it were an ocean of light and you are a mere drop within it. Or one can conceive of the holy and wholly other essence as utter and impenetrable darkness. One can imagine that one is dissolved into that darkness, as if one were a mere shadow, for when a shadow merges with darkness it vanishes and all differentiation ceases."]],"advice":[]},{"title":"Morsel 3","blocks":[["p","Some sages explain that when one practices contemplation one must hold the image of one’s spiritual guide in the imagination, so that the one exercising might feel his heat and spiritual presence. In this way, one can focus upon one’s own humane, all-comprehensive spiritual reality in the form of one’s spiritual guide. In other words, one grasps one’s own essential humanity by holding fast the image of one’s spiritual guide. One imagines the essence of humanity to be concentrated in one’s own spiritual guide. One’s all-comprehensive spiritual reality is, in the technical vocabulary of Sufis, called the heart (qalb). Because this spiritual reality is transcendent and cannot be limited to incarnation in bodies, realizing it is not easy. In order to mitigate this difficulty, one can concentrate upon the flesh of the heart in which dwells the essential heart. This fleshy organ is the metaphorical heart that has a relation to the essential heart, a relation enjoyed by no other part of the body. One should focus one’s full concentration upon the heart, such that all one’s sensory awareness becomes unified in one direction and upon one object. There can be no doubt that when this state is achieved, self-absence and un-self-consciousness will manifest. One can imagine that this state of absence is a clear path that is smooth and straight. One can then imagine that one is traveling along this path which is an endless path. Whenever any selfish thought (khatra) or temptation (waswas) distracts one, one begins to slip and slide off the path. Such thoughts can either be shaken off or they take possession of one. If shaken off, that is the intended goal. If they are not shaken off and they begin to take possession of one, then one must concentrate on that spiritual reality that is apprehended as the image of one’s spiritual guide, and by this means one can ward them off. In this way, one can find help from the presence of one’s spiritual guide. But if these distractions are not warded off, then one must clear one’s mind by exhaling the breath through the nostrils with great force. Then one settles back into concentrating as one did before."],["p","If this is not effective, the following prayer for forgiveness must be recited over and over with both tongue and heart in union: “I seek forgiveness of God. I seek forgiveness of God from all that is repulsive to God in word and deed, in open and in secret, in what is heard and what is seen. There is no power and no strength save in God, the lofty One, the great One.”\u000134\u0001"],["p","If still the distractions are not warded off, then one may imagine the name of God, “Oh effective One!” (ya fa‵al) because it has a special quality of removing distracting temptations. If this provides no benefit, then one can consider the phrase “no god but God” (la ilaha illa ‘llah) as meaning “no existence but God” (la mawjuda illa ‘llah). If this is found to be of no benefit, then one must recite with the name Allah with intensification (shadd) and elongation (madd) and direct it with a forceful beat onto the heart."]],"advice":[]},{"title":"Morsel 4","blocks":[["p","Whatever is perceived by the senses both external and internal is not devoid of meaning. Rather, if what is sensed is in accord with reality (waqi‵a) then it is truth (haqq). And if what is sensed does not accord with reality then it is non-truth (batil). Those who believe in the “Oneness of Being” (wahdat-i wujud) hold that God manifests in the appearance of truth, but also manifests in the appearance of non-truth. Shaykh Abu Madyan Maghribi, who was the spiritual guide of Shaykh Ibn ‵Arabi, expresses this idea in the following quatrain.\u000135\u0001"],["v",["Do not always deny what is not true","for sometimes God appears there too","Obey God in whatever way you can","So you affirm God’s reality as is due","la tunkir al-batilla fi tawri-hi","fa-inna-hu ba‵da zahurati-hi","wa a‵ti-hu min-ka bi-miqdari-hi","hata tawafiya haqqa ithbati-hi"]],["p","To complete this idea, Shaykh Mu’ayyid al-Din al-Jandi added a rhyming couplet.\u000136\u0001"],["v",["Divinity can appear in human form, too","so don’t deny your essence as the foolish do","fa ’l-haqqu qad yazharu fi surati-hi","wa yunkiru al-jahil fi dhati-hi"]],["p","So therefore, whatever one senses of universal principles (kulliyat) or sensory things (juz’iyat) should be understood as witnessing the absolute being which manifests in a particular form at that moment. Contemplating this is the best spiritual path and the most reliable way to stop the incoming stream of selfish thoughts. Beyond a doubt, it causes a state of self-absence and provides an experience of bliss. It allows one to comprehend the differentiated levels (maratib) of divinity and materiality. But it is best that you negate all such phenomenal appearances while affirming the spiritual experience of self-absence, so that you pass away from your egoistic self (nafs-i khud) and embrace un-self-consciousness. In the view of the sages of this Sufi path, it is infidelity to cling to whatever comes to you in a state of self-absence (ghaybat). However, what comes to you in this state may have connected with it concentration, insight into profound spiritual realities and subtle realizations of knowledge and experience. The benefit provided to you by states of self-absence and un-self-consciousness can be the beginning of bewilderment (hayrat), which is the final stage of the spiritual path."]],"advice":[]},{"title":"Morsel 5","blocks":[["p","The spiritual seeker should look within with the eye of the heart to perceive his or her own truth which is an expression for all-comprehensive spiritual reality of the self (haqiqa-yi jami‵iya-yi u). In this way, the seeker keeps the essential reality of his self under observation with the heart’s eye in all actions and all states. The seeker sees that all things that exist in the world—be they good or bad, subtle or gross, sensory or spiritual—are reflections of the all-comprehensive spiritual reality of the self, until the seeker perceives that the whole cosmos and all worlds are established and sustained through it. Then all things that are sensed or thought are mere reflections that are seen as effects of it (the all-comprehensive spiritual reality of the self). It is as if the entire cosmos were the body and the seeker’s self were the soul animating that body. This station is known as “comprehending comprehensiveness” (jam‵ al-jam‵). When this contemplation is powerfully mastered, the seeker will be aware of all things in the cosmos, and if they are joyful he will feel joy, and if they are sorrowful he will feel sorrow. This is because the soul feels the rewards and sufferings that result in the action of the body, regarding whether the body performs what is obligatory and desists from what is prohibited."]],"advice":[]},{"title":"Morsel 6","blocks":[["p","Another method of contemplation is to look at the written form of “no god but God” (la ilaha illa ’llah) or simply the name “God” (Allah). One can look at this form with the eye of the head as it is written on paper, or one can look at it with the gaze of insight as it is written on the paper of knowledge or the tablet of imagination. One should become so engrossed in contemplating this form until un-self-consciousness overcomes one, and one is oblivious to that form and unaware even of being oblivious to that form."]],"advice":[]},{"title":"Morsel 7","blocks":[["p","Another method is to contemplate some object such as a stone, a clod, a grave, the Qur’an, a beloved person’s face, one’s spiritual guide’s face, a flower or other such thing. One should gaze upon this object with one’s physical eyes and not move one’s eyelids to blink. One should also focus one’s inner concentration, through that object, upon the absolute reality that is essential and unchanging. One should persist with this until selfish thoughts cease, and one is overwhelmed with un-self-consciousness and one is oblivious to all things, even to the fact that one is oblivious. This method of contemplation is attributed to the Sufi master Ibrahim ibn Adham Balkhi.\u000137\u0001"]],"advice":[]},{"title":"Morsel 8","blocks":[["p","Some great masters of the Sufi path say that the following is the best way to contemplate God and enter into the presence of the divine, glorified be God and lofty be God’s state! One should retire one’s personal powers—both inward and outward, both universal and sensorial—from dispersive actions and one should clear one’s mind of all knowledge or belief, indeed, from anything that is other than God. Then one should concentrate on God simply as what God is, without limiting God by any mental conception of transcendence or immanence (na bi tanzih ya bi tashbih). One should concentrate with a universal concentration upon the most essential aspect of divinity which is received by every form, whether it be considered good and beautiful, or bad and awful, whether it be perceptible by the senses or beyond the senses. One should concentrate on this with belief in oneness (tawhid) and firm determination (‵azimat) and force of will (jam‵iyat) and pure sincerity (ikhlas) in a constant and continuous way. One should concentrate in this way until one no longer experiences distraction in thought and dispersal in determination. One should realize that the utter perfection of God encompasses all possible qualities, whether someone might perceive them to be good or bad. One should realize that reason or thought or imagination cannot possibly fathom even the hidden secrets of divine nature. God is simply what God is. If God wills, the divine manifests in any form of the cosmos or in all forms of the cosmos. And if God wills, the divine transcends them and is beyond them all."]],"advice":[]},{"title":"Morsel 9","blocks":[["p","The seeker may contemplate the self as being the origin of divine disclosures rather than being the consequence of divine disclosures (tajalliyat). The seeker should keep this view constantly in sight. In this way, one should see all things as both absolute being (wujudi mutlaq) and limited being (wujudi muqayyad), with reality being that both types are indeed one. For naming something as absolute or naming something as limited are relative to the perspective and judgment of the observer. If one persists with this contemplation for a long time, it will induce intense spiritual experience (zauq)."]],"advice":[]},{"title":"Morsel 10","blocks":[["p","Another method is to close the eyes and fix the gaze on the heart, then stay aware that God is present and watching and that God is with you."]],"advice":[]},{"title":"Morsel 11","blocks":[["p","Another method is to keep one’s eyes open and strive to not blink while staring upwards or directly ahead. This generates some light and heat issues from the eyelids to spread all through the body, generating a feeling of passionate love."]],"advice":[]},{"title":"Morsel 12","blocks":[["p","Another method is known as “Station of Aid” (maqam-i nasir). One should keep one’s eyes open and gaze on the tip of the nose with such intensity that the blackness of the eye (the pupil) disappears and only whiteness of the eyes appears. This produces a tranquil composure and wards off selfish thoughts. This is known as “Station of Aid.” During the practice one may chose to sit as in prayer (on one’s knees) or on all fours like a dog. If one does the practice as described above but fixes the gaze between the eyebrows, it is called the “Praised Station” (maqam-i mahmud). The benefits accruing from this meditation are many.\u000138\u0001"]],"advice":[]},{"title":"Morsel 13","blocks":[["p","The Yogis have eighty-four positions (bethak) and each one has its own peculiar benefit. Shaykh Baha’ al-Din Qadiri selected one as a position that comprehends all the other positions and he described it like this.\u000139\u0001 One sits on the ground cross-legged, bringing the legs together so that the heel of the left foot rests below one’s testicles and the heel of the right foot is placed close to it. Then one rests one’s seat down. Then one draws the breath upward pulling in the navel towards the back. One keeps the mouth closed and cleaves the tongue firmly to the palate. Then one stays busy in contemplation. Internally, one imagines the sounds “U He He.” One continues this practice without eating or sleeping. If the practice is continued without a break for three days, refraining from eating and sleeping, it will result in a state of un-self-consciousness and oblivion in which hidden spiritual realities are revealed. One might then return to one’s senses or one might become mad (majzub) or senseless (madhosh). If the desired effect does not happen after three days of this practice, it may be extended for another three days continuously. But between every three-day period, one should eat, drink and sleep for a while lest lunacy occurs. In this way, one may extend it extensively."]],"advice":["But between every three-day period, one should eat, drink and sleep for a while lest lunacy occurs."]},{"title":"Morsel 14","blocks":[["p","This is another method of contemplation leading to witnessing (mushahada) and beholding (mu‵ayyana). One should sit as in prayer, then observe the practice of “God is knowing” (‘alim), “God is hearing” (sami‵), and “God is seeing” (basir) while maintaining connection (rabt) with one’s spiritual guide and all the proper conditions.\u000140\u0001 When one gets firmly established in this practice, then one can sit in this form and incline one’s face towards the heart. Then one closes the eyes and, with the eyes of the heart, one gazes upon the heart and there one imagines that one is seeing God. When one gets firmly established in this practice, then one can sit as before, but one gazes towards the sky with one’s eyes open and one imagines “My soul left the body and has passed beyond the heavens and is engrossed in beholding God (mu‘ayyana-i haqq ta‵ala). When one gets firmly established in this practice, one will see a green cord connecting on one end to above the seventh heaven and on the other end to within one’s heart. This is the highest level of reflection (fikr). It is a practice that Sufi masters used to keep secret. In this practice, it is not correct to hold the image of one’s spiritual guide as a medium (wasita) for this meditation."],["p","The first stage of this practice is known as contemplation (muraqaba). The second stage is known as witnessing (mushahada). The third stage is known as beholding (mu‘ayyana). Shaykh Nasir al-Din Chiragh-i Delhi attributed these practices to Shaykh Nizam al-Din.\u000141\u0001"]],"advice":[]},{"title":"Morsel 15","blocks":[["p","Sayyid Muhammad Gisu Daraz says that one should be silent and think that “I am not, God is” (man nay-am u-st). This is expressed in a couplet of Persian poetry."],["v",["I am not, by God oh my friends, I am not","I am soul’s life, heart’s secret, body I am not","man nay-am, wa’llah yaran, man nay-am","jan-i jan-am, sirr-i sirr-am, tan nay-am"]],["p","When the meaning of this dawns to one’s thoughts, then a voice calls out “You are I,” in accord with the verse of Qur’an “Truth has come and untruth disappears.”\u000142\u0001 This is the most effective and efficient method of spiritual realization."]],"advice":[]},{"title":"Morsel 16","blocks":[["p","The whole cosmos becomes manifest (tajalli) to those who are engaged in contemplation and meditation on God. Bayazid Bistami, the chief of all sages (Sultan al-‵Arifin), was engaged in this from the cradle to the grave.\u000143\u0001"]],"advice":[]},{"title":"Morsel 17","blocks":[["p","This is a method of contemplation called “Ascension of the Sages” (mi‵raj al-‵arifin). You imagine all existing things as a multitude of mirrors. Then all that you see in them of sensory and rational phenomena you should understand as reflections of the forms of the names and attributes of God. Then imagine them and indeed the entire cosmos as a single mirror, and gaze into it in order to see the face of God with all the divine names and attributes. Do this until you become one of the people who witness divine reality (mushahada) just as you started out as one of the people who receive divine inspiration (mukashafa). Then go further and observe that you see yourself like the whole cosmos, and know that your essence encompasses everything existing and that everything existing is formed within you. Come to realize that your essence is a mirror in which all things are reflected. Just as in the beginning you saw God reflected in all things other than yourself, now you witness God reflected within your self. Then go further and observe that all potential things are in themselves really non-existent (mumkinat min haythu hiya ghayr mawjuda). So disregard them entirely, such that all things appear to you as forms of God’s self-disclosure that exist only as God supports them. All things are merely divine beauty and perfection in which you are witnessing God. Then go further and disregard the being of your own self in order to witness God alone and comprehend the divine essence, which is both the one witnessing and the one witnessed (wa huwa ’l-shahid wa’l-mashhud)."]],"advice":[]},{"title":"Morsel 18","blocks":[["p","The Naqshbandi Sufi order bases its devotional exercises on three different ways. The first way consists of spiritual concentration (tawajjuh) and contemplation on the divine essence as being without qualities and qualifications, without similarities and appearances, as is understood from the blessed divine name Allah, by which means it is expressed in languages like Arabic and Persian and others. In this way, Naqshbandi Sufis concentrate with all their force and focus until they become easily accustomed to perpetually apprehending it, and the way is opened to the spiritual experiences of “obliteration of obliteration” (fana’-i fana’)."],["p","The second way consists of contemplation through a medium (rabita). This is concentration upon the form of one’s spiritual guide (tawajjuh bi-surat-i shaykh) who is obliterated in God and sustained with God. One does this until a state of self-absence and un-self-consciousness are manifest. Then the physical form of the medium (barzakh), which is the lowest aspect of the spiritual guide, disappears from one’s sight, and one’s sight is focused only on the wide ocean of witnessing the essence and presence of God which is the highest aspect of the spiritual guide."],["p","The third way consists of silent meditation upon the phrase “no god but God” (la ilaha illa ’llah) which includes both negation and affirmation."],["p","The first way of concentrating directly upon God is the most lofty and noble, but attaining it is difficult until the spiritual seeker is pulled by divine attraction (jazba) towards God. The second way of concentrating on the form of one’s spiritual master is the shortest of all the paths, and through it comes ex
