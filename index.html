<style>
/* Layout: sticky tab bar under a masthead; one full-width reading column per tab, cards expand in place. */
:root{
  --bg:#F0E8D4; --surface:#FAF5E7; --ink:#1C2A24; --muted:#5A675F; --line:#D8CCAE;
  --emerald:#0E5A46; --emerald-deep:#093B2F; --on-emerald:#F6EFD9; --amber:#9A6212; --amber-soft:#F0DCB0;
  --good:#1F7A4D; --bad:#A63D2F;
  --display:'Marcellus','Iowan Old Style','Palatino Linotype',serif;
  --body:'Source Serif 4','Iowan Old Style',Georgia,serif;
  --arabic:'Amiri','Noto Naskh Arabic',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1612; --surface:#12231C; --ink:#EDE4CF; --muted:#9BA99E; --line:#25392F;
  --emerald:#46BD95; --emerald-deep:#0E2A21; --on-emerald:#EDE4CF; --amber:#E2A84B; --amber-soft:#3A2E14;
  --good:#58C98E; --bad:#E57F6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1612; --surface:#12231C; --ink:#EDE4CF; --muted:#9BA99E; --line:#25392F;
  --emerald:#46BD95; --emerald-deep:#0E2A21; --on-emerald:#EDE4CF; --amber:#E2A84B; --amber-soft:#3A2E14;
  --good:#58C98E; --bad:#E57F6E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;margin:0;padding-inline:16px;padding-block:0}
.wrap{max-width:920px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ar{font-family:var(--arabic);font-size:1.15em}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
.mast{padding-block:28px 18px;display:flex;gap:18px;align-items:center;justify-content:space-between}
.mast h1{font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.1;color:var(--emerald)}
@media(max-width:600px){.mast .star{display:none}.mast{padding-block:16px 10px}.mast>div{width:100%}.mast h1{font-size:1.7rem}.mast p{font-size:.9rem}.books button{font-size:.8rem;padding:5px 10px}}
.books{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.books button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:.95rem;color:var(--muted)}
.books button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#fff}
.mast p{margin:6px 0 0;color:var(--muted);max-width:56ch;font-size:.98rem}
.star{flex:none;width:64px;height:64px;color:var(--amber)}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.8rem;color:var(--muted)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding-block:8px}
nav.tabs button{flex:none;background:none;border:0;padding:8px 14px;border-radius:6px;font-family:var(--display);font-size:1.02rem;color:var(--muted);display:flex;gap:7px;align-items:center}
nav.tabs button svg{width:17px;height:17px}
nav.tabs button[aria-selected="true"]{background:var(--emerald);color:var(--on-emerald)}
main{padding-block:26px 70px}
.lead{color:var(--muted);max-width:62ch;margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:0 20px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
.card>button.hd{width:100%;text-align:left;background:none;border:0;padding:14px 16px;display:flex;gap:12px;align-items:baseline;justify-content:space-between}
.hd .t{font-family:var(--display);font-size:1.12rem}
.hd .s{display:block;font-size:.85rem;color:var(--muted);font-family:var(--body)}
.hd svg{flex:none;width:18px;height:18px;transition:transform .2s;align-self:center;color:var(--amber)}
.card[data-open="true"] .hd svg{transform:rotate(180deg)}
.card .bd{padding:0 16px 16px;display:none}
.card[data-open="true"] .bd{display:block}
.bd p{margin:.6em 0}
.bd blockquote{margin:.8em 0;padding-left:14px;border-left:2px solid var(--amber);font-style:italic}
.verse{margin:.8em 0;padding:10px 14px;background:var(--amber-soft);border-radius:4px;font-style:italic;white-space:pre-line}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--amber);font-family:var(--body);font-weight:600}
.term{border-bottom:1px dotted var(--amber);cursor:help;position:relative;color:inherit;background:none;border-top:0;border-inline:0;padding:0;font:inherit}
.tip{position:fixed;z-index:20;max-width:300px;background:var(--emerald-deep);color:var(--on-emerald);border-radius:6px;padding:10px 12px;font-size:.88rem;line-height:1.45;font-style:normal;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tip b{font-family:var(--display);font-weight:400;color:var(--amber-soft);display:block;margin-bottom:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.steps{padding-left:1.2em;margin:.5em 0}.steps li{margin:.35em 0}
.note{border-left:3px solid var(--bad);padding:6px 12px;font-size:.92rem;margin:.8em 0;background:color-mix(in srgb,var(--bad) 8%,transparent)}
.benefit{border-left:3px solid var(--good);padding:6px 12px;font-size:.92rem;margin:.8em 0;background:color-mix(in srgb,var(--good) 8%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--emerald);color:var(--on-emerald);border:0;border-radius:6px;padding:8px 16px;font-family:var(--display)}
.btn.alt{background:none;border:1px solid var(--emerald);color:var(--emerald)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-block:14px}
.ladder button{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:6px}
.ladder button[aria-pressed="true"]{background:var(--emerald);color:var(--on-emerald);border-color:var(--emerald)}
.ladder .ar{float:right}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-weight:400;color:var(--amber)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:8px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--amber)}
textarea{width:100%;min-height:120px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px;font:inherit;resize:vertical}
.prompt{font-family:var(--display);font-size:1.25rem;line-height:1.35;margin:6px 0 12px}
.diagram{max-width:340px;margin-inline:auto;display:block}
.diagram .tg{fill:var(--line);stroke:var(--amber);stroke-width:1.5;transition:.2s}
.diagram .tg.on{fill:var(--amber);}
.diagram text{fill:var(--ink);font-family:var(--body);font-size:11px}
.small{font-size:.86rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.fn{color:var(--amber);border:0;padding:0 1px;background:none;cursor:pointer;font:inherit;vertical-align:baseline}
.fn sup{font-size:.7em;font-weight:600}
.tip.fnt{pointer-events:auto;max-width:min(380px,calc(100vw - 16px));max-height:55vh;overflow:auto}
mark{background:var(--amber-soft);color:inherit;border-radius:2px;padding:0 1px}
.search{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font:inherit;margin-bottom:12px}
.card{scroll-margin-top:70px}
.fnlist{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.fnlist li{display:grid;grid-template-columns:2.2em 1fr;gap:6px;font-size:.94rem}
.fnlist b{color:var(--amber);font-family:var(--display);font-weight:400}
.btn.sm{padding:5px 12px;font-size:.9rem}
.prev{display:block;font-size:.85rem;color:var(--muted);font-family:var(--body);margin-top:2px}
.mapwrap{position:relative;height:min(88vh,980px);min-height:520px;background:#050C1B;border-radius:8px;overflow:hidden;touch-action:none;border:1px solid var(--line);cursor:grab;user-select:none;-webkit-user-select:none}
.mapwrap svg{width:100%;height:100%;display:block;font-family:var(--body)}
.mnode:focus-visible{outline:none}.mnode:focus-visible circle:first-of-type{stroke:#fff}
.mprog{position:absolute;left:10px;top:10px;z-index:3;background:rgba(24,36,60,.95);color:#E8ECF5;border-radius:10px;padding:8px 12px;font-size:.85rem;width:min(290px,calc(100% - 20px));line-height:1.4}
.mprog summary{cursor:pointer;font-family:var(--display);font-size:.98rem}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:7px;align-items:center}
.mrow .bar{grid-column:1/-1;height:5px;margin:0;background:#2A3858}
.mctl{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;gap:2px;align-items:center;background:#F6F4EC;color:#1B2333;border-radius:999px;padding:5px 14px}
.mctl button{background:none;border:0;color:#1B2333;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
.mctl button svg{width:20px;height:20px}
.mctl label{display:flex;gap:7px;align-items:center;font-size:.85rem;cursor:pointer;margin-left:6px;color:#1B2333}
.mdrawer{position:absolute;z-index:4;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--surface);color:var(--ink);border-left:1px solid var(--line);overflow:auto;padding:16px;cursor:auto;user-select:text;-webkit-user-select:text}
.mdrawer .chip svg{width:16px;height:16px;display:block}
.chip:disabled{opacity:.4}
@media (max-width:700px){.mdrawer{top:auto;height:74%;border-left:0;border-top:1px solid var(--line)}.mctl{right:6px;bottom:6px;padding:3px 8px}}
.mapwrap.big{position:fixed;inset:0;z-index:50;height:auto;min-height:0;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px)}
body.mapbig{overflow:hidden}
</style>

// Glossary: the book's own (GLOSS from glossary.js). G[key]=[term,definition]; GL=[key,regex source]
const G={},GL=[];
(function(){
 const AP="[’'‵‘]",skip=new Set(["islam"]);
 const esc1=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/[’'‵‘]/g,"@@").replace(/@@/g,AP);
 GLOSS.forEach((g,i)=>{
  const key="g"+i;let head=g[0],alts=[];
  const pm=head.match(/^(.*?)\s*\(plural ([^)]+)\)$/);
  if(pm){head=pm[1];alts.push(pm[2])}
  const hd=head.split(/\s+/);
  if(/^(fana|baqa)[’'‵‘]/.test(head)&&hd.length>1)alts.push(hd[0]);
  if(head==="zikr")alts.push("dhikr");
  G[key]=[g[0],g[1]];
  [head,...alts].forEach(a=>{
   if(a.replace(/[^A-Za-z]/g,"").length<4||skip.has(a))return;
   GL.push([key,"(?<![\\p{L}’'‵‘])"+esc1(a)+"(?![\\p{L}])"]);
  });
 });
 GL.sort((a,b)=>b[1].length-a[1].length);
})();
const PRACTICES=[
// ---- Introduction ----
{id:"prep",kind:"prep",t:"Preparing and closing a sitting",s:"Introduction, Morsel 9 (the twenty rules from the Minhaj al-Salik)",ref:["intro","M9"],
 steps:["Before (5): repent of wrongdoing; be tranquil and clean as for ablution; concentrate on your spiritual master for help, knowing that help is ultimately from God.",
 "During (12): sit cross-legged or kneeling as in prayer; hands on knees; purify the air with fragrance or incense; wear clean clothes; keep the room dark; close the eyes and stop the ears; picture the face of your guide; be truthful and sincere; choose la ilaha illa 'llah and feel its meaning at all times.",
 "After (3): keep silent for some time; practice suspending the breath; avoid cold water and cool air, which dissipate the heat built up in the heart."],
 benefit:"Kalimullah says the last rule of the 'during' list, feeling the meaning of the words as you negate every vain imagined thing, is absolutely necessary for the meditation to be effective.",
 note:"Reciting the phrase a thousand times at stated moments is said to bring sustenance of body and vitality of spirit; he reads 'sustenance' in both senses."},
{id:"breathing",kind:"prep",t:"Suspending and restraining the breath",s:"Introduction, Morsel 12",ref:["intro","M12"],
 steps:["Suspension with emptying (takhliya): draw the breath up from the abdomen, pulling the navel toward the spine, and hold it in the chest or, by some accounts, at the seat of the mind.","Suspension with filling (tamliya): draw the breath into the belly and hold it there, making the belly swell.","Restraining (hasr-i nafas): take breaths smaller than normal on both the inhale and the exhale. It makes less heat than suspension.","Exhale gently through the nostrils, never the mouth."],
 benefit:"The Chishti, Kubrawi, Shattari and Qadiri orders make suspension primary. The Naqshbandi do not require it but do not deny its worth. The Suhrawardi teachers require followers to avoid it.",
 note:"He advises: avoid very moist, sour and heating foods in these days; never practice on a full or an empty stomach; never strain, increase gradually. He also writes that blood may come from the ears or nose in the early stages."},
{id:"findguide",kind:"prep",t:"A prayer to find a guide",s:"Introduction, Morsel 19",ref:["intro","M19"],
 steps:["Rise at midnight, make ablutions, and pray two cycles, reading as much of the Qur'an as you can between them.","Prostrate and seek God's help, praying for a guide.","Say: “Oh my Lord, lead me to one of your intimate servants that he may guide me to you and teach me the way to reach you.”","Repeat until it comes to fruition."],
 benefit:"Later Shadhili masters add constant benedictions on the Prophet together with tahlil."},
// ---- Chapter One ----
{id:"initiation",kind:"zikr",t:"Initiation and transmission",s:"Chapter One, Morsel 1 and the Crumbs",ref:["ch1","M1"],
 steps:["Fast for three days (continuously if you can endure it, or breaking it with an occasional slight refreshment), repeating a thousand times the praise of God, seeking forgiveness, and invoking benedictions on the Prophet. After the third day take a full bath and appear before your guide.","Before the guide: he recites Surat al-Fatiha, al-Ikhlas, verses of al-Baqara and Al 'Imran, and the verses of forgiveness; then asks the seeker's vow to follow the Shari'a with the body and keep the heart in the love of God.","Hands joined, those present hold the hem of the seeker's garment. The guide gives the robe (khirqa) and speaks privately, giving a meditation suited to the seeker.","Transmission: the guide says the words once, the seeker repeats them while the guide listens, three times. Then: “As I received this meditation from my spiritual masters so I give it unto you.”","Daily after the five prayers: darud and Surat al-Ikhlas ten times each, six cycles of Salat-i Awabin, two further cycles. Before bed: tahlil one hundred times and al-Fatiha for the souls of one's guides."],
 note:"Meditation normally comes before contemplation, though some guides reverse them if the seeker has the capacity. Kalimullah says the greater the challenge, the greater the result."},
{id:"four",kind:"zikr",t:"Negation and affirmation in four beats",s:"Chapter One, Morsels 2–3 (zikr-i nafy o isbat, chahar zarbi)",ref:["ch1","M2"],demo:"four",
 steps:["Sit cross-legged in a narrow dark room, back straight, eyes closed, hands on the thighs.","With the big toe and next toe of the right foot, grip the sciatic nerve behind the left knee. The pressure warms the heart and melts the fat that shelters the whispering tempter.","Say la ilaha illa 'llah in four beats, aloud or silently, holding your guide's face in mind.","Perform it in ascending order of meaning across successive rounds: no god but God, no object of worship but God, no goal but God, no desire but God, no being but God."],
 benefit:"A new learner may start with the last meaning, 'no being but God', to lighten the load. The words may be taught in any language the learner knows.",
 note:"Sitting cross-legged is normally disapproved as proud. The exception is sitting alone to meditate, as the Prophet did after dawn prayer."},
{id:"two",kind:"zikr",t:"The two-beat version",s:"Chapter One, Morsel 4 (zikr-i do-zarbi)",ref:["ch1","M4"],
 steps:["Recite la ilaha ('no god') toward the right shoulder in one beat.","Recite illa 'llah ('but God') toward the heart in the second beat, with each breath.","After the third, fifth, seventh or ninth repetition, say Muhammadun Rasulu 'llahi."],
 benefit:"Slightly simpler than the four-beat form, with very little difference in effect."},
{id:"affirm",kind:"zikr",t:"Affirmation alone",s:"Chapter One, Morsel 5 (zikr-i isbat)",ref:["ch1","M5"],
 steps:["After negation and affirmation, recite 'but God' (illa 'llah) alone.","Then the name Allah alone.","Raise the voice by stages: 'la ilaha illa 'llah' quietest, 'illa 'llah' louder, 'Allah' loudest and most intense."]},
{id:"laq",kind:"zikr",t:"The babbling meditation",s:"Chapter One, Morsel 6 (zikr-i laqlaqa)",ref:["ch1","M6"],
 steps:["Say the name Allah continuously with no gap or separation.","Keep it almost inaudible, the mouth shut or open.","Some practice it with the breath suspended and some do not."],
 note:"Named after the clucking sound of a stork."},
{id:"three",kind:"zikr",t:"The three supports",s:"Chapter One, Morsel 7 (zikr-i se-paya)",ref:["ch1","M7"],
 steps:["Sit cross-legged, grip the sciatic nerve behind the left knee with the right big toe and its neighbor, draw the abdomen in toward the back, close the eyes and call up your guide's image. Imagine a three-legged ewer: the name Allah, three attributes (hearing, seeing, knowing), and the medium of your guide. Without one leg the whole falls.","Draw 'Allah' up from below the navel with force, lengthening the first 'a' and stressing the 'l', and hold the breath in the chest.","Ascent: Allah sami' (hears), Allah basir (sees), Allah 'alim (knows). Descent: reverse the order. Re-ascent: forward again. That is one cycle.","With practice, repeat the cycle many times on one held breath, up to 250. Later add five attributes (da'im, qa'im, hazir, nazir, shahid), then the seven primal attributes, then compound names."],
 benefit:"The reasoning: the sphere of hearing is smaller than seeing, and seeing smaller than knowing. The seeker widens from the sensed to the unseen to 'the beyond the beyond', then comes back.",
 note:"Always practiced with suspended breath. Do it intensely, but not to the point of harm. May God keep you safe and secure."},
{id:"shattari",kind:"zikr",t:"The lesser and great war",s:"Chapter One, Morsel 8 (Shattari)",ref:["ch1","M8"],
 steps:["Say Allah with the tongue or the heart while imagining sami', basir and 'alim, and hold your guide's form.","Begin the name from below the navel, drawing out the 'a' and emphasizing the 'la'.","If the recitation reaches the top in one breath or stroke it is 'the lesser war'. If the breath is suspended and the name with attributes is repeated a hundred times in one breath, it is 'the great war'."],
 benefit:"The great war, done with tremendous force through the medium of the guide, leads to forgetting the self and absence from the senses. It is better achieved after extensive fasting and long sleeplessness."},
{id:"six",kind:"zikr",t:"Six beats and the four-beat variation",s:"Chapter One, Morsel 9 (zikr-i shesh zarbi)",ref:["ch1","M9"],
 steps:["Six beats: say Allah toward the right, left, front, back, above and below.","Variation in four: sit facing the qibla with the Qur'an or a holy person's tomb in front. Say Allah to the left, to the right, toward the Qur'an or tomb, and inward to the heart.","Hold the form of your guide in imagination as a medium, otherwise the meditation is futile."],
 benefit:"Engrossed in this, one may discover unknown meanings of the Qur'an or the state of the holy person in the tomb."},
{id:"smith",kind:"zikr",t:"The blacksmith's meditation",s:"Chapter One, Morsel 10 (zikr-i haddadi)",ref:["ch1","M10"],
 steps:["Sit on your knees, legs folded beneath you, and face left.","Say 'no god' while drawing out the 'la' and rising high on your knees.","Throw yourself down into a seated position as you say 'but God' like a sledgehammer onto the heart.","Continue until a spiritual sensation (zauq) arises."],
 note:"Kalimullah calls it a method of 'a lot of pain and effort'. In General Advice he says forceful practices should not be taught to children who have not reached maturity."},
{id:"breath",kind:"zikr",t:"Observing the breath",s:"Chapter One, Morsel 11 (pas-i anfas)",ref:["ch1","M11"],
 steps:["On the exhale, recite 'no god' (la ilaha); on the inhale, 'but God' (illa 'llah).","Keep your attention on the navel as it draws in and extends out."],
 benefit:"When it continues in each breath, waking or asleep, the text says the length of one's life is doubled."},
{id:"hu",kind:"zikr",t:"The breath as the heart's language",s:"Chapter One, Morsel 12",ref:["ch1","M12"],
 steps:["Recite the name with the final 'h' extended to 'hu': 'Alla-' on the inhale, '-hu' on the exhale, without the voice (the breath expresses the language of the heart).","A nasal 'sawing' sound may arise. It builds zeal but can heat and dry the head, so almond oil on the nostrils and forehead is suggested.","Teaching a beginner: sit knee to knee, chin on chest, abdomen drawn in, chest out, eyes closed. As the learner exhales fully the guide inhales for him, grafting his breath onto the learner's. The breath spontaneously cries 'la ilaha illa 'llah' or 'Allahu'; the cry may be so forceful that blood oozes from the beginner's nose and ears."],
 note:"It can pass 'from bosom to bosom' without words. If the learner is controlling his own breath in contemplation, it cannot be transmitted; the author tells of an occasion this overwhelmed the guide and disrupted a gathering."},
{id:"spirit",kind:"zikr",t:"Discovering the state of a spirit",s:"Chapter One, Morsel 13 (zikr-i kashf-i ruh)",ref:["ch1","M13"],
 steps:["Recite 'Oh Lord' (ya rabb) twenty-one times.","Say 'Oh spirit of the spirit' (ya ruh al-ruh) once, with force upon the heart.","Raising the head, say 'Oh spirit, just as God wills' (ya ruh ma sha' Allah).","Fix the mind on the person whose state you wish to know. The spirit appears in waking or dream; done 2000 times, the result is speedy."],
 note:"Chiragh-i Delhi taught this to Gisu Daraz."},
{id:"hahuhi",kind:"zikr",t:"Ha Hu Hi",s:"Chapter One, Morsel 14",ref:["ch1","M14"],
 steps:["Some guides teach the compressed form of 'no god but God' as three syllables.","Ha toward the right, Hu toward the left, Hi toward the heart."]},
{id:"graves",kind:"zikr",t:"Discovering the state of those in graves",s:"Chapter One, Morsel 15 (zikr-i kashf-i qubur)",ref:["ch1","M15"],
 steps:["Sit close by the tomb. Lift the head and face the sky: “Reveal to me, oh light!” (akshif li ya nur).","A strong beat to the heart: “Reveal to me…”","A beat toward the tomb: “…what is his condition!” (‘an halihi).","The state of the buried is known in dream or otherwise."]},
{id:"prayers",kind:"zikr",t:"For prayers to be answered",s:"Chapter One, Morsel 16 (zikr li-ijaba al-da'wat)",ref:["ch1","M16"],
 steps:["Make each beat through the medium of imagining your guide.","Say 'Oh lord!' (ya rabb) to the right, the left, and the heart. Then the same with 'Oh my lord!' (ya rabbi).","Repeat many times, holding in the heart what you desire.","To end, lift the open hands, pass them over the face, repeating 'Oh my lord!'"],
 note:"The method is attributed to Ibn 'Arabi."},
{id:"naq",kind:"zikr",t:"The Naqshbandi meditation",s:"Chapter One, Morsel 17",ref:["ch1","M17"],
 steps:["Touch the tongue tip to the palate and suspend the breath.","Imagine 'no' (la) from the navel up to the head; 'god' (ilaha) inclining to the right shoulder; 'but God' (illa 'llah) to the left toward the heart with force felt in the whole body. The path follows the shape of 'la' in Arabic script.","Say in the heart: “Oh God, you are my goal and I desire your contentment.” Show no outward motion.","Repeat an odd number of times per held breath; on the exhale say 'Muhammad is the messenger of God' in the heart."],
 note:"If more than twenty-one repetitions bring no absence from self, stop and start afresh: some condition of the method was neglected."},
{id:"twofour",kind:"zikr",t:"Imagining the Prophet, the guide, God, and absolute being",s:"Chapter One, Morsel 18",ref:["ch1","M18"],
 steps:["Recite la ilaha illa 'llah toward the right, imagining the Prophet.","Toward the left, imagining your guide.","Toward the heart, imagining God therein.","A little further in toward your center, imagining absolute being."]},
{id:"illness",kind:"zikr",t:"For preventing illness",s:"Chapter One, Morsel 19 (zikr-i daf-i marz)",ref:["ch1","M19"],
 steps:["'Oh singular One!' (ya ahad) toward the right.","'Oh eternal One!' (ya samad) toward the left.","'Oh unique One' (ya witr) toward the heart."]},
{id:"wahhab",kind:"zikr",t:"The bountiful One",s:"Chapter One, Morsel 20 (zikr-i wahhab)",ref:["ch1","M20"],
 steps:["After the evening prayer, pray two cycles.","In each cycle after al-Fatiha, recite Surat al-Ikhlas eleven times and 'Oh bountiful One!' (ya wahhab) seventy times."],
 benefit:"Said to remove worldly needs and anxieties."},
{id:"walk",kind:"zikr",t:"Walking step by step",s:"Chapter One, Morsel 21 (zikr-i mashy-i aqdam)",ref:["ch1","M21"],
 steps:["Swift pace: say 'but God' (illa 'llah) at each step.","Slow pace: 'no' on the right foot, 'god' on the left, then 'but' on the right, 'God' on the left.","Medium pace: simply 'Allah' on every step."],benefit:"The one practice here that needs no seclusion."},
{id:"realms",kind:"zikr",t:"One phrase, four realms",s:"Chapter One, Morsel 22",ref:["ch1","M22"],
 steps:["The whole phrase 'no god but God': the human realm (nasut).","'But God' alone: the spiritual realm (malakut).","The name 'God' alone: the archetypal realm (jabarut).","The pronoun 'he' (hu) alone: the divine realm (lahut)."]},
{id:"withness",kind:"zikr",t:"With-ness, allness and all-encompassing",s:"Chapter One, Morsel 23 (first group)",ref:["ch1","M23"],
 steps:["These are transmitted from heart to heart only after strenuous exercises and forty-day retreats.","With-ness: 'Oh with me, oh with me, oh with me, oh he, oh he, oh he' (ya ma'i ×3, ya hu ×3). Sit on the knees with feet protruding, each hand firmly holding the opposite arm. Five beats: between knee and right foot; the sky; between knee and left foot; the liver; the heart with great force.","Allness: 'All is with you, all is from you, all is to you, oh all of all.' Sit cross-legged; beats to the front, right, left, sky and heart.","All-encompassing: 'Oh you who encompass all without and all within' (ya muhit zahran wa batnan). Open the eyes at 'without', close them at 'within'."],
 note:"During with-ness he advises drinking milk, especially mixed with saffron, and using a lot of incense."},
{id:"dirs",kind:"zikr",t:"Obliterating all directions",s:"Chapter One, Morsel 23 (second group)",ref:["ch1","M23"],
 steps:["Stand facing the heavenly throne: 'You are above me.' Turn to the earth and sit: 'You are below me.'","Face front: 'before me'; head to the rear: 'behind me'; right: 'right of me'; left: 'left of me.'","A beat to the heart: 'You are in me.'","Finish: 'and I am with you in all directions. Wherever you may turn there is the face of God.' (Qur'an 2:115)"],
 benefit:"Hold the meaning of the words and the image of your guide throughout."},
{id:"selfhood",kind:"zikr",t:"Manifesting selfhood, and Shakar Ganj's Punjabi zikr",s:"Chapter One, Morsel 23 (last group)",ref:["ch1","M23"],
 steps:["After the late-night vigil prayer, say 'I am God, there is no god but I' (inni ana Allah la ilaha illa ana) a hundred times: head lifted to heaven for 'I am God', lowered to the right for 'there is no god', and 'but I' to the heart with great force.","Hold the meaning of the words and the image of your guide.","Shakar Ganj's Punjabi meditation: 'Above is you' (celestial worlds), 'Below is you' (terrestrial worlds), 'You are only you' (the ultimate absolute)."]},
{id:"closing",kind:"zikr",t:"Closing a meditation assembly",s:"Chapter One, Morsel 24",ref:["ch1","M24"],
 steps:["Say three times: “Glory be to God, may God be praised. Glory be to God most great and may he be praised.”","Then pray: “Oh God, you said ‘So remember me that I remember you’ and I have remembered you to the meager degree of my knowledge, reason and understanding. Remember me with the bounteous capacity of your self… Oh God, open the ears of our hearts with your remembrance, oh you, who are the best of those who remember.”"]},
// ---- Chapter Two ----
{id:"c2found",kind:"fikr",t:"Replacing the self's speech",s:"Chapter Two, Opening and Morsel 1",ref:["ch2","M1"],
 steps:["Name the three illnesses: the speech of the self, tempting thoughts, and observing things other than God.","Contemplate the name Allah, displacing the speech of the self.","Contemplate the primal qualities of the divine, displacing tempting thoughts.","Keep the heart's gaze on the beauty of your guide, the medium."]},
{id:"light",kind:"fikr",t:"Dissolving into light or darkness",s:"Chapter Two, Morsel 2",ref:["ch2","M2"],
 steps:["Observe Allah as the holy, wholly other essence, beyond all limits.","If the mind cannot grasp it, imagine pure undifferentiated light, an ocean in which you are one drop.","Or imagine impenetrable darkness in which you are a shadow that vanishes as it merges."]},
{id:"c2guide",kind:"fikr",t:"The guide's image and the heart",s:"Chapter Two, Morsel 3",ref:["ch2","M3"],
 steps:["Hold the image of your guide to feel his heat and presence, and so focus on your own all-comprehensive spiritual reality, the heart.","Concentrate on the flesh of the heart, imagining the way as clear, smooth and endless. When a thought makes you slip, shake it off, or ward it off through the guide's image.","If it persists, exhale forcefully through the nostrils; recite the prayer for forgiveness; imagine 'Oh effective One' (ya fa'al); consider 'no existence but God'; then say Allah with intensification and elongation as a forceful beat on the heart."]},
{id:"c2sense",kind:"fikr",t:"Seeing every sensed thing as Being's manifestation",s:"Chapter Two, Morsel 4",ref:["ch2","M4"],
 steps:["Understand whatever you sense, universal or particular, as witnessing absolute being in a particular form at that moment.","Then negate every phenomenal appearance and affirm the experience of self-absence."],
 note:"He warns that clinging to whatever comes in self-absence is, in the view of the sages, infidelity. The benefit of self-absence can be the beginning of bewilderment."},
{id:"c2self",kind:"fikr",t:"The all-comprehensive reality of the self",s:"Chapter Two, Morsel 5",ref:["ch2","M5"],
 steps:["Look within with the eye of the heart at your own all-comprehensive spiritual reality, in all actions and states.","See that everything in the world, good or bad, subtle or gross, is a reflection of it.","Imagine the cosmos as the body and your self as its soul. This station is 'comprehending comprehensiveness' (jam' al-jam')."]},
{id:"c2word",kind:"fikr",t:"Gazing at the written words",s:"Chapter Two, Morsel 6",ref:["ch2","M6"],
 steps:["Look at the written form of 'no god but God' or of 'God', with the eye of the head on paper, or with insight on the tablet of imagination.","Continue until you are oblivious to the form and unaware of being oblivious."]},
{id:"c2obj",kind:"fikr",t:"Gazing at an object",s:"Chapter Two, Morsel 7",ref:["ch2","M7"],
 steps:["Choose a stone, a clod, a grave, the Qur'an, a beloved face, your guide's face or a flower.","Gaze without blinking while focusing the inner concentration, through the object, on the absolute reality.","Persist until selfish thoughts cease and you are oblivious even to the fact that you are oblivious."],
 note:"Attributed to Ibrahim ibn Adham Balkhi."},
{id:"c2god",kind:"fikr",t:"God as what God is",s:"Chapter Two, Morsel 8",ref:["ch2","M8"],
 steps:["Retire all personal powers from dispersive actions and clear the mind of every knowledge or belief other than God.","Concentrate on God as God is, without limiting God by any conception of transcendence or immanence.","Do so with belief in oneness, firm determination, force of will and pure sincerity, until distraction ends."]},
{id:"c2origin",kind:"fikr",t:"The self as origin of disclosures",s:"Chapter Two, Morsel 9",ref:["ch2","M9"],
 steps:["Contemplate the self as the origin of divine disclosures, not their consequence.","See all things as both absolute and limited being, with reality being that both are one."],benefit:"Persisting for a long time induces intense spiritual experience (zauq)."},
{id:"c2heart",kind:"fikr",t:"Closing the eyes on the heart",s:"Chapter Two, Morsel 10",ref:["ch2","M10"],
 steps:["Close the eyes and fix the gaze on the heart.","Stay aware that God is present and watching and with you."]},
{id:"c2blink",kind:"fikr",t:"Gazing without blinking",s:"Chapter Two, Morsel 11",ref:["ch2","M11"],
 steps:["Keep the eyes open and strive not to blink, staring upward or straight ahead.","Light and heat issue from the eyelids and spread through the body, giving a feeling of passionate love."]},
{id:"c2aid",kind:"fikr",t:"Station of Aid and Praised Station",s:"Chapter Two, Morsel 12",ref:["ch2","M12"],
 steps:["Eyes open, gaze at the tip of the nose until the pupils disappear and only the whites show. This is the Station of Aid: tranquil composure that wards off selfish thoughts.","Fix the gaze between the eyebrows instead and it is the Praised Station.","Sit as in prayer on the knees, or on all fours like a dog."]},
{id:"c2yoga",kind:"fikr",t:"The comprehensive posture and three-day sitting",s:"Chapter Two, Morsel 13",ref:["ch2","M13"],
 steps:["Sit cross-legged with the left heel below the testicles and the right heel close to it; draw the breath up, pulling in the navel; keep the mouth closed and cleave the tongue to the palate.","Internally imagine the sounds 'U He He', without eating or sleeping.","After three days, this can result in un-self-consciousness and oblivion with hidden realities revealed. If not, extend for another three days."],
 note:"Between three-day periods, eat, drink and sleep for a while, lest lunacy occurs. After the sitting one might return to one's senses or become mad (majzub) or senseless."},
{id:"c2three",kind:"fikr",t:"Contemplation, witnessing, beholding",s:"Chapter Two, Morsel 14",ref:["ch2","M14"],
 steps:["Sit as in prayer; hold 'God is knowing, hearing, seeing' with your guide as the connection.","Next, close your eyes, gaze on your heart with the eyes of the heart and imagine you are seeing God.","Next, gaze toward the sky and imagine your soul has left the body and passed beyond the heavens, engrossed in beholding.","A green cord is then seen from above the seventh heaven to the heart."],
 note:"Masters kept this secret and the guide's image is not used as a medium here. The stages are muraqaba, mushahada, mu'ayyana."},
{id:"c2notme",kind:"fikr",t:"'I am not, God is'",s:"Chapter Two, Morsel 15",ref:["ch2","M15"],
 steps:["Be silent and think that 'I am not, God is' (man nay-am u-st).","When the meaning dawns, a voice calls out 'You are I.'"],
 benefit:"Sayyid Muhammad Gisu Daraz calls this the most effective and efficient method of realization."},
{id:"c2all",kind:"fikr",t:"Ascension of the Sages",s:"Chapter Two, Morsel 17 (mi'raj al-'arifin)",ref:["ch2","M17"],
 steps:["See every existing thing as a mirror reflecting the names and attributes of God.","Imagine the entire cosmos as a single mirror and gaze into it for the face of God.","Turn to your own essence: it is a mirror in which all things are reflected.","Recognize that all possible things are in themselves non-existent and exist only as God supports them.","Finally disregard your own being, to witness God alone, both the one witnessing and the one witnessed."]},
{id:"c2naq",kind:"fikr",t:"Three Naqshbandi ways",s:"Chapter Two, Morsel 18",ref:["ch2","M18"],
 steps:["Concentration (tawajjuh) on the divine essence without qualities, as understood from the name Allah.","Contemplation through a medium (rabita): concentration on the form of one's guide until his physical form disappears.","Silent meditation on 'no god but God'."],
 benefit:"The first way is loftiest but difficult, the second is the shortest, and the third is the most reliable and the foundation of all exercises."},
{id:"c2mirror",kind:"fikr",t:"Gazing in a mirror",s:"Chapter Two, Morsel 19",ref:["ch2","M19"],
 steps:["Gaze for a long time in a mirror until your own face seems the face of your guide.","Continue until you attain self-absence from your senses."]},
{id:"c2name",kind:"fikr",t:"Gazing at the written name",s:"Chapter Two, Morsel 20",ref:["ch2","M20"],
 steps:["Gaze at the name Allah written in silver or gold ink.","Or inscribe it in the imagination on the scroll of the heart, and concentrate until self-absence."]},
// ---- Conclusion ----
{id:"vib",kind:"heart",t:"Listening to the heart's vibration",s:"Conclusion, Morsels 2–4",ref:["con","M2"],
 steps:["Sit in an isolated corner facing Mecca, with ablutions. Close the eyes; press the tongue to the palate.","Imagine the flesh of the heart saying Allah and strive to hear it with firm resolve.","If breathing masks it, hold the breath beneath the navel, so the heart becomes like water still in a basin. Exhale slowly and gently.","Keep trying without despair. It is impossible for the heart to attend to two things at once."],
 note:"Do not suspend the breath to the point of being deadly sick; do it according to your own capacity."},
{id:"vib2",kind:"heart",t:"Cultivating and spreading the vibration",s:"Conclusion, Morsels 5–8",ref:["con","M5"],
 steps:["Put aside other worship that interferes with this connection; keep what does not interfere.","Open the eyes little by little while keeping the connection: 'alone in the midst of company'.","Do not attend to vibrations arising in limbs; keep concentration on the heart.","When the light of remembrance spreads through the body, do not be distracted by joy, anxiety or tears. 'The Prime Recitation' is the whole body resonating as one voice."]},
{id:"vib3",kind:"heart",t:"The goal is presence, not the name",s:"Conclusion, Morsels 9–11",ref:["con","M10"],
 steps:["If longing for a divine secret becomes an impediment, turn to your guide with respectful conduct. He may say, 'The time has not yet arrived for you to discover such a secret!'","Remind yourself that the goal is to be obliterated in the object of meditation, not the name.","If you hear walls or stones reciting, do not be arrested by it: it comes from the power of your own recitation."]},
{id:"sound",kind:"heart",t:"The eternal sound",s:"Conclusion, Morsel 12 (sawt-i sarmadi)",ref:["con","M12"],
 steps:["Close both ears firmly with your forefingers.","Listen within for a sound like water continuously falling from on high.","When proficient, withdraw the fingers bit by bit while holding on to the sound.","Aim to hear it even amid the world's din."],
 benefit:"Shaykh Yahya Madani told Kalimullah the practice gathers scattered thoughts in one direction and begins self-absence. Practitioners include Miyan Mir of Lahore and his companions."},
{id:"beyond",kind:"heart",t:"Beyond the vibration",s:"Conclusion, Morsels 13–16",ref:["con","M13"],
 steps:["When the second, continuous vibration spreads, keep focusing on God. If you cannot, concentrate on the heart without any divine name.","Aim to be aware of the vibration without the mediation of the heart, then of God alone.","If you lose contact, return step by step: the universal vibration, the heart's continuous vibration, its periodic vibration.","If that fails, gather your concentration with a cold bath, two or three forceful breaths to the head, or the name 'One who does' (fa'al).","Keep your hands busy with work and your heart engaged with the beloved."],
 note:"Without an intermediary, concentration on God is the true meditation of the heart."},
{id:"lightcord",kind:"heart",t:"Light, the cord, and obliteration",s:"Conclusion, Morsels 17–18",ref:["con","M17"],
 steps:["Do not long for light to appear. The goal can be reached without ever seeing it.","Sense a cord from the center of the heart to the divine essence, understood as a command of the absolute.","If it is hard, concentrate on the whole cosmos stripped of its distinctions: an ocean of light, an endless darkness or the ether. All are only metaphors.","Fana' is losing knowledge of self; fana' al-fana' is losing knowledge of that too."],
 note:"Sufi masters advise seekers at this station not to do too much of conventional devotions, which might loosen one's hold on the cord."},
// ---- General Advice ----
{id:"gamedium",kind:"heart",t:"Choosing a medium",s:"General Advice, Morsel 3",ref:["ga","M3"],
 steps:["A guide chooses a medium suited to each disciple: abstract and universal for a strong intellect, sensory and specific for a weaker one.","The choice follows what the disciple values most and finds most beautiful.","Gradually, with practice, he is released from that attachment as his relation to physical things lessens and to spiritual things deepens."]},
{id:"gaheat",kind:"heart",t:"Heat, age and forceful practices",s:"General Advice, Morsel 4",ref:["ga","M4"],
 steps:["Forceful practices (breath suspension, two-beat, six-beat, the blacksmith) build internal heat that kindles love.","They bear fruit more quickly with the young.","Do not teach them to children who have not reached maturity, lest they burn up with internal heat.","For older seekers who feel cool, Nizam al-Din Narnauli prescribed Panwar seeds as an herbal remedy."]},
{id:"gamusic",kind:"heart",t:"Listening to music and staying grounded",s:"General Advice, Morsel 6",ref:["ga","M6"],
 steps:["A melody is a spark kindled by intense love, not something external to the seeker.","In the beginning, music brings weeping and restlessness; for those at bewilderment, soft and harmonious movement.","The one who first rises to dance is responsible for whatever happens in the assembly.","The Risala Qushayriya advises not moving from one's place, however overcome, and being firmly grounded."]}
];

const BOOK={"sections":[{"id":"notes","title":"Translator's Notes","sub":"by Scott Kugle","items":[{"title":"Translator's Notes","blocks":[["p","This is the most important and widely read text by Shaykh Kalimullah Shahjehanabadi, at least in the eyes of practicing Sufis. It is an indispensable manual for how to practice Sufi meditation and contemplation, complete with detailed instructions and theoretical framework. The author draws upon a wide eclectic array of sources and styles, reflecting the whole diversity of Sufi orders that were active in South Asia and Arab lands during his lifetime in the 17th century."],["p","The playful title that Shaykh Kalimullah chose for this text reflects his concern to be eclectic and all-inclusive. He calls it Kashkul which in Persian and Urdu means an alms bowl of a particular type common in South Asia. It is crafted from a species of large gourd whose shell is sliced in half to create a large, heavy, sturdy oval bowl of utterly elegant simplicity. It is polished with oil to give it a characteristic black sheen and makes it easy to clean. A Sufi with a kashkul is a distinctive sight, and without having to ask for anything the alms bowl itself signals to people that he will accept a morsel in donation. One can still see a kashkul in use in places like Hyderabad, though they are becoming heirlooms of the past now, as mendicancy and ascetic renunciation become more rare (perhaps as a function of generosity becoming a rarer quality even as prosperity increases!)."],["p","Shaykh Kalimullah calls his collection of meditation techniques an alms bowl, because he circled from teacher to teacher and order to order, begging for the choicest teachings. He collected them in one text, as nourishment for the soul of the spiritual seeker. Indeed, each subsection of his book is called a “morsel” while smaller points of clarification are called “crumbs.” In the introduction, he explains why he gathered these meditation techniques into one text, like food donations in a beggar’s bowl. “Let this be nourishment for any who longs for the taste of sweet union with the divine. Each morsel in it has a particular quality that might be relished by some while appearing unappetizing to others. Each crumb of its bread has a special taste that some might find appealing while others consider it bland. Therefore each and every crumb is given to the seeker who is mastering this Sufi path towards the truth (that all may choose) daily bread as they prefer—whether buttered or honeyed, whether of crispy bran or hearty barley.” Shaykh Kalimullah wrote this text in two months, finishing on 3 October 1690 CE (the last day of Dhu’l-Hijja 1101 AH), as he explains in the text itself. The original text is in Persian, but it has been translated into Urdu because it is in constant use by modern Sufis in South Asia."],["p","This translation has been rendered from what appears to be the earliest printed edition, an undated lithograph print from a press that was active around the end of the 19th century and into the early 20th century. In preparing this translation, I also referred occasionally to a later undated (later 20th century) version that republished the Persian text with an Urdu translation; this was republished under the auspices of Muhammad Mustahsin Sahib Faruqi, the hereditary custodian (sajjada-nashin) of Shaykh Kalimullah’s dargah in Delhi. He endeavored to have all of Shaykh Kalimullah’s books republished with Urdu translations, in order to reach a wider modern audience in South Asia. This English translation continues the tradition by rendering the text into English in a style that, it is hoped, will be accurate, accessible and appealing to a modern audience both in the West and in South Asia."]],"advice":[]}]},{"id":"open","title":"Opening","sub":"Invocation and statement of purpose","items":[{"title":"Opening","blocks":[["p","In the name of God, the compassionate and merciful."],["p","All praise be to God—from God, to God and for God alone. Blessings from God (be upon the Prophet Muhammad) and the peace of God. This is an Alms Bowl (kashkul) full of spiritual morsels. They strengthen the divine quality (latifa rabbaniya) inherent in every person and nourish the universal intellect (nafs-i natiqa) that animates each soul. These morsels fill the outer form of religion (islam) with the inner spirit of true faith (iman). They confer on each realized person the profound blessing of eternal life and treat with compassionate healing those who are sick with egoistic desires."],["p","These are a few pages—no, a few chapters in reality—filled with cooked morsels comprising all kinds of meditation and contemplation. I, Kalimullah, the writer of these pages, have begged for these morsels from many spiritual teachers and guides for the sake of all who hunger with sincere appetite and truth-seeking imagination. Let this be nourishment for any who long for the taste of sweet union with the divine. Each morsel in it has a particular quality that might be relished by some while appearing unappetizing to others. Each crumb of its bread has a special taste that some might find appealing while others consider it bland. Therefore each and every crumb is given to the seeker who is mastering this Sufi path towards the truth [that all may choose] daily bread as they prefer—whether buttered or honeyed, whether of crispy bran or hearty barley. Let all seekers find something nourishing here according to their capacity. Let all with spiritual appetite (zauq) find here a taste of felicity."],["p","Before this, I had written a text entitled The Patched Cloak (Muraqqa’), in which I stitched together devotions and prayers, so that those naked in the cold winter of witnessing might wrap their exposed bodies in the protective clothing of piety and God-consciousness (taqwa). Then at the request of some sincere friends, the writer began to collect these morsels fit for beggars starting on August 6, 1690 (1 Dhu’l-Qa’da 1101). I present them now in The Alms Bowl so that those with spiritual taste and divine longing might reach their full capacity. May they repay this favor with a simple wish that God grant this nobody wellbeing. We ask God to always ask God for nothing but God! By the grace of him (Muhammad) whom God appointed as the first of divine emanations and chose as God’s own Prophet."],["p","This book consists of an introduction, two chapters, and a conclusion. Then with all its faults, we can call it complete."]],"advice":[]}]},{"id":"intro","title":"Introduction","sub":"Morsels 1–19","items":[{"title":"Introduction","blocks":[["p","You should know that absolute being (wujud-i mutlaq) was hidden and unknowable before its coming into duality (ma’iyat) with the material universe that is like its shadow. From that primordial unknowability there was no sign by which it could be known. As required by overpowering, absolute being—of itself by itself—exerted its potential to unfold in emanations (maratib) of divinity and cosmos as higher levels to lower levels. Through this duality, lover and beloved became manifest, since each manifestation generates a higher and a lower. From the perspective of being a limited manifestation, it is “lover;” from the perspective of being a higher manifestation above it, it is “beloved.” The perfection of each specific manifested being (ta‵ayyun) is in returning to its original state of absolute being. Its ultimate goal is to revert to that undifferentiated state (be-rangi) from whence it originated."],["p","When I speak here of “manifestation” I mean specifically the primordial human being (hazrat-i insan) who is the being in whom all qualities of God’s essence and divine attributes appear. In comparison to all other manifestations, the human being excels by bearing the trust (amanat).\u00011\u0001 Human perfection therefore consists of passing through the state of losing one’s self in God (fana’ fi’llah) so that one might achieve the state of remaining with God (baqa’ bi’llah) as eternal. To realize this, one first journeys to reach God (sayr ila ‘lah) and then one journeys in God (sayr fi’llah). There is an end to the first journey but in the second journey there is no end."]],"advice":["You should know that absolute being (wujud-i mutlaq) was hidden and unknowable before its coming into duality (ma’iyat) with the material universe that is like its shadow."]},{"title":"Morsel 1","blocks":[["p","Union is a term signifying separation from all that is other than God and indifference to all that is the world. It means focusing entirely on the divine and becoming effaced in utterly undifferentiated being and absolute oneness (itlaq). The initial experience of this is un-self-consciousness (be-khudi) and absence from all sensory perception; this is a condition resembling death, except that in death there is no presence while this state is nothing but pure presence. When a seeker experiences this, the term wilayat applies to him (and he is considered a “Friend of God”) even if the experience lasts only an hour. Then if the seeker returns to his senses, he is considered amongst those firm saints (ashab-i tamkin), and this steadfastness is sometimes bestowed quickly and other times only after a long while. If the seeker remains in that state of un-self-consciousness and intoxication, he is considered one of the masters of transforming spiritual states (arbab-i talwin). Therefore, seekers should keep their vision focused on losing one’s self and bearing witness to the divine essence of undifferentiated quality, for their spiritual journey will be more perfect that way. But if the seekers’ vision should stray to the right or left in order to engage other limited manifestations (kashf-i ta’ayyunat), they will go astray from the straight path."]],"advice":["Therefore, seekers should keep their vision focused on losing one’s self and bearing witness to the divine essence of undifferentiated quality, for their spiritual journey will be more perfect that way.","But if the seekers’ vision should stray to the right or left in order to engage other limited manifestations (kashf-i ta’ayyunat), they will go astray from the straight path."]},{"title":"Morsel 2","blocks":[["p","In writings about the spiritual path, one sees each station (maqam) described with a special quality and in an attractive poetic language, such that one’s heart desires to experience that station alone and no other station. One feels a strong aspiration to achieve that station and exerts all efforts to get there, find no rest without it, thinking perhaps that “asking for everything means getting nothing.” One thus hesitates with doubt, thinking “which station should I strive for?” or asserting “I already got that station!” Yet each station is a good choice and is worthy of the highest sacrifice."],["p","Yet in the opinion of this humble writer it is better that seekers, instead of striving after a certain station, should focus their whole concentration on one simple goal. That is, after making their obligatory prayers (farz) and optional prayers (sunna) as the Prophet taught, along with other duties incumbent on a Muslim, seekers should resolve to stay engaged in meditation (zikr) and contemplation (fikr) and intimacy (uns). Sometimes, seekers might stay engrossed in offering copious devotions (nafila), reciting the Qur’an, glorifying God’s name, chanting litanies (wird) and invocations (da’wat) and meditations (azkar) which all confer spiritual reward; yet seekers should leave aside inventive discourses and fanciful allusions and all other kinds of good deeds. In this way, day in and day out, seekers should obliterate the imagined existence of their ego selves, until the divine—by grace (inayat) granted before time—might draw them up out of their limited selves and lead them through obliteration of passing away (fana’ al-fana’) and from there into eternal remaining (baqa’ al-baqa’). At that point, the seeker’s essence is seen as divine essence, the seeker’s quality appears as divine quality, the seeker’s effect is found be divine effect, and the seeker’s act is considered the divine act. Whatever leads to this consummation should be encouraged, and whatever distracts from it should be avoided."],["p","All the various Sufi orders (silsila) are in agreement on this point, that the seekers of God must necessarily become so engrossed that they are removed from their own self concern. I find that nothing leads one to self-effacement better than meditation and contemplation. Yet some Sufi orders consider certain types of meditation to be better than other types; in this alone did various Sufi masters differ."]],"advice":["One thus hesitates with doubt, thinking “which station should I strive for?” or asserting “I already got that station!”","Yet in the opinion of this humble writer it is better that seekers, instead of striving after a certain station, should focus their whole concentration on one simple goal.","That is, after making their obligatory prayers (farz) and optional prayers (sunna) as the Prophet taught, along with other duties incumbent on a Muslim, seekers should resolve to stay engaged in meditation (zikr) and contemplation (fikr) and intimacy (uns).","Sometimes, seekers might stay engrossed in offering copious devotions (nafila), reciting the Qur’an, glorifying God’s name, chanting litanies (wird) and invocations (da’wat) and meditations (azkar) which all confer spiritual reward; yet seekers should leave aside inventive discourses and fanciful allusions and all other kinds of good deeds.","In this way, day in and day out, seekers should obliterate the imagined existence of their ego selves, until the divine—by grace (inayat) granted before time—might draw them up out of their limited selves and lead them through obliteration of passing away (fana’ al-fana’) and from there into eternal remaining (baqa’ al-baqa’).","Whatever leads to this consummation should be encouraged, and whatever distracts from it should be avoided."]},{"title":"Morsel 3","blocks":[["p","In the discourse of Sufi masters, descriptions of the ways of meditation and contemplation are numerous and varied. But most dependable is the description given by al-Sulami.\u00012\u0001 He says, “There are many types of meditation. One type is meditation of the tongue (lisan), and it needs no further explanation, as one repeats vocally a name of God or a phrase. Another type is meditation of the heart (qalb), which means purifying the heart of selfish desires and fiendish temptations in order that it remember God in truth. A third type is meditation of the inner heart (sirr), which fills the inner heart such that momentary stray thoughts which give rise to desires have no way to fix themselves in the heart. Meditation of the inner heart is the outcome of meditation of the heart. The inner heart is a subtle energy within and beyond the heart. Perpetual presence with the divine is possible for the inner heart to achieve, whereas the heart itself undergoes constant change, motion and transformation (taqallub) from one moment to the next, and therefore perpetual presence is not available to or through it. A fourth type is meditation of the spirit (ruh), which consists of the one meditating becoming obliterated and oblivious to any personal qualities of the self, when he realizes that the object of meditation—God—is actually thinking of the one meditating. In this state, nothing remains of the one meditating—no meditation, no spiritual state, and no personal quality. In order to understand this, one could say that God is the one meditating and remembering you before you have ever started to meditate to remember God. You can grasp this meaning through a poetic couplet:"],["v",["Considering your existence, it is strange that I’m existing","When you begin to speak, it’s fitting that I stop speaking"]],["p","Then regarding contemplation al-Sulami states, “Similarly, means of contemplation are of several types. One type is the seeker’s deep reflection (tafakkur) on all his or her sinful deeds, oppositional attitudes and weak shortcomings when performing the duties owed to God. Another type of contemplation is the seeker’s reflection on God’s bounty and grace and the seeker’s acknowledging lack of proper gratitude for these blessings; for even if one gave thanks and showed gratitude, it would fall short of proper response. A third type of contemplation is the seekers’ reflection on all that was apportioned for them before that time (azal) wherein one’s destiny was sealed—for it is said “Dried is the pen in writing out what will happen good or bad”—and on how undeserving they are of any blessings granted to them before they ever existed. Another type of contemplation is reflection on the excellent craftsmanship and fine skill of divine design in forging all things in the material world (mulk) and spiritual world (malakut) which bedazzle the mind with God’s majesty, refresh the heart’s awe regarding God’s greatness, and keep one aware of remembering God’s presence."],["p","Al-Sulami further explains that the object of reflection in contemplation is the self (nafs) while the object of remembrance in meditation is God; for this reason, spiritual leaders consider meditation to be superior to contemplation. In elaborating on what al-Sulami states, we can see that meditative remembrance (zikr) is an attribute of God while contemplative thinking is not. So a human act which echoes an attribute of God is more perfect, while a human act that does not echo any attribute of God is lesser. The person who meditates turns towards the divine essence, for meditation is the result of spiritual knowledge (ma‘rifat) and devotional love (muhabbat). In contrast, the person who contemplates dwells on the self, its condition, its states, its being less or more, its being too much or too little—all in all, contemplation is keeping account of one’s own self (muhasibat-i nafs). In conclusion, meditation is in accord with contemplation, and also contemplation is in accord with meditation. But meditation is more complete, more lofty and more pure than contemplation; for contemplation on the self leads one towards repentance, while meditation on God leads one towards divine union (wusul). God says, “Therefore remember me for I remember you.”\u00013\u0001 God attributes to the divine self that quality of meditative remembrance rather than the quality of intellectual contemplation."]],"advice":[]},{"title":"Morsel 4","blocks":[["p","The spiritual master Shaykh ‘Abd al-Karim al-Jili who lived in Zabid, in Yemen, says that the sign of one who has attained the practice of meditation of the heart is that he or she hears the sound of his or her meditation emanating from all things or from some things, either at certain times or at almost all times, depending upon the facility and capability of the one meditating.\u00014\u0001 He also says that the sign of one who aims to practice meditation of the spirit is that she or he hears all things glorifying God (tasbih) each in its own special way and beholds no agent other than God."],["p","Ahmad Ibn Ghilan Makki says that meditation of the heart sets right the relationship between God’s presence and humanity’s presence. He says that meditation of the spirit lets God’s presence dominate the presence of humanity. He says that meditation of the inner heart (sirr) leads to a state in which there is no presence of humanity but only God’s presence alone. Lastly, he says that meditation of the inner essence (khafi) unfolds the latency of being from within the potentiality of spirit just as the entire cosmos lies latent within the inner heart."]],"advice":[]},{"title":"Morsel 5","blocks":[["p","Meditation is remembrance as opposed to forgetfulness. So whatever makes you remember and stay connected with your object (God) counts as meditation and constitutes an act of worship (‘ibadat), regardless of whether the means of meditation be a name, ritual or action performed with the body or in the body or in abstraction from the body or in any other way. Likewise, whatever makes you forget and neglect your object (God) is misguided and vain, regardless of whether the means of forgetting be a name, person, thing or anything else. For Sufis, everything said, everything done and everything felt can be meditation, on condition that it leads them to remember God and stay awake and aware. Anything which does not promote remembering is forgetfulness and should be shunned, as conveyed in this couplet:"],["v",["If I am with you, my daily work is prayer","And without you, my prayer is merely work"]]],"advice":["Anything which does not promote remembering is forgetfulness and should be shunned, as conveyed in this couplet:"]},{"title":"Morsel 6","blocks":[["p","Spiritual masters say that meditation is of many different types. There is meditation with the tongue with words spoken out loud or recited silently. There is meditation of the heart and meditation of the inner heart. Then there is meditation of the inner essence of the heart (khafi) meditation of the most secret inner essence (akhfa) and finally meditation of the utmost secret inner essence (akhfa’-i akhfa)."],["p","As for meditation with the tongue, it is meditation involving spoken words in which there are syllables and letters, in a set order with some preceding and some following. If the sound of reciting these words is performed out loud it is called “vocal meditation” (bi’l-jahr). But if it is done silently then it is called “concealed meditation” (bi-khufiya)."],["p","As for meditation with the heart, it consists of reciting a word or retaining in the heart the presence of a word or name, with regard to its meaning and signification rather than to its letters and syllables. In fact, the presence of the word or name is invoked all at once including all its letters, syllables and sounds."],["p","As for meditation of the spirit, it consists of disregarding the word or name in order to dwell in the presence of the one denoted or named [God]. This experience varies according to the capacity of the one meditating: some realize the divine presence at some times while most times being devoid of it, while some realize it most of the time and some realize it always continuously. Yet all of them are conscious that “I am one who meditates, and that during a particular time I am meditating, and that I hold a particular object as the goal of my meditation, an object which was present before my awareness (basirat) but which is now faded.”"],["p","The furthest extreme of this kind of meditation, known as meditation of the inner heart, occurs when both the meditation and the one meditating are together effaced and nothing remains to be known or understood except the presence of the object of meditation (mazkur, meaning God). At this point, even the delight experienced in meditation is effaced, and there remains no awareness of any delight to be experienced. This can be called meditation of the inner essence of the heart. Similar to this station is meditation of the most secret inner essence and the utmost secret inner essence. Further discussion of these states of meditation mentioned here will come later."]],"advice":[]},{"title":"Morsel 7","blocks":[["p","Shaykh Sharaf al-Din Yahya Maneri says that meditation is practiced in one of four conditions.\u00015\u0001 First, it could be that the tongue is busy reciting but the heart is distracted searching in the mine of other meanings. Second, it could be that the tongue is busy reciting and the heart is accompanying it to the extent that the heart is sometimes reciting but sometimes is distracted while the tongue keeps busy. Third, it could be that there is harmony between the tongue and the heart in the recitation, but sometimes the heart and tongue together are both distracted. Fourth, it could be that the tongue gets distracted and is at rest, but the heart is engaged in reciting meditations and is fully aware. This is the furthest station of spiritual development in which one’s work is complete and meets the requirement of full presence and continual awareness. This is the real essence of meditation. Achieving it, the one meditating hears the voice of his or her own heart which nobody else can hear. This is what Shaykh Sharaf al-Din has said."]],"advice":[]},{"title":"Morsel 8","blocks":[["p","Some spiritual masters say that novices improve their spiritual condition by performing meditation, while more experienced disciples improve by reciting the Qur’an and advanced Sufis improve by making devotional prayers (nafil). But in my humble opinion, it is better for a seeker to keep doing silent meditation. In this way, the seeker can rid the mind of the imprint of anything other than God, to assert the absolute oneness of God and turn towards God seeking presence (huzur) and intimacy (uns). The seeker should seek effacement (fana’) and obliteration in the holy divine presence. Realizing the truth of God means embracing the experience of being annihilated (tams) and erased (tals). This path is the quickest way to gain closeness to God and the surest way to achieve union. I acknowledge that in the process, many types of worship might be left undone. But no fear about this need be entertained, since the benefit of loosing self-consciousness in this way will overshadow all omissions and deficiencies!"]],"advice":["The seeker should seek effacement (fana’) and obliteration in the holy divine presence."]},{"title":"Morsel 9","blocks":[["p","I will now discuss some points about the proper way to engage in meditation. As stated in the book Minhaj al-Salik ila Ashraf al-Masalik (The Spiritual Seeker’s Method to Reach the Noblest of Goals), there are twenty rules that guide one in meditation. Some of these rules apply to before meditating, some apply to during meditation and some apply to after meditation."],["p","In preparing for meditation, there are five rules to follow. One must first make repentance for any wrongdoing (tawba). One must be in a condition of tranquility and in a state of cleanliness as if making ablution for prayer. One must concentrate on one’s spiritual master for help (istimdad), and one must have firm knowledge (‘ilm) that asking for help from one’s spiritual teacher is in reality asking for help from the Prophet himself, may peace be upon him, that is help from God the almighty."],["p","During meditation, there are twelve rules that apply to the process. One should sit cross-legged or kneeling as in prayer (salat). One should place both hands on the knees. One should purify the atmosphere with fragrance or incense. One should wear only clean clothes. One should keep the room dark. One should keep one’s eyes closed and keep the openings to one’s ears stopped up. One should mentally picture the face or form of one’s own spiritual master, for this is the most important rule of all. In addition, one should be absolutely truthful (sidq) and sincere (ikhlas), both inwardly and outwardly; in this context truthfulness means not exaggerating the extent of one’s own effort and sincerity means not performing with hypocrisy so that others see you and hear you. One should chose words that express God’s unique oneness, specifically, the saying la ilaha illa ‘llah or “No God but God” for reciting in meditation. Finally, when reciting this saying, one must feel at all times the meaning of words in order to negate every vain imagined thing from the open expanse of divine presence and to concentrate on the only really existing thing (God). It is my humble opinion that this last rule is absolutely necessary and of vital importance if meditation is to be effective."],["p","After meditation is completed, there are three rules to follow. One should maintain silence for some time after meditation. One should practice suspending the breath (as discussed in detail in Morsel 12). One should avoid the use of cold things like water or exposure to cool air, for these might dissipate the heat in the heart that is built up by meditation."],["p","This is the guidance written in the book Minhaj al-Salik. The book further announces some benefits of meditation. Meditating by repeating the phrase la ilaha illa ‘llah (kalima-i tawhid), generates intimacy with the God’s holy presence.\u00016\u0001 Anyone who does extensive amounts of meditation but does not feel an expanded intimacy with God is doing it in vain; perhaps such a person has become slack in certain rules and must start afresh. Shaykh Ibn ‘Ata’ullah al-Shadhili has written that when a person recites la ilaha illa ‘llah the throne of God begins to vibrate, for the very source of these words is the realm of divine might (jabarut), so that the person who recites them is no longer related to the material world (mulk) and the realities of this world, but rather is drawn upward rising towards the realm of the spiritual world (malakut).\u00017\u0001"],["p","There are many other benefits to reciting this in meditation. If one repeats it a thousand times every morning after ablutions, one will be able to easily secure the means of sustenance, and I feel that the word sustenance (rizq) is used in a general sense encompassing both livelihood of body and vitality of spirit. If one recites it a thousand times before retiring to bed, one’s spirit will rest below the divine throne during the night and grow in strength. If one recites it a thousand times at noon, the force of temptation (shaytan) that is within will be broken. If one recites it a thousand times near the advent of the new moon, God will protect one from every kind of illness. If one recites it a thousand times on entering a town or leaving it, God will protect one from dangers and things which make one fear and grieve. If one recites it a thousand times with one’s full presence and firm concentration and then sends it against an adversary who is oppressive and overweening, the adversary will be defused and negated. If one recites it a thousand times with the intention to gain spiritual disclosure of unseen things (kashf-i ghuyub), all secrets of the material and spiritual worlds will be revealed. Anyone who repeats it seventy-thousand times, will be ushered by God into paradise."]],"advice":["One must first make repentance for any wrongdoing (tawba).","One must be in a condition of tranquility and in a state of cleanliness as if making ablution for prayer.","One must concentrate on one’s spiritual master for help (istimdad), and one must have firm knowledge (‘ilm) that asking for help from one’s spiritual teacher is in reality asking for help from the Prophet himself, may peace be upon him, that is help from God the almighty.","One should sit cross-legged or kneeling as in prayer (salat).","One should place both hands on the knees.","One should purify the atmosphere with fragrance or incense."]},{"title":"Morsel 10","blocks":[["p","Some masters of spiritual knowledge say that meditation of the tongue leads one to the further stage of meditation of the heart. Without a doubt, when the tongue and the heart operate in union the meditation will be arranged to perfection. This arrangement is generally acknowledged by all the Sufi orders. The exception to this is the Naqshbandi order, which teaches that meditation of the heart suffices if it is coupled with internal longing (jazb-i batin). This is the practice they proscribe for beginners in the Naqshbandi order, conveying their teaching in this couplet:"],["v",["We begin at the ending place to which others aspire","Where we end is the place that can fulfill any desire"]],["p","That is their teaching, but it is clear that what is attained by experienced practitioners of all other orders is not attained by beginning practitioners of the Naqshbandi order. It is merely that giving priority to meditation of the heart is the practice advocated by the Naqshbandi order. There will surely be a big difference between the effect of beginner practicing meditation of the heart with inner longing (zikr-i qalb-i majzub) in the Naqshbandi order and the effect of an experienced member of other orders practicing meditation of the heart with inner longing!"]],"advice":[]},{"title":"Morsel 11","blocks":[["p","Some Muslim jurists reject meditation of the heart and limit the legality of meditation only to that of the tongue. This is merely a contention of their conceit. Don’t they realize that meditation is remembrance and thus includes anything that is opposed to forgetfulness, which is essentially an attribute of the heart. Oh dear, don’t they see that each individual has particular rules that are arranged in a way suitable to his or her own special needs?"]],"advice":["Don’t they realize that meditation is remembrance and thus includes anything that is opposed to forgetfulness, which is essentially an attribute of the heart.","Oh dear, don’t they see that each individual has particular rules that are arranged in a way suitable to his or her own special needs?"]},{"title":"Morsel 12","blocks":[["p","When practiced during meditation, suspension of breath (habs-i nafas) is considered by some to be a powerful means to eradicate stray thoughts and mental wandering. Some even consider it to be the essential means. In many Sufi orders like the Chishti, Kubrawi, Shattari and Qadiri orders, it is practiced as the primary basis of meditation. In contrast, the Naqshbandi order does not require it yet does not deny its worth. Teachers of the Suhrawardi order, on the other hand, require their followers to avoid the suspension of breath; this is the point of view of Shaykh Baha’ al-Din ‘Umar and Zain al-Din al-Khawafi who are both renowned leaders of the Suhrawardi order, may they both be blessed.\u00018\u0001 I humbly submit that there are in fact two different ways of treating the breath in meditation. One is suspension of breath and the other is restraining of breath (hasr-i nafas)."],["p","Suspension of breath can be done in two ways, with emptying and with filling. Suspending the breath with emptying (takhliya) is a technique of drawing up the breath from the abdomen while pulling the navel and the area around it back towards the spine and then suspending the breath in the chest or, according to some, to the seat of the mind (dimagh). While doing this, there is no need to close the nostrils, ears and eyes with the fingers, although some do this as a precautionary measure. Stopping up the nostrils, ears and eyes was a measure that originated when this practice was done while in the midst of a reservoir and submerged under water. This practice was taught to ‘Abd al-Khaliq Ghujdawani by Khizr, and it considered extremely effective.\u00019\u0001 It generates an enormous amount of internal heat in the body. Sufi masters have adopted this method of suspending the breath and other methods of breath control from the Yogis and their followers, who are the perfect exponents of this craft.\u000110\u0001"],["p","The second way of suspending the breath during meditation is with filling (tamliya). This means drawing the breath into the belly and suspending it there while making the belly swell full. By means of swelling the abdomen like this, the navel is pushed out as far away from the spine as possible. This way of breathing aids digestion of food exceedingly well."],["p","In contrast, restraining the breath refers to taking breaths smaller than normal. It is done by cutting down the size of breath on both sides (while inhaling and also exhaling). One simply takes breaths of smaller than normal amounts. Without a doubt is generates an internal heat in the heart, yet less intense than the heat generated by suspending the breath."],["p","The description of heat and cool above refer to the quality of the breath (once it enters the body through the bloodstream) that is called “circulating.” But in addition, there is th
