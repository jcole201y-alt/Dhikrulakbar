 gives it the implied meaning of “God is.”","Shaykh Nasir al-Din Chiragh-i Delhi, “The Lamp of Delhi,” was the chief disciple and successor to Shaykh Nizam al-Din Awliya in the Chishti Sufi order. He died in 1356. One of his chief disciples was Gisu Daraz,”He with Long Locks,” whose proper name was Sayyid Muhammad al-Husayni. He died in 1422 and is often seen as the patron saint of the Deccan region of South India, where he settled after leaving Delhi. See Syed Shah Khusro Hussaini, Sayyid Muhammad al-Husayni-i Gisudiraz on Sufism (Delhi: Idarah-i Adabiyat-i Delli, 1983).","Ibn ‵Arabi was a Sufi master who unified mysticism with philosophy in a highly influential way. He was born in Andalusia, lived in North Africa and died in Damascus in 1240 CE; see Stephen Hirtenstein, The Unlimited Mercifier: the spiritual life and thought of Ibn ‵Arabi (Oxford: Anqa Publishing, 1999).","Surat al-Shura 42:11.","This phrase quotes Qur’an 2:115: “To God is the east and the west. Wherever you may turn there is the face of God.”","This final phrase is taken from Surat al-Baqara 2:115.","This refers to Shaykh Farid al-Din Mas‵ud who was nick-named Ganj-i Shakar or “Treasury of Sugar.” He was the spiritual guide of Shaykh Nizam al-Din Awliya in the Chishti Sufi Order. Shaykh Farid al-Din lived in Punjab and died at Ajodhan (known as Pakpattan, in Pakistan) in 1265 CE; see K.A. Nizam, The Life and Times of Shaikh Farid-u’d-Din Ganj-i-Shakar (Delhi: Idarah-i Adabiyat-i Delli, 1955).","In Arabic this prayer read: “Allahumma innaka qulta fa-zkuruni azkurakum wa qad zakartuka ‵ala qadri qillati ‵ilmi wa ‵aqli wa fahmi. fa-zkurni ‵ala qadri sa‵ati nafsika wa fadlika wa ‵ilmika wa maghfiratika. Allahummma iftah masami‵a qulubina bi-zikrika, ya khaira ‘l-zakirin.”","The primal attributes of the divine are life (hayat), knowledge (‘ilm), power (qudra), will (irada), hearing (sam‘), sight (basar), and speech (kalam), as mentioned above in Chapter 1, Morsel 2.","In Arabic this prayer reads: “Astaghfiru ‘llaha min jami‵i ma kariha ‘llahu qawlan wa fi‵lan wa hadiran wa gha’iban wa sami‵an wa naziran, wa la hawla wa la quwwata illa bi-llahi ‘l-‵aliyi ‘l-‵azimi.”","Abu Madyan Shu’ayb ibn al-Hussain al-Ansari was born near Seville and died in Tlemcen, Algeria, in 1198. He is considered to be a pioneer Sufi Shaykh of Western Islamic lands (maghrib, meaning Andalusia and North Africa). For his life, teachings and poems, see Vincent Cornell, The Way of Abu Madyan (Cambridge: Islamic Texts Society, 1996).","To explain this point further, the editor of Shaykh Kalimullah’s text writes: “It is said that God sometimes appears in the form of a human being, but foolish and ignorant this. This is proved by the verse of Qur’an that says, ‘God makes the truth true and people denounce makes un-truth false even if those who denounce detest it’” (Surat al-Anfal 8:8). Shaykh Mu’ayyid al-Din al-Jandi was a Sufi in Ibn Arabi’s school of thought, which some authors call “theosophical Sufism.” He was a disciple of Sadr al-Din Qunawi, the step-son of Ibn Arabi and his most authoritative interpreter. Al-Jandi wrote a commentary on Ibn Arabi’s famous text, Fusus al-Hikam; see William Chittick and Peter Lamborn Wilson (trans. and ed.), Fakhruddin ‵Iraqi—Divine Flashes (Mahwah, NJ: Paulist Press, 1982), xvi, 44 and 65.","Ibrahim ibn Adham was an important early Sufi master who died in 777 AH in Syria. According to his legend, he was a ruler in Balkh (present day Afghanistan) who abdicated his position in order to become an ascetic and mystic. The Chishti Sufi Order traces its lineage back through him to early Sufi masters and then to Imam Ali and the Prophet Muhammad.","These two terms are discussed in greater detail in reference to the Treatise on the Human Body below.","This refers most likely to Shaykh Baha al-Din Ibrahim Shattari of Burhanpur, who was also member of the Qadiri Order, as he is named here. In Burhanpur and the Deccan, most Shattari Sufis also held allegiance to the Qadiri Sufi Order, and gradually the two became thoroughly fused. Shaykh Baha al-Din and other Shattari Sufis were very active in integrating Sufi meditation techniques with Yoga; in his only known writing, he explained, “Another way of meditation in the Hindawi language is to sit cross-legged, just as the Yogis do. Raise your eyes and face to the heavens. Pronounce the following words of meditation one thousand times or more, and it will let you achieve in the end the realm of spiritual flight;” from Baha’ al-Din Shattari Burhanpuri, Risala Shattariyya (manuscript at Hyderabad: Andhra Pradesh State Oriental Manuscript Library, 745 Farsi Tasawwuf), 46.","This reference is to the practice of “Meditation of the Three Supports” as described above in Chapter 1, Morsel 7.","The text reads “Sultan-Jiu Nizam al-Din” and here refers to Nizam al-Din Awliya by his honorific title, “Sultan-i Awliya” or Chief of the Saints. Nizam al-Din was the spiritual guide of Shaykh Nasir al-Din, who was in turn the spiritual guide of Muhammad Hussaini Gisu Daraz, referred to next.","Surat al-Isra 17:81.","Bayazid Bistami was an early Sufi master from Iran who died in 874 CE, who championed the superiority of mystical intoxication over rational sobriety; see Schimmel, Mystical Dimensions of Islam, 47-51.","Surat Yusuf 12:87.","Beck, Sonic Theology, 206 writes that “The identification of absolute and unqualified being with both God and with the sound-vibration is common to Hindu speculation and Sufi thought in India. In a way, it requires the use of language-as-sound to transcend language itself, as a network of symbols that structures cognition and roots self-identification. This explains the use of language-as-sound (rather than language-as-speech) in mysticism as a vehicle of meditation.”","The text describes Muslim holy men as sahib-i karamat or those who perform miracles by God’s grace. It describes powerful ascetics of others religions (namely Hindu Yogis) as sahib-i istidraj or those who perform wonders by their own penitence or sorcery. But the sense of the text is that both Muslim and Hindu holy men do this practice.","Surat al-Shura 42:11 which says Laysa ka-mithli-hi shay wa huwa ‘l-sami‵ al-basir.","This proverb in Arabic is: “Hasanat al-abrar sayi’at al-muqaribin.”","This proverb in Persian reads: “Dast bi-kar o dil bi-yar.”","Shaykh Kalimullah here refers to his book in Arabic entitled Those Ten Complete Days (Tilka ‵Ashira Kamila). He wrote this little book by collecting the sayings of previous Sufi masters on essential spiritual topics, one for each day of the last ten days of Ramadan, the month of fasting. It is a custom to spend these ten days alone in isolated prayer, and Kalimullah did this in October 1681 CE (Ramadan 1092 AH), and during those ten complete days he wrote this book for his own benefit and that of others.","In Arabic, these sayings are: Ma ra’aytu shay’an illa wa-ra’aytu ‘llaha qabla-hu. Ma ra’aytu shav’an illa wa-ra’aytu ‘llaha fi-hi. Ma ra’aytu shay’an illa wa-ra’aytu ‘llaha ba‵da-hu. These sayings are frequently quoted by lbn ‵Arabi, for example in al-Futuhat al-Makkiya, Vol. 2 in chapter 126 entitled “mar‵ifat maqam al-muraqaba.“","In Arabic, this saying is: “ma minna illa wa la-hu maqam ma‵lum.“","This is a hadith qudsi, a report from Muhammad which relates the saying of God. In Arabic, the saying is: “Awliya’i tahta qaba’i la ya‘rifuhum ghayri.” See Schimmel, Mystical Dimensions of Islam, 203.","Surat al-Furqan 25:7.","Surat al-Nur 24:37.","Surat al-Kahf 18:109.","About these obstacles, Shaykh Kalimullah has written another small book in Arabic entitled Essentials of Kalimullah (Ma La Budda Kalimi) in which he details ten such spiritual obstacles, which he completed in 1662-3 CE (1073 AH).","Surat al-A‵raf 7:89. This prayer recalls the words of the Prophet Shu‵ayb as cited in the Qur’an.","Shaykh Nizam al-Din Narnauli was a master who died in 1589 at Narnaul (a town in Haryana in North India). He was a disciple of Khwaja Qanun, a famous Chishti Sufi of Gwalior during the early Mughal period. The Mughal Emperor Akbar visited Nizam al-Din Narnauli, as narrated by the historian Nizam al-Din Ahmad in Tarikh-i Alfi; see Henry Elliot, The History of India as Told by its Own Historians, vol. 7 page 407. Narnaul is also the location of the dargah of Shaykh Muhammad Turkman Narnauli who was a disciple of Shaykh Usman Harwani, the spiritual guide of Mu‵in al-Din Chishti.","Panwar in Hindi is the name of a shrub that grows in Northern India with the scientific name Cassia Tora, commonly called “Sickle Senna” or “Wild Senna” or “Coffee Pod Tree” that is used in Ayurvedic medicine and is sometimes used as a stimulant and coffee substitute.","Abu’l-Qasim al-Qushayri was an early Sufi master and hadith scholar who lived in Nishapur and died in 1074. He wrote one of the most influential treatises on Sufi practice (al-risala al-qushayriyya fi’l-tasawwuf). See Michael Sells (trans. and ed.), Early Islamic Mysticism (Mahwah, NJ: Paulist Press, 1996; The Classics of Western Spirituality Series Number 86), 112."]};
const DARA={"sections": [{"id": "dtn", "title": "Translator's Notes", "sub": "by Scott Kugle", "items": [{"title": "Translator's Notes", "blocks": [["p", "This is one of several compositions about Sufism by the Mughal prince, Dara Shikoh. His other texts are about the lives of eminent Sufis of the past or about the complementarity of Hinduism and Islam, as seen through the lens of Sufism. In reality, this text represents his most intense engagement with Sufism. It describers both his concrete experience with meditation practices and the cosmological framework in which those meditation practices gain urgency and efficacy."], ["p", "Dara Shikoh had in his personality a tendency towards mysticism, and his Mughal environment reinforced this for it was founded on the ideal that Sufi guides of the past ensured the prosperity and success of his political rule. Earlier Mughal emperors had taken Shattari Sufis as their guides or patronized Chishti masters of the past. But Dara Shikoh, in his earnest zeal for mystical experience, found a spiritual guide in the Qadiri order, in the person of Mulla Shah. This treatise represents a true account of Dara Shikoh’s training under Mulla Shah, and offers the reader intimate advice on how to meditate according to the Qadiri order’s teachings in South Asia."], ["p", "Dara Shikoh wrote this text in 1645 CE (1055 AH). Dara Shikoh was an ardent Qadiri Sufi. He wrote this text after having heard a voice of inspiration tell him that “the best possible way of reaching God was the Qadiri Sufi order.” But his training in meditation techniques has much in common with the Chishti Sufi order. Part of the value of this treatise is that it demonstrates the common basis of meditation techniques in both the Qadiri and Chishti Sufi orders. In the earliest printing of Kashkul in the lithograph edition used to render the translation in English offered above, the editor includes a note at the end giving a quote from The Compass of Truth. So the editor saw both of these as texts that were linked in their content."], ["p", "This translation was rendered from a fine lithograph print. That print was published in October 1896 by Munshi Nawal Kishore Press in Lucknow, under the auspices of the Press’ owner, Munshi Parag Narayan. It contains some useful marginal notes that were added by an editor to clarify certain ambiguities— especially in Arabic words or phrases that Indian readers of the Persian text might not immediately grasp."], ["p", "In preparing this translation, I consulted an earlier English translation by Rai Bahadur Srisa Chandra Vasu made at the turn of the 20th century by a Bengali gentleman and lawyer (at the Northwest Province High Court) who appears to have been active in the Theosophical Movement. However, in referring back to the original Persian, I was dissatisfied with Vasu’s earlier English translation, and ended up translating the text anew, adopting what was apt from the earlier translation but modifying it where improvements were needed. Improvements were necessary in the following cases: the original translation was not accurate, or was too abridged, or translated technical terms in a way inconsistent with other Sufi texts that use the same terms, or used a Victorian style of English that sounds outdated and precious to modern readers."], ["p", "At the turn of the 20th century, it appears that Vasu was very active in translating mystical texts into English. He published an English translation of the Shiva Samhita, a Sanskrit text on Hatha Yoga; he published this translation as The Esoteric Philosophy of the Tantra Shiva Sanhita in 1887 in Calcutta, and dedicated the text to Henry Steel Olcott, an American Colonel and early Buddhist convert who was the cofounder of the Theosophical Movement with Madame Helena Blavatsky in 1875. On moving to India, Olcott and other Theosophical Society members sponsored a major drive to translate into English texts on “Eastern Spirituality,” texts coming mainly from the Buddhist, Hindu, and Zoroastrian traditions; it appears that Srisa Chandra Vasu was one of the translators active during that optimistic age. These translations undoubtedly had a great effect on both Orientalist scholars and spiritual practitioners over the course of the 20th century, but as translations they are not totally firm and reliable. Vasu’s translation of the Shiva Samhita, for instance, has been critiqued and laid aside by the contemporary scholar James Mallinson, as he prepared a new critical edition and translation of that text.¹"], ["p", "As time moves on, scholarly knowledge grows and communication styles evolve, and so it is no insult to an intrepid translator from the past for a contemporary writer to re-translate a text. I appreciate the effort that Srisa Chandra Vasu put into translating The Compass of Truth, yet I did not rely upon his translation but rather went back to the Persian original in order to create a new translation that will be useful for modern readers. But for clarity, I should alert readers to just how this new translation differs from that done a century earlier. Here is an example of how my translation differs from the earlier English translation. Vasu wrote: “O friend! When thou shall begin to hear this voice, thou must attend to it very carefully and try to keep it with all thy might, so thou mayest be expert in hearing it; and may hear it not only in the solitude of the desert and the cloister, but in the bustle and noise of the market place, and meeting houses of mankind.” I translated the same passage: “When this sound manifests to your hearing, my friend, you must observe it keenly. You must try your hardest to preserve your ability to listen for it, until you can master it so that, just as you heard it in the silence of the wilderness or a closed room, you will also hear it in the noisy marketplace amid throngs of people.”"], ["p", "I endeavored to use simpler language in a style that would be more immediately accessible to a contemporary reader. In addition, I was able to present how the text uses Arabic from the Qur’an, hadith reports, and other spiritual sources that Vasu did not fully grasp. Finally, I paid greater attention to systematically translating technical terms from the Sufi tradition into English, in a way that highlights the continuity between Dara Shikoh’s text and others in the Sufi tradition. In contrast, Vasu had sometimes offered rather eccentric translations of technical terms based upon his prior philosophical commitments and the Theosophical Movement’s eager universalism. With this caveat, I present to you The Compass of Truth by Dara Shikoh."], ["p", "¹ James Mallinson, The Shiva Samhita (Woodstock, NY: YogaVidya, 2007). On page xi, Mallinson acknowledges that Vasu’s earlier translation was successful in securing the text a respected place among modern Yoga practitioners, but notes that the translation was in places inaccurate and abridged."]]}]}, {"id": "dopen", "title": "Opening", "sub": "Invocation, the two ways to God, and why the book was written", "items": [{"title": "Opening", "blocks": [["p", "In the name of God, the compassionate and merciful."], ["p", "God is the first and the last, the manifest and the hidden.\u00011\u0001 Praise be to that divine essence who is the absolute existence (mawjud-i mutlaq). Reverence be to that prophet, to whom is revealed every thing and who is the vicegerent of the true One (khalifa-i haqq). Let profuse mercy shower on him, his descendants and his companions."], ["p", "It is best that I not attempt to exhaustively do justice to their praise and reverence, so let me cut short this attempt, because whatever may be written on this point is bound to fall short of the truth. For the opinion of the sages (arbab-i ‵irfan) is that “No praise for you is sufficient, for you are as you have praised yourself!”\u00012\u0001"], ["p", "So we turn to the point of this treatise. O friend, the reason why the human essence (haqiqat-i insani) has descended into this bodily frame (haikal-i jismani) is so the trust that was hidden as potential in it may become explicit and complete, so that it may return to its original source."], ["p", "It is the duty of all human beings to struggle to save themselves from eternal loss, free themselves from the delusion of individual existence (wahm-i ta ‵ayyunat), and return to their true source. They should not waste this life, which lies as a flickering moment of time between the two eternities of past and future, in useless thoughts, words, and deeds. They must each save themselves from everlasting remorse and regret, and free themselves from eternal loss and ruin. They must strive to not be among those whom the Qur’an describes as “like dumb cattle—no, even more lost.”\u00013\u0001 Indeed, they must not let go to waste that special and noble gift bestowed upon the human being in distinction from the rest of creation. That is the gift of reason and discrimination, for God says, “Surely we gave human beings a special endowment.”\u00014\u0001 For God created the whole world for the sake of humanity, and created humanity especially for the sake of God. So each person must find a spiritual guide (sahib-dil) through whom to find release from the pain of loss and the pangs of separation, for one cannot find God without a dependable guide who has given up all else. Whoever has not given up the world (faqr) has not found God. And whoever has found God has given up the world. Though one might strive and struggle, this ultimate goal is one that is given undeserved rather than one that is earned and achieved."], ["v", ["Union can never be achieved by striving, that is right", "Keep trying, O my heart, and strive with all your might", "Gar-che visal-ash na bi-koshish dahand", "An qadar ai dil keh tavani bi-kosh"]], ["p", "There are two ways that one can reach presence of the holy One. The first is by bounty given undeserved (fazl). This means that God leads one to a spiritual guide who, with one glance and concentration, makes his spiritual condition complete. He raises the veil from his sight and wakes him up from the daze of negligence and opinion. He shows him the beauty of the divine beloved without any strain or struggle or difficulty. He releases him from the bonds of his ego and lets him rise to the exalted level of “by me, he hears, and through me, he sees.”\u00015\u0001 As it says in the Qur’an, “This is the bounty of God who bestows it on those whom God wills, for God is the One with great bounty.”\u00016\u0001"], ["p", "The second way to reach God is through struggle (mujahadat) and exertion (riyazat). It happens in this way, that a man hears from others or reads in the sayings of previous times that certain persons have reached to God, and have known the true One with deep intuitive knowledge (ma‵rifat) and have set off to reach union with that divine presence. This sparks in his mind a desire to reach the same lofty position. When this idea takes a strong hold on his heart, he begins to seek and search and engage in struggle and exertion by himself, till he finds a spiritual guide who can inform him about the path by which prior seekers of union have gone. Then he puts all his effort and struggle into following that path. And with all this, after countless labors and trials he might, if God grants divine bounty, he might catch sight of his goal and, by the blessing of those who have gone before him, his desire might be fulfilled."], ["p", "The humble beggar at the court of the eternal One, named Muhammad Dara Shikoh who follows Hanafi law and the Qadiri Sufi order, belongs to that group of devotees who are attracted to God spontaneously without struggle or austerities. Through the glance of a spiritual guide, God has drawn him towards the divine and, by ceaseless grace, has shown him to the furthest goal. He has come to know all the levels of spiritual knowledge of divine unity in its subtleties and details. He has spent time in the company of most of the saints of his age. He has especially followed one of them who was exemplary in his era. He has stayed close to the blessed breaths of this spiritual guide, until he came to know through experience the desired goal shared by all the prophets and saints."], ["p", "Then it was desirable to write an account of those dear saints in a book. So on a Friday, the 9th of September in the year 1645 (17 Rajab, 1055 AH), he heard a voice of inspiration which told him that the best possible way of reaching God was the Qadiri Sufi order. This order traces its origin back to the blessed Prophet and leader of humanity, Muhammad, of whom God said, “If not for you I would not have created the cosmos.”\u00017\u0001"], ["p", "It traces its origin back to him through the great leader of the sages, that sea of mystical knowledge and guide to God’s people, Shaykh Muhyi al-Din ‵Abd al-Qadir Jilani, who once said, “This foot of mine is upon the neck of each of the saints,” and who is descended from Muhammad on both his father’s side (Hasani) and his mother’s side (Hussaini).\u00018\u0001 From him its teachings came through a succession of inspired guides to Shaykh Muhiy al-Din the Second.\u00019\u0001 From him initiation came directly to Maulana Shah, the greatest sage of his era and from him it came me who writes these lines.\u000110\u0001"], ["p", "In that night of inspiration, I was also commanded to write this treatise to show plainly the way to reach God for those who search for guidance towards the truth. To distinguish it from the other books of this type, I consulted the Majestic Qur’an in order to give it a proper title according to divine inspiration. So I have named it The Compass of Truth (Risala-i Haqq-Numa). This is because when I consulted the Qur’an, I read this verse: “After we had destroyed the old generation, we gave the message to Moses that might be a guide and mercy for the people, that they might remember the truth.”\u000111\u0001 This verse is perfectly suitable to express the meaning of this book, so it is called The Compass of Truth."], ["v", ["If you desire union, so your heart is a garden in flower", "You must dedicate yourself to searching for your lover", "Take this as your guide, like a compass pointing out Mecca", "To show you God, only divine light itself has the power!", "Khwahi keh dil-at ze wasl gardad gulshan", "Khud ra tu bi-just-o-ju-yi dil-bar afgan", "An qibla numa chu qibla mi-yaband", "Daryab ze haqq numa-yi haqq ra roshan"]], ["p", "So let those read this book who have not been ennobled by keeping the company of a perfect spiritual guide or have never met a perfect guide. Let them study it deeply and carefully, and put into practice its advice point by point. If they do so, there is hope that they might reach the goal and achieve an understanding of pure divine unity (mashrab-i safi-yi tawhid), for the furthest perfection of humanity lies in this mystical knowledge (‵irfan). In these pages, they can find the inner meaning of all the books written by early and later mystics, which are too voluminous for them to read. By this, they might understand the essential meaning of all the great Sufi books such as al-Futuhat al-Makkiya and Fusus al-Hikam by Ibn ‵Arabi, and commentaries on them like Sawanih (Inspirations from the World of Pure Spirits) by Ahmad Ghazali, Lawa’ih (Divine Gleams) by Mawlana Jami and Lama‵at (Divine Flashes) by Fakhr al-Din ‵Iraqi.\u000112\u0001"], ["v", ["If for you the inner essence of the law is abstruse", "To really criticize Sufi texts you’re far too obtuse", "Recognize one and no other in this world and the next", "This is the truth taught in the Futuhat and the Fusus", "Tu batin-i shar‵ gar na-dani bi-khusus", "Darhum na-kuni nazar tu bar naqd-i nusus", "Yek dan o ma-dan tu ghayr-i u dar do jahan", "In ast haqiqat-i Futuhat o Fusus"]], ["p", "All that is written in this book records exactly the methods of behaving and meditating, sitting and standing, exercising and practicing that were laid down by the Prophet Muhammad, may God bless him and his family. It contains not the slightest deviation from his example."], ["p", "If a person who has reached God should happen to read this book, he will recognize how well I have shown the way to the divine threshold, and how wide I have opened the doors of renunciation and wisdom, so that worldly people may know plainly that the bounty of God has no fault or flaw. God draws anyone whom God wills towards the divine in whatever condition they may be! This is a fortune that not everyone can get. Rather, I have been specifically chosen for this good fortune."], ["p", "In the days of my youth, I heard in a dream that a divine voice proclaimed four times, “God has provided you with that which no ruler on the face of the earth ever got!” On awaking, I interpreted this to mean that I shall receive mystical knowledge (‵irfan), and I always expected the day when this illumination would come to me. In time, its effects began to show, and day by day the results of it became clearer. In those days, I was wracked by the pain of searching, but I had full faith in this community of Sufis. In those days, I wrote a book about the lives of the spiritual guides who belonged to this community in the past; in it I recorded their spiritual states and mystical stations, the dates of birth, the length of their lives, and the places of their burial, and I titled that book Ship of the Saints (Safinat al-Awliya). After that I was ennobled by having taken initiation, engaged in mystical practices and became knowledgeable about the stations of the Sufi way; at that time I composed a second book on the signs, behavior, stations and the miracles of my own spiritual guides, entitled Deliverance of the Saints (Sakinat al-Awliya)."], ["p", "It was at this time that God opened for my heart the doors of mystical knowledge and unity (tawhid), and bestowed upon me special disclosures of divine presence (futuhat) and outpourings of grace (fayuzat). Whatever has been written in this book has the quality that the Qur’an explains: “in it there is divine mercy and a reminder for those who believe.”\u000113\u0001 In the way of the Qadiri order, the way explained in this book, there is no hardship or difficulty, contrary to the practices laid down in other orders."], ["v", ["I see in it no exertion–it is grace given free as a breeze", "Kindness and love here is all, here all is pleasure and ease", "Riyazat nist pesh-i ma hameh luft ast o bakhsha’ish", "Hameh mahr ast o dildari hameh ‵aysh ast o asa’ish"]], ["p", "Your spiritual guide ought to be such that he leads you to God without difficult practices and hardships, rather than one who causes you much pain and trouble in order to reach God. As Ibn ‵Ata said, “Your guide is one who shows you the way to your tranquility not one who leads you to your difficulty.”\u000114\u0001 Likewise, Mawlana Rumi says:"], ["v", ["You were brought along this path to be welcomed", "You were not brought here merely to be punished", "Ze chandin rah bi-mahmaniyat avurad", "Na-avurad-at bara-yi intiqam-i u"]], ["p", "O my friend, listen well! In the path of the Sufis, initiates do not call each other “disciple” but rather they call each other “friend” (yar). Even the blessed Prophet used to call his followers “friends” and “companions” (ashab)—among them the words “master” (pir) and “disciple” (murid) were not used. Therefore, whenever this book mentions the word “friend” you should understand it to mean a seeker of God (talib). Know that this book consists of four chapters and in each chapter describes one of the four worlds (‵alam) or planes of existence."]]}]}, {"id": "d1", "title": "Chapter One", "sub": "On the Phenomenal World (‘alam-i nasut)", "items": [{"title": "Chapter One: On the Phenomenal World (‘alam-i nasut)", "blocks": [["p", "By the term “phenomenal world” (‵alam-i nasut), we mean this world that is perceived through sensory experience. Some call it the visible world (shahadat) or simply the created world (mulk); others call it the world of waking consciousness (bi-dar) or the world-as-believed (pindar). It is in this world that ultimate being is most present, and in which delight and enjoyment is most perfect."], ["p", "My friend, when the troubled soul searches for the true One in this phenomenal world, the first thing that he should do is to find some solitary quiet corner and sit there alone in meditation. He should hold in mind the image of the spiritual guide in whom he believes or the image of someone whom he loves deeply. He should imagine this person by closing the eyes and focusing concentration of the heart so that with the vision of the heart he sees the image of the guide or beloved."], ["p", "My friend, in the opinion of this humble seeker, the heart can be said to exist in three places. The first place is within the chest towards the left side, and it is the physical organ of the heart, of flesh shaped like a pine-cone shaped (dil-i sanubari). This physical heart is possessed by all men as well as animals."], ["v", ["The flesh that is shaped like the human heart", "Ask your butcher! Of every animal it is a part", "an-che bi-surat dil-i insan bud", "bar dar-i qassab farawan bud"]], ["p", "This is true, but this is not what those who have mystical knowledge mean when they refer to the heart."], ["p", "The second place wherein the heart is said to reside is the source of the mind (umm al-dimagh). It is called the spherical heart (dil-i mudawwar) and is sometimes called the heart that is pure of all qualities (be-rang). It has the special quality that when the seeker concentrates upon this spherical heart, no stray thought or temptation affects him, because no negative thought (khatra) can reach that place. The third place is in the very center of the seat of the body (nishast-gah), and this is called the lotus heart (dil-i nilofari).\u000115\u0001"], ["p", "Now when one meditates as mentioned above, one concentrates at the place of the physical heart. The images that appear to the vision of one’s heart constitute the imaginative world (‵alam-i-misal). This imaginative world of thought-forms is the means to open into the spiritual world (‵alam-i malakut). To make this opening clear, it is described as different from the spiritual world and is called the imaginative world; but in reality the imaginative world is part and parcel of the spiritual world."], ["p", "My friend, when you devote yourself to holding in mind the image (of your spiritual guide or beloved) in the way described above, you will find that gradually the imagined form will increasingly correspond with that of which it is an image. As this correspondence increases, it will become an effective means of opening the spiritual world (‵alam-i malakut). As the image becomes clear and definitive in your mind, then you will be blessed with an opening of the imaginative world. As you remain intensely engaged in this exercise, you will witness things that would otherwise be hidden from your perception."]]}]}, {"id": "d2", "title": "Chapter Two", "sub": "On the Spiritual World (‘alam-i malakut)", "items": [{"title": "Chapter Two: On the Spiritual World (‘alam-i malakut)", "blocks": [["p", "This is the spiritual world (‵alam-i malakut) which is also called the world of spirits (arwah) or of the unseen (ghayb); some also call it the subtle world (latif) or the world of dreaming (khwab). The phenomenal world is ephemeral, but this world, the spiritual world, which is the source of the phenomenal world, is in no way ephemeral but rather subsists eternally."], ["v", ["What is sleeping? just a light death", "What is dying? merely a heavy sleep", "Mi-dani khwab che-st? margi-st sabuk", "Mi-dani marg che-st? khwabi-st giran"]], ["p", "My friend, the imaginative world—as described in the preceding section—is the key to opening the spiritual world. When, after closing one’s eyes, one sees in the imagination forms in one’s vision, they should be understood as images intended for the spirit not for the body."], ["p", "It is clear that a person’s spirit (ruh) that appears in human form in the phenomenal world actually exists beyond the bodily form; its presence can be called into one’s vision at any time. Everyone who sleeps and dreams—whether consciously or unaware—thereby circulates in the spiritual world. This happens by means of the spirit taking up a subtle body of utmost subtlety (jasadi latif-i latafat) that is the exact counterpart of the physical body, with eyes, ears, tongue and all the senses and powers of the body, but without external physical organs of flesh and blood. Through this subtle body the spirit is present in the spiritual world."], ["p", "While roaming through the spiritual world, those whose hearts are refined and aware see beautiful and subtle forms, hear exquisite voices and partake of delight. But those whose hearts are burdened with materiality and distraction see ugly forms and hear horrifying sounds during these wanderings. Such people do not encounter anything but what exists in the phenomenal world and they feel no pleasure and delight in these wanderings."], ["p", "Therefore my friend, if you practice with diligence and perseverance the methods of meditation described below, the rust of your heart will be removed and the mirror of your heart will become clear and bright. Then reflected in your heart you will be able to see the forms of prophets, saints and angels. There you will meet also the image of your spiritual guide (murshid) who will lead you to the holy Prophet (may the blessings of God be upon him and his descendants), and the noble companions of the Prophet and the powerful saints. Whatever difficulties you might have, you can ask for their solutions from these images through the voice of your heart and the language of your spiritual state, and you will receive an apt reply from them. Thus the faith of your heart will increase in certitude and you will feel absolute tranquility in this spiritual world."], ["p", "If you see an image that appears to be the holy Prophet, know it for sure that this is really the Prophet (may the blessings of God be upon him and his descendants) because there is an authentic hadith in which he says, “He who has seen my image verily has seen me because tempting spirits cannot appear in my image.” It is clear that this saying refers to seeing the Prophet in the spiritual world."], ["p", "Owing to alienation from knowledge of the divine, human nature inclined to coarseness and became separated from its original refinement and subtlety. Therefore, this spiritual world serves to show the way for the human being to return to original refinement. This is so that the human beings may realize that their original nature is subtle but has become over-powered by coarse materiality."], ["p", "This is because the human being consists of both spirit (ruh) and body (badan). If a person is more drawn to the body than to the spirit, then that person’s spirit takes on the quality of the body and becomes more dense and obscure and coarse. But if, on the other hand, a person is more drawn to the spirit than to the body, then the body itself takes qualities of the spirit and it becomes more subtle, clear and light. As an illustration, the holy Prophet, that Leader of men, inclined more towards the spirit and exerted control over the body, such that his body itself had become extremely rarified and refined—so much so, that no fly ever landed on him and he did not cast any shadow on the ground. It was like air which is also refined; no fly can land on air, and it casts no shadow. Yet the spirit is even more subtle than air, such that nothing can obstruct its movement or prevent its activity. It is no wonder that the holy Prophet (may the blessings of God be upon him and his descendants) made his famous ascension to heaven (mi‵raj) in his physical body. And it is similarly understandable that Jesus (may God’s peace be upon him) is in the heavens in a physical body. For truly, “Our spirits are bodies and our bodies are our spirits.”\u000116\u0001"], ["p", "Therefore, my friend, when you proceed through this imaginative world (‵alam-i misal) into the spiritual world, you will realize that you can see there human spirits both good and bad, and you will find that angels even appear like the human spirits. When you experience this, be diligent to keep your concentration focused. You must stay focused on that spiritual world of subtlety for it is the true and original world, and the imaginative world of thought-forms and images is merely its shadow. You must stay focused on it until it becomes thoroughly clear to you. Then you will be able to see whatever you desire to see in the spiritual world. And when you have fully acclimatized yourself to the subtle world, then you will be blessed with an opening (fath) into the spiritual world."], ["p", "But always remember that the ultimate goal is not this! Do not let yourself remain entangled in this spiritual world, for you must find release from the engrossing whirlpool of this spiritual world. You should not content yourself with seeing its forms and images. You should not resign your heart to this world of appearances. You should never desire amazing disclosures (kashf) and miraculous powers (karamat) from it. Indeed, in this spiritual world there are wonderful powers of knowledge and ability, and with its help you can perform many miracles. For example, consider the following story."], ["p", "Once a boil developed on the eyelid of that blessed spiritual guide Miyan Mir. It was very painful, and he suffered much because of it. A surgeon was called in. He was asked the best way to treat it, and he said, “The sty must be lanced.” Just then Miyan Natha, one of the spiritually adept companions of Miyan Mir, interjected saying, “Wait for just a moment,” and directed his concentration to the spiritual world (‵alam-i malakut). There he saw a person and asked him, “What might be the remedy for the boil which had grown on the eyelid of Miyan Mir?” That spiritual being replied, “Grind cucumber seeds into a poultice and apply this to the boil.” Miyan Natha opened his eyes and said, “Do not cut open this boil on the eyelid of Miyan Mir, but rather apply a poultice of cucumber seed on it.” A paste of ground cucumber seed was made and rubbed on the sty, and it immediately relieved the problem. One present there asked Miyan Mir, “Does Miyan Natha have expert knowledge in eye diseases?” He replied, “He does not! Rather, in the spiritual world there are remedies for any problem. Miyan Natha simply directed his concentration (tawajjuh) to the spiritual realm, and from there he was told this remedy. Whatever is told in the spiritual world to one with a saintly heart (sahib-dil), without a doubt that will come to pass.” The person inquired again, “Do you not have the ability to get the remedy from the spiritual world yourself, that Miyan Natha had to find the cure for you?” Miyan Mir answered, “I have gone beyond the spiritual world, and to turn my concentration to that realm would be below my station.”"], ["p", "So it is, O friend, that many Sufis have gotten distracted by performing miracles in bargaining with the spiritual realm and have thereby missed the essential goal. Do not think that one should never enter this spiritual world! No, rather one should not get too comfortable there, for the spiritual realm is a station that the saints of God must pass through and transcend. Every spiritual seeker must pass through that place, but should never allow one’s attention to get deflected into that place. If one tarried there, the path becomes forked into a hundred paths in which he will be lost."], ["p", "In the way of the Sufis, conquering the spiritual world is a great conquest (fath-i ‵uzma) for any mystic. This was the method of Shaykh ‵Abd al-Qadir Jilani.\u000117\u0001 It is related by Shaykh ‵Umar Abu Jandiqi that, “Once I went to see Shaykh ‵Abd al-Qadir, the leader of all sages. He put a cap on my head, and its pleasant and cool sensation pervaded my mind and from my mind it penetrated into my heart. The spiritual world was revealed to me, and I heard the whole universe and all that existed in it glorifying God in different melodies and varied ways of declaring holy, holy, holy. It almost reached the point that my reason was overwhelmed, but the Shaykh put a piece of cotton into my ears and thereby preserved my intellect.”"], ["p", "My friend, when this spiritual world and realm of images becomes opened for you and conquest of it is granted, you must practice for some time the exercises (ashghal) of this Sufi path, so that your heart will be purified and illuminated. In this way, you must clear away the rust that has settled on the mirror of your heart, so that you may witness in it the beloved’s beauty. The heart is said to be the divine throne of the merciful One (‵arsh-i rahman). The meaning of this saying is that the spiritual reality of the divine essence (haqiqat-i zat) is cast into the human heart, and by focusing one’s concentration there, the senses that are dispersed in anxious confusion become gathered into unity."], ["p", "The great spiritual guide Miyan Mir used to tell his disciple, “You should recite the name of God (Allah) without moving the tongue, and gradually it will be recited by the heart. By constantly repeating this blessed name of God in the way described above, one will be granted a spiritual state (hal) in which one’s heart remains awake and aware even when one is sleeping.” My friend, this name —Allah—is the greatest name. It is universal and is common to both those who believe in Islam and who do not. In it are gathered into unity all the diverse names. There is nothing existing in the universe that is outside this name. This name is known as “the greatest name” (ism-i a‵zam), and this is because it possesses three attributes: creation, preservation and destruction. The whole creation and every atom of matter is integrally related to these three attributes, but no one is aware of this. And nobody knows the secret meaning of the greatest name except some of the great realized spiritual masters who are extremely rare."], ["p", "The method of spiritual practice which has been adopted by this lowly seeker is the suspension of breath (habs-i nafas). I have found this method to be the best and choicest method, without which success cannot be obtained. So everyone ought to practice this method of suspending the breath. Let it be done in this way. Sit in a secluded spot in the posture in which the holy Prophet— may God grant him blessings and peace—used to sit (on one’s knees as if for prayer), but do not place the hands upon the knees. Rather, place each elbow on the knees and reach up with the hands, and with the thumb close the hole of each ear so that no air may pass out of them. With the index fingers shut both eyes in such a way that the upper eyelid may remain firmly pressed against the lower eyelid, but without the fingers pressing on the eyeballs. Place the ring finger and pinkie of each hand on the upper and lower lips, so as to close the mouth and not permit breath to pass through it. Place the two middle fingers on the sides of the nose, the right middle finger on the right nostril, and the left middle finger on the left nostril."], ["p", "Having assumed this posture, first firmly close the right nostril with the right middle finger, so that air may not come through it. Leaving open the left nostril, breathe in slowly through the left nostril while saying “No god” (la ilaha) through that breath; while inhaling you draw the breath up above the mind and then bring it down to the heart. After this, also close firmly the left nostril with the left middle finger, and thus suspend the breath within the body. This is called “suspension of breath ” (habs-i nafas). Keep the breath suspended as long as you can easily do so without feeling suffocation. As you continue this practice, keep increasing slowly, by increments, the duration of suspending the breath. Then you should release the breath, opening the right nostril by removing the middle finger from it. As you exhale slowly and gently, you should say “but God” (illa allah) through the breath. If you exhale the breath quickly or forcefully, it will be injurious to you. Then you repeat this process (drawing in the breath through the left nostril, keeping both nostrils closed for some time, and releasing the breath through the right nostril)."], ["p", "Some who practice this method of meditation have carried this to such a extent that they pass the entire day of twelve hours by drawing in only four breaths. But my own spiritual guide, Mullah Shah (may God grant him peace and sustain his life) carried the practice to the point that he would, after making his night-time prayer (namaz-i isha), draw in a breath and keep it suspended, not releasing it until the time for the dawn prayer; he would keep a single breath suspended within him for the whole night, whether it was a long night of winter or a short night of summer. For fifteen years, he spent his nights in this way. Through the effect of this practice, he obtained a great conquest (fath-i ‵uzma) and the doors of spiritual fortune were opened to him."], ["p", "One of the benefits of this practice is that it eliminates the need for sleep. Thus it is now thirty years that Mullah Shah has not slept. This noble practice removes the rust from the mirror of the heart and purifies the defilements of the body. I have learned this practice, through a series of realized and actualized masters, from Shaykh ‵Abd al-Qadir Jilani (may the peace of the God be with him). He himself gave this practice a name and established its method, and he called it “engaged and conquered” (avurd o burd). Our great Qadiri master, Miyan Mir, made a small addition to the above method. He taught that during the period when the breath was kept suspended, the practitioner should repeat the words “No god” (la ilaha) with the voice of the physical organ of the heart (dil-i sanubari). While suspending the breath, the mind should not remain idle because an idle mind gives opportunity for negative thoughts. But when one concentrates on reciting “but God” (illa allah), all tempting thoughts are removed and one’s mind is retrained from focusing on any other object. Miyan Mir called this method of removing tempting thoughts while doing suspension of breath “struck and conquered” (zad o burd), because anyone who has struck the noble name of God on the target of his heart has scored the goal.\u000118\u0001"], ["p", "My friend, on this spiritual path there are many kinds of distracting and tempting thoughts, so Miyan Mir has established several methods of averting them so that these thoughts have no way of access to the seeker’s heart. The technique mentioned above (reciting “No god but God” during the duration of suspending the breath) is one among these methods. Another method is useful for anyone who suffers much from tempting thoughts while meditating. Concentrating on the physical organ of the heart (dil-i sanubari) can give rise to many such thoughts because the physical heart is the locus of temptations and distractions; therefore, a person in this condition should focus concentration instead on the spherical heart (dil-i mudawwar) and not on the physical organ that is shaped like a pine-cone. Because the spherical heart is pure of all qualities (be-rang), it provides no way of access for tempting thoughts, and distractions which cannot lodge there. Another method of removing tempting thoughts is to consider them as not separate from yourself and not something other than you."], ["p", "My friend, when you have engaged for some time in this noble practice of suspending the breath in the method described above, you will feel a wondrous heat, a strange buoyancy, a great longing, and a subtle illumination in your heart that pervades your entire being. This will totally banish the coarse qualities of distraction and negligence (ghaflat) which will completely vanish. Then you will feel a great spiritual delight (zauq) and indescribable ecstasy (wajd). The sweet delight of this practice, once tasted, will keep you from all idleness and indigence."], ["p", "But this practice has its limitations: it cannot be done at any time because a secluded place is a necessary condition for it. Therefore, so long as you are in a secluded place, you can remain engaged in this noble practice. But when you are traveling or keeping the company of others, the first practice which was described above is more appropriate (namely, reciting the name of God silently in each breath), because it can be done at all times and places."], ["p", "My friend, when you sit to practice suspending the breath, it is necessary that you persistently focus your concentration on your heart. This is because during this practice, voices will emerge from within you, just as Mawlana Rumi has described in his poem:"], ["v", ["On his lips is a lock but in his heart are secrets", "silence on the lips yet a heart full of voices", "bar labb-ash qafl ast o dar dil-ash razeh", "labb-i khamosh o dil pur az avazeh"]], ["p", "This voice sometimes comes with a sound like a big cauldron boiling. Sometimes it comes like the buzzing sound heard in the nest of bees. It is to this internal sound that one of the early Sufi master has alluded:"], ["v", ["Constant as the whispering hum of ants", "I listen for divine speech in my ear", "God is like a sun lighting the universe", "But lowly ones ask, “The divine is where?”", "sukhan-ha bin keh az moran numayad", "chu andar gosh-i ma goyad kalam u", "hameh ‵alam girifteh aftabi", "zehi gori keh mi-goyad kudam u"]], ["p", "Be careful, my friend, not to think that this sound is merely a voice within you. No, the whole universe is pervaded by this voice within each thing and beyond each thing."], ["v", ["Remove the cotton of conceit from your ears", "Partake of the sound of the overpowering One", "A call eternally coming from the one true being", "Why wait to hear it on the day of judgment?", "Bar avur panbeh-yi pindar-at az gosh", "nada-yi vahid al-qahhar bi-nosh", "nada mi-ayad az haqq bar davamat", "chera gashti tu mawquf-i qiyamat"]], ["p", "The true nature of this sound will become apparent to you in a moment when this text describes the practice called “The Prime Recitation” (sultan al-azkar). This is the essential teaching of the Qadiri Sufi masters and is rare and precious these days. It has come down with authentic proof—both external and internal —from the blessed Prophet to ‵Abd al-Qadir Jilani, and from him to the great teacher Miyan Mir. This practice of hearing the divine sound is called in the path of the Sufis “The Dominating Power of Recitation” (sultan al-azkar).\u000119\u0001"], ["p", "My friend, all sounds are of three kinds. The first kind is sound that is emitted when two objects strike against each other, like when the palms of the hands strike against each other and we hear the clap. But the motion of one hand alone cannot produce this external sound. This kind of sound is called “phenomenal” (muhdath) and “compound” (murakkab)."], ["p", "The second kind of sound is that which is produced without the contact of two dense bodies, or without the utterance of speech which is compounded from the mixing of the elements of heat and air within the human body.\u000120\u0001 This kind of sound is called “essential” (basit) and subtle (latif)."], ["p", "The third kind is the sound which is boundless and is eternal without any cause or means. This sound is fixed to one tone which neither increases nor decreases; it admits to no change and emits with no friction. Although the whole world is full of this primeval sound, yet none except the spiritually awakened knows of it. This sound existed from before the creation of the existing things, exists even now, and will always exist. This sound is called “infinite” (be-hadd) and “absolute” (mutlaq)."], ["p", "There is no practice better than that of hearing this sound. This is because every other practice depends upon the will of the practitioner; if he for a moment stops it, the practice ceases. But not so this practice! It does not depend upon the will of the practitioner. It is present and available without ceasing and without interruption at all times."], ["p", "From many authentic reports collected in the six authentic hadith collections, we learn that our Prophet (may the blessing and peace of God be on him) was devoted to this practice, both before the start of his mission as a prophet and after. But the religious scholars do not know the secret of its meaning and have not consequently followed the Prophet in this practice."], ["p", "A story is related by Khadija (the Prophet’s wife) that the Prophet, before he became a prophet, used to carry provisions with him and go stay in a cave. This was the cave of Hira, which is a famous and well-known place in the mountains outside of Mecca. He used to remain there for days together absorbed in this practice. There he used to practice this hearing of sound, which resulted in his being able to see the form of Gabriel before him. In this way, divine revelation began for that leader of humankind. That was start of it all, and all that happened after it, happened because of it."], ["p", "My friend, when you want to begin this practice “The Prime Recitation” (sultan al-azkar), and obtain this noble practice, you should do as follows. You must go either by day or by night to some deserted place which is free from the distractions of human interaction, or to a secluded and silent room.Sit there and direct your attention to your ears. Concentrate as hard and as long as you can until a very subtle sound manifests. Hearing this sound, it will gradually grow more powerful and overwhelming, so much so that will seem to come from all sides of you and there will be no place or no time when this sound will not manifest. This sound, which takes you away and beyond yourself, is a drop from the ocean of eternal resonance. So you can guess at its vastness."], ["v", ["Sit in a corner with your own ear, then speak and hear", "The world is entirely full of his silent speaking voice", "tu bi-gosh-i khwesh gushe bi-nah o bi-gu o bi-shanu", "keh jahan pur ast yek-sar ze sada-yi be-nava-esh"]], ["p", "It is said that Plato once said to Moses (may peace be upon him), “Are you the son of a menstruating woman, that you claim, ‘My God speaks to me,’ when the fact is that God is transcendent above place and time?” Moses replied, “Yes, I do claim that God talks to me, because from every side I hear a voice which is transcendent beyond beginning or end and is not compounded of syllables.” When Plato heard this, he believed in Moses and acknowledged that he was a messenger of God."], ["p", "Once people asked our Prophet (Muhammad) how revelation came to him. He replied, “I hear a sound sometimes like the sound of a boiling cauldron, and sometimes like the buzzing of honey bees, and sometimes in image of an angel in human form who speaks with me, and sometimes I hear a sound like resounding bells.” The poet Hafiz alluded to this sound in his verse:"], ["v", ["No one knows where the beloved resides", "One gets only the sound of a bell from there", "kas nadan-ast keh manzil-i dildar kuja-st", "in qadar hast keh bang-i jarasi mi-ayad"]], ["p", "Mawlana ‵Abd al-Rahman Jami has also described this sound when he writes:"], ["v", ["To my beloved’s caravan, I know, I can never draw near", "It is enough that the peal of its bell always reaches my ear", "dar qafilah keh u-st danam na-rasam", "in bas keh rasad bi-gosh bang-i jaras-am"]], ["p", "Miyan Mir used to explain that sometimes when the Prophet used to ride his camel, he would listen so intently to this eternal sound that he would be overwhelmed. At such times, he became so laden with power that his camel’s knees would buckle under his weight, and it would sit down on the ground.\u000121\u0001"], ["p", "My friend, the above description of how our Prophet received revelation is well known from reports that are preserved in the six canonical hadith collections. These hadith reports truly allude to hearkening to this primal sound (sultan al-azkar). Meditating by listening for this primordial sound, in the case of the prophets, allowed them to receive revealed scripture and divine commands. In contrast, in the case of saints (awliya), by meditating on this sound—without words, without source and without interruption—they find an immense power of will (jam‵iyat), spiritual delight (lazzat), rapture (wajd), and ecstasy (zauq). So powerful is this experience that it makes them leave aside all other spiritual exercises and experiences in favor of the rapturous bliss of this meditation. Thus they dive deep into the ocean of this sound, and leave not a trace of their name and existence behind.\u000122\u0001"], ["p", "Miyan Mir taught that ‵Abd al-Qadir Jilani used to say, “Our Prophet was in the cave of Hira for six years engaged in this meditation on the primordial sound called “The Prime Recitation” (sultan al-azkar). I myself have spent twelve years in that same cave practicing this meditation, and through it I received many amazing spiritual disclosures.”\u000123\u0001 Miyan Mir would comment, “I am bewildered by those pilgrims who undergo so much trouble and travel so far to Mecca to perform the Hajj rituals around the Ka‵ba, yet do not go visit this holy cave to receive any blessing from that sacred place!”"], ["p", "Miyan Mir had such regard for this noble practice, my friend, that he did not mention it to most of his disciples and companions. When he did mention it to some of them, he usually couched his explanation in allusions and hints. In the case of my guide, Mulla Shah (Hazrat Akhund), it took him a whole year to realize the true nature of this meditation practice. Mulla Shah also explained this to me through allusions, and I realized it in six months. I in turn have taught this practice to others, and they have realized it very quickly, in only three or four days! The reason for this is that my spiritual guide and his guide used to speak of it by allusion and parable, while I have explained it clearly without veiling it at all."], ["p", "When this sound manifests to your hearing, my friend, you must observe it keenly. You must try your hardest to preserve your ability to listen for it, until you can master it, so that just as you heard it in the silence of the wilderness or a closed room, you will also hear it in the noisy marketplace amid throngs of people. When you perfect this subtle and noble practice, this primordial sound will overpower the sounds of drums, even kettledrums or the loudest sounds which instruments can generate. And why should it not overpower them all, when it is the original source of them all, and every other sound manifests through it. Many disciples whom Miyan Mir had engaged in this practice used to go and sit in the marketplace amid the hustle and bustle, to test whether the sound heard in this noble meditation does indeed overpower all other sounds or not."], ["p", "Congratulations and blessings, my friend, if you become capable of this practice called “The Prime Recitation” (sultan al-azkar). For then the subtle world becomes apparent to you, and also an absolute being that is constant and eternal. If you perform this subtle practice, it will cause you to become more subtle in your very being, and plunge you into the ocean of subtlety and absolute being, free of conditions and qualities (itlaq be-rang). Then from within your heart will surge up the ocean of reality, which is the fountain-head of your being. Then you will know for yourself that every sound and voice that exists in this universe has come into existence through this primordial sound. In the same way, you know that all that exists with form and color has taken on form and color through absolute being which is formless and without color. Just as that absolute being is an unlimited immensity, so also the form and color that arise from it are also unlimited. Similarly, the sound of absolute being is of an unlimited immensity. No other thing remains before it with form and color, and no other sound remains in its presence."]]}]}, {"id": "d3", "title": "Chapter Three", "sub": "The Realm of Divine Might (‘alam-i jabarut)", "items": [{"title": "Chapter Three: The Realm of Divine Might (‘alam-i jabarut)", "blocks": [["p", "The realm of divine might (‵alam-i jabarut) is also called the causal realm (‵alam-i lazim) or the realm of singularity and empowerment (ahadiyat o tamkin). It is also called the formless realm (be-naqsh). Some Sufis call this the “realm of names and attributes” (asma o sifat), but they err in this. Many Sufis have realized this world of divine might and have therefore not understood it properly. If the “realm of names and attributes” exists as a world, then it must be considered as part of the spiritual realm. Or if it manifests in sensory perception, then it must be included in the human realm (‵alam-i nasut). In either case, it is not correct to consider the “names and attributes” to be the same as the realm of divine might."], ["p", "Only the great Sufi teacher ‵Abd al-Rahman Junaid has accurately described this realm. He says, “Being a Sufi means that you remain without grief, for even a moment.” Shaykh al-Islam has asked, “Do you know what is the meaning of being without grief? It means finding without searching and seeing without looking, because seeing through the eyes is imperfect and weak.”"], ["p", "Therefore, the realm of divine might is defined as a state of being in which one sees nothing that exists in the human realm or the spiritual realm. To such a person comes a state of oblivion (mahwiyat) when he experiences tranquility upon tranquility, and concentration within concentration (jam‵iyat). In this state, he does not care whether he is aware or ignorant of his own being in the human realm or the spiritual realm, and neither he does not care about being in the realm of divine might! Imagine a person who is heedless to his surroundings because he is in deep sleep, and is therefore unaware of the human realm and looks for nothing in the spiritual realm. He would say, “I was sleeping tranquilly and peacefully and I saw nothing in my sleep.” Being in the realm of divine might is like this: one is not conscious of any phenomenon in the human realm and is not aware of any event in the spiritual realm, yet knows bliss and joy. One understands it if one can sit for even a moment free of grief and pain, to which Abu’l-Qasim Junaid had alluded."], ["p", "One is experiencing the realm of divine might when one, in a waking state, is aware of no sensory forms or spiritual experiences, similar to one in a deep and blissful sleep. But there is a huge difference between a person who experiences this in a waking state and who experiences it only in sleep! The later experiences it without willing to experience it. But the former wills to experience it whether in a waking state or in sleep, and chooses to go into the realm of divine might."], ["p", "This is the posture for sitting when one wants to enter the realm of divine might. One should sit with tranquility and at ease. All the limbs of the body should be perfectly relaxed and free from any motion. Both the eyes should be closed. The right hand should rest overtop of the left. Then make the heart empty of all forms whether sensory or spiritual. No form should arise before one’s outer sight or inner vision. Thus when one can sit without any thought or image crossing one’s mind, one has found the realm of divine might. Only a person whom God wills to know this will realize the secret meaning of being in this realm."]]}]}, {"id": "d4", "title": "Chapter Four", "sub": "The Divine Realm (‘alam-i lahut)", "items": [{"title": "Chapter Four: The Divine Realm (‘alam-i lahut)", "blocks": [["p", "The divine realm (‵alam-i lahut) is sometimes also called the realm of he-is-he (huwiyat) or the realm of essence (zat), or the realm of purity (be-rang) or realm of absolute being (itlaq), or the realm of suchness (bahs). This realm is the origin and source for the human realm, the spiritual realm and the realm of divine might. It encompasses all these other realms. In relation to it, these realms are like the body and the divine realm is like the soul. They all derive from it and are animated by it and depend upon it and revert to it. Yet in and of itself, it is independent and unchanging in its essence. As the Qur’an says, “God is the first and the last, the apparent and the hidden, and God is the knower of all things.”\u000124\u0001 This divine realm encompasses and surpasses all the other realms just like the ocean encompasses the waves that it contains, or like the sun surpasses the dust motes that it illumines, or just as meaning transcends the words through which it manifests."], ["p", "My friend, turn all your faculties towards comprehending this divine realm when it begins to manifest to you, for from it springs all eternal bliss of witnessing divine unity (tawhid) and all never-ending fortune realizing the truth (tahqiq)."]]}]}, {"id": "d5", "title": "Chapter Five", "sub": "The Divine Truth (huwiyat)", "items": [{"title": "Chapter Five: The Divine Truth (huwiyat)", "blocks": [["p", "You should realize that “All is he” (hamah u-ast). Then ask who are you? You will be forced to admit that your very self is indeed the divine essence and can be nothing else! Then you will be free of the illusionary bonds of “I and you.” This is the truth of divine unity (haqiqat-i tawhid) and the self-disclosure of the essence (tajalli-i zati) “in their selves if only you would see.”\u000125\u0001 In order to comprehend the divine essence you must observe your own self. In this way, vain imagining (wahm) and whispered temptation (waswasa) should not find any way to inhabit your heart such that you think existing things veil the essence from your comprehension."], ["v", ["Can your seeing ice obscure the fact that the ice is water", "Even when the form of a bubble is trapped in the ice?", "God is an ocean of reality on which floats this world", "As ice floats on water, yet water is what makes up ice", "har giz na kunad ab hijab andar yakh", "ba-an-keh kunad naqsh hubab andar yakh", "haqq bahr-i haqiqat ast o kawnain dar-u", "chun yakh bi-miyan-i ab o ab andar yakh"]], ["p", "If any distracting thought comes to you, just consider it also to be one with the divine essence. Then just as the divine essence is perfect, its perfection will come to dominate that distracting thought and it will no long be a distraction. When your state reaches perfection in this way, wherever you look you will see yourself and whatever place you search for you will find yourself."], ["p", "Beware of thinking that the divine essence is wholly characterized by transcendence (tanazzuh) and purity and absence of all qualities, lest you might remain untouched by the bliss of the divine’s being related by similarity to existing things (tashbih). Likewise beware of thinking that the divine essence is characterized solely by similarity and resemblance, lest you miss out of the great gift of recognizing the divine’s incomparable difference from all that exists (tanzih). Enough! Purity and impurity, transcendence and immanence, all are manifest and take their existence from this divine essence. If you imagine that a single mote of dust is separate from the divine essence then you have lost the blessing of witnessing divine unity (tawhid) and mystical comprehension (‵irfan)."], ["p", "My friend, when the ocean of divine reality stirs, then waves and forms appear upon its surface. It generates a hundred thousand bubbles and swirls that are the innumerable heavens and earths that emerge in this cosmos. All this multiplicity emerges from that singular ocean and can never be separate from it! If you wanted to separate a wave or a pattern from the surface of the ocean, could you ever achieve this? Never. Although these things are separate in name and designation, they are united in essence and in ultimate reality they are one."], ["v", ["Shall I tell you of unity, so no misgiving persists?", "Apart from God there is nothing that really exists", "Those things that you see and think separate", "In essence all is one, but each of a name consists", "Tawhid bi-goyam, ar bi-fahmi bada", "mawjud na-bud heech gah ghayr khuda", "An-ha keh tu mi-beeni o mi-dani ghayr", "dar zat hamah yeki-st o dar nam juda"]]]}]}, {"id": "d6", "title": "Chapter Six", "sub": "Recognizing Reality", "items": [{"title": "Chapter Six: Recognizing Reality", "blocks": [["p", "Consider the reality of water. When water is not bound, it is free of color and has no fixed form. But when water is bound in a solid, it assumes various forms such as ice or snow or hail. Observe closely and decide for yourself whether or not the ice, snow and hail consist of the same essential water which is itself colorless and formless. When ice, snow and hail become melted, they all become resolved into water—then do you call it water or something else? All who recognize reality and who have eyes to see the truth will readily recognize the essential nature of water despite the various forms and appearance that it can adopt under different conditions."], ["v", ["The ocean of existence is just the essence so generous", "like patterns on the water are spirits and soul numerous", "it is a singular sea which is stirred into motion diverse", "here a drop, there a wave, everywhere bubbles tenuous", "darya-st wujud sirf zat-i wahhab", "arvah o nufus ham-chu naqsh andar ab", "bahri-st keh mauj bi-zanad andar khud", "gah qatrah gah ast mauj gahi-st hubab"]], ["p", "Those who are ignorant are bound up in seeing superficial appearance, phenomenal condition and apparent difference. This is the difference between the ignorant and the sages. Mystical knowledge (‵irfan) is nothing but this: that you recognize your own real nature. Then you will realize that you are nothing but the divine essence, since all are one (hame u-st). It is impossible that anything exists other than God."], ["p", "There are many metaphors to depict this reality. For example, on a page are depicted a picture, words and the meaning; all appear through the mediation of ink and appear to be different, yet all are in reality one. Or for example, the root, leaf, branch and fruit of a tree appear to be different, but all are in reality from the singular seed. The diversity and multiplicity of appearances do not negate the essential unity from which it all arises."], ["v", ["Essential unity against all duality raves", "If you’re blind, find a cure which saves", "From one come many, yet it is still one", "The ocean is never separate from waves", "kardah az yiganigi du’i ra taraj", "bayad keh kuni kaj-i khud ra tu ‵ilaj", "vahid mutakassar na-shavad az i‵dad", "darya mutajazzi na-shavad az amvaj"]], ["p", "For the sake of brevity, this text contents itself with only the illustrations given above."], ["p", "My friend, the absolute essence—the sun of ultimate reality and height of unqualified divinity—is described in the saying “I was a hidden treasure.” When that essence manifests in intimacy with you, it makes clear the saying “I loved to be known.”\u000126\u0001 Then the essence discards the veil of concealment, and the perfection of the essence becomes limited in a form for the sake of taking delight in union and beholding itself in a gaze of love. Now if you seek union with absolute being (mutlaq), you cannot find it except in a form that is limited (muqayyad). Likewise, if you seek that hidden treasure in a limited form, you cannot find it except in the absolute."], ["p", "The absolute is always in the limited, and the limited is always with the absolute. It is truth that the limited form is not a veil obscuring absolute being. Existing beings do not exist independently from the absolute being. No! Rather, whatever you lay hands upon is a being that manifests the very essence of absolute divine being without any obscuring concealment. Whatever you may see is a disclosure of the beauty of absolute being without any obscuring veil."], ["v", ["There is nothing in this universe that is other than you", "Whatever comes before you is just you confronting you", "nist biganah kas darin ‵alam", "dast bar har cheh mi-nahi khud pish"]], ["p", "To the same effect is the following quatrain:"], ["v", ["I’ll tell you advice, for good thought it is fodder", "If you’re a man never leave the path to God’s presence", "Its manifestations can never veil the divine essence", "Do ripples on water keep one from touching the water?", "goyam sukhani ze ru-yi tahqiq o savab", "gar mard rahi qabul kun ru’i ma-tab", "har giz na-bud sifat o zat hijab", "ki naqsh bar ab mani‵ ast u mass-i ab"]], ["p", "This leads to the last and greatest method of meditation, my friend, in this noble Sufi way. That is to sit grasping one’s own true nature, such that, in spite of all your limitations, consider yourself as the very absolute being and only existence. In this state, whatever comes to your sight as other than yourself you should recognize as identical to your self. In this way one extirpates the very root of duality and discards the veils of alienation and separation. One sees everything as partaking of one essence, and realizes the bliss of self merging with self, as alluded to in this verse:"], ["v", ["My beloved Laila, from me or Majnun can never", "be separate", "From the circle of its rays of light, can a candle ever", "be separate", "Yar-i laila-vash-i man ghayr-i man o majnun nist", "Shama ‵ az da’ira-yi partau-yi khud birun nist"]], ["p", "And on this very subject a great Sufi once alluded, saying:"], ["v", ["From my own bosom I discover each moment", "the aroma of him I love", "So I always draw my own self to my bosom", "in a constant embrace", "Az kinar-i khwesh mi-yabam damadam bu-yi yar", "ze an hamin giram hamesha khweshtan ra dar kinar"]], ["p", "My friend, those who have firmly realized this intimate relation (nisbat) are ennobled by true knowledge of the real self which is greatest elixir [that endows eternal life] and the rarest red sulfur [which brings everlasting happiness]. They obtain release from wandering in the wilderness of negligence and ignorance, and gain liberation from the anxiety of searching and craving, and are free from the doubts and temptations of dispute."], ["v", ["A drop is just a drop as long as it believes it is separate from the sea", "A man is bound by his limited self until he knows that God is he", "qatra qatra ast ta na pindarad keh az darya juda-st", "banda band-i khweshtan ra ta na-mi-danad khuda-st"]], ["p", "A similar idea is expressed in this quatrain:"], ["v", ["Hey you, who are lost searching for divinity", "You’re other than God? You’re God in reality!", "In your foolish searching you are just like", "A drop in the depths that searches for the sea", "Ay an-keh khuda’i ra bi-ju’i har ja", "tu ‵ain-i khuda’i na juda’i bi-khuda", "in justan-i tu hamin bi-an mi-manad", "qatrah bi-miyan-i ab o juyad darya"]], ["p", "When you have reached this highest level, then over you arises the sun of spiritual reality and essential unity. Then are lifted from you all the traces of delusion and selfish conceit. At this point, the veil of darkness is removed from you."], ["v", ["As long as a veil remains between you and your love", "You long for the beauty and perfection of his face", "Yet your frame of vision is the veil you long to remove", "Abandon the frame, so no dust of dualism leaves a trace", "har chand niqab dar miyan darad yar", "ru-yash khush o khub mi-numayad besyar", "chun ‵ainak-i tu bud niqab-i rukh-i yar", "‵ainak na kunad bi pish chashm-i tu ghubar"]], ["p", "At this level, all are unified as one: the meditation, the one meditating, and the object of meditation (zikr o zakir o mazkur). The author of the book Divine Flashes (Lama‵at by Fakhr al-Din ‵Iraqi) describes this station beautifully:"], ["v", ["In this place beloved, love and lover are all one not three", "If there is no scope for union, how can there separation be?", "ma‵shuq o ‵ishq o ‵ashiq har seh yeki-st in-ja", "chun vasl dar na-gunjad hijran cheh kar darad"]], ["p", "When a spiritual guide has led the sincere seeker to this level and allowed him to understand this subtle principle, then the guide dedicates him to God and leaves off teaching him any further. There is no more scope for teaching, because it is not right for one to try to teach God."], ["p", "My friend when you come to know this essential principle and thereby realize what is the real meaning of distance and alienation from the beloved, then may you always be happy."], ["v", ["In separation from you I suffered anxiety", "From union with you I lost my life and piety", "What bliss it is that enraptures my being", "Now my body and soul enjoy tranquility", "dar hijr-tu budeh anduh azar-am", "az vasl-i tu raft hasti o pindar-am", "shadi amad nasib-i jan-am gardid", "aknun tan o jan khud bi-rahat daram"]], ["p", "At that point, your own being has become one with universal being. Therefore, from your heart is lifted sorrow, anxiety, delusion, duality and alienation. Fearing punishment and coveting reward are also gone, for your path is before you that leads to eternal liberation (najat). So now do whatever you desire, and live in whatever way you like."], ["v", ["Chose to get wisdom, my friend! Riches and power defer", "If wisdom you have, then you’ll get whatever else you chose", "Badshahi ra guzar ay dost agahi guzin
